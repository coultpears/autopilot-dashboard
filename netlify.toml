[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # pg is marked external because esbuild can't bundle native modules cleanly
  # and pg's pure-JS path needs to load at runtime from node_modules. Netlify
  # installs it during the build via package.json dependencies.
  external_node_modules = ["pg"]
  # Include the repo-committed data files in every function bundle.
  # Without this, fs.readFileSync in _geocode-cache.js / _partner-aliases.js
  # finds nothing in prod and pins fall back to jittered market centers.
  # data/revshare.json stays in the bundle as a fallback when NEON_DATABASE_URL
  # isn't set (graceful dev mode + rollback path during the Postgres cutover).
  included_files = ["data/**"]

[functions."grid-data"]
  timeout = 30

[functions."property-detail"]
  timeout = 30

[functions."grid-history"]
  timeout = 30

# Background warmer for the property-detail Neon cache. Refreshes a small batch
# of the stalest properties on a cadence so UI opens hit a warm cache. Kept
# under the function time budget (small batch + low concurrency); a cut-off or
# failed run is harmless (read-through path covers un-warmed properties).
# Every 30 min (was 15) — the grid-data full rebuild inside is additionally
# gated to ~hourly (GRID_WARM_REFRESH_MS) since its data only changes daily;
# that's the main lever on Neon data-transfer egress.
[functions."warm-property-cache"]
  schedule = "*/30 * * * *"
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
