<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Supply Map — Landing</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A61D9'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='20' fill='white'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* ─── Landing 2.0 brand ─── */
  --landing-navy: #15192D;
  --landing-tonal: #2D3654;
  --landing-blue: #1A61D9;
  --landing-baby: #E7EFFB;
  --landing-off: #F0F0F0;
  --landing-teal: #156082;

  /* ─── Surfaces (warm off-white ground) ─── */
  --surface-0: #FAFAF9;   /* app canvas */
  --surface-1: #FFFFFF;   /* cards, panels */
  --surface-2: #F4F5F7;   /* subtle fill */
  --surface-3: #EBEDEF;   /* raised fill */
  --surface-cream: #F0F0ED;

  /* ─── Ink ─── */
  --ink-0: #15192D;       /* body / display */
  --ink-1: #2D3654;       /* secondary display */
  --ink-2: #52566B;       /* secondary text */
  --ink-3: #8A8D99;       /* tertiary / muted */
  --ink-4: #B5B9C3;       /* disabled / faint */

  /* ─── Semantic ─── */
  --success: #08786C;
  --warning: #B95B00;
  --error:   #EE533D;
  --info:    #1A61D9;

  /* ─── Accent tints (subtle) ─── */
  --blue-tint:    rgba(26, 97, 217, 0.08);
  --blue-tint-2:  rgba(26, 97, 217, 0.14);
  --success-tint: rgba(8, 120, 108, 0.09);
  --warning-tint: rgba(185, 91, 0, 0.09);
  --error-tint:   rgba(238, 83, 61, 0.09);
  --teal-tint:    rgba(21, 96, 130, 0.09);
  --navy-tint:    rgba(21, 25, 45, 0.06);

  /* ─── Hairlines ─── */
  --line-0: rgba(21, 25, 45, 0.06);
  --line-1: rgba(21, 25, 45, 0.10);
  --line-2: rgba(21, 25, 45, 0.16);

  /* ─── Shadows (restrained) ─── */
  --elev-1: 0 1px 2px rgba(21,25,45,0.04), 0 1px 3px rgba(21,25,45,0.03);
  --elev-2: 0 1px 2px rgba(21,25,45,0.05), 0 4px 12px rgba(21,25,45,0.05);
  --elev-3: 0 2px 4px rgba(21,25,45,0.06), 0 12px 28px rgba(21,25,45,0.08);

  /* ─── Typography ─── */
  --font-display: 'Instrument Sans', 'DM Sans', -apple-system, sans-serif;
  --font-body:    'DM Sans', 'Instrument Sans', -apple-system, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  /* ─── Scale ─── */
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-xl: 12px;

  /* ─── Legacy aliases (don't remove — used by existing selectors/inline JS) ─── */
  --navy: var(--surface-0);
  --navy-mid: var(--surface-1);
  --navy-light: var(--surface-2);
  --panel: var(--surface-1);
  --blue: var(--landing-blue);
  --blue-dim: var(--blue-tint);
  --green: var(--success);
  --green-dim: var(--success-tint);
  --orange: var(--warning);
  --orange-dim: var(--warning-tint);
  --red: var(--error);
  --white: var(--ink-0);
  --silver: var(--ink-2);
  --muted: var(--ink-3);
  --ghost: var(--line-0);
  --border: var(--line-1);
  --radius: var(--r-xl);
}

html { font-size: 14px; }
body {
  font-family: var(--font-body);
  background: var(--surface-0);
  color: var(--ink-0);
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
  font-feature-settings: "ss01", "ss02", "cv01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Universal tabular numbers — every stat, KPI, table cell aligns like a report */
.num, .grid-stat-val, .bb-val, .detail-kpi-val, .occ-val,
.gd-unit, .detail-metric, .res-chip, .gd-badge-curr, .gd-badge-future,
.gd-badge-vacant, .gd-badge-standby, .gd-badge-other, .status-badge,
code, pre, kbd { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ─── NAV ─── */
.topnav {
  z-index: 1000; height: 60px; flex-shrink: 0;
  background: var(--surface-1);
  border-bottom: 1px solid var(--line-1);
  padding: 0 24px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  position: relative;
}
/* Hairline accent on nav bottom edge */
.topnav::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--landing-blue) 50%, transparent 100%);
  opacity: 0.3;
}
.topnav-left { display: flex; align-items: center; gap: 14px; justify-self: start; }
.topnav-nav { justify-self: center; }
.topnav-right {
  justify-self: end; display: flex; align-items: center; gap: 12px;
  padding-left: 20px; white-space: nowrap;
}
@media (max-width: 1024px) { .topnav h1 span { display: none; } }
@media (max-width: 880px) { .view-switch-label { display: none; } }
.logo-mark {
  width: 30px; height: 30px; background: var(--landing-navy); border-radius: 6px;
  display: grid; place-items: center; position: relative;
  font-family: var(--font-display); font-weight: 600; font-size: 0.95rem;
  color: #fff !important; letter-spacing: -0.02em;
}
/* Tiny bright-blue corner tick — a subtle brand signature */
.logo-mark::after {
  content: ''; position: absolute; bottom: -1px; right: -1px;
  width: 8px; height: 8px; background: var(--landing-blue); border-radius: 0 0 6px 0;
}
.topnav h1 {
  font-family: var(--font-display); font-size: 1rem; font-weight: 600;
  color: var(--ink-0); letter-spacing: -0.01em;
  display: flex; align-items: baseline; gap: 10px;
}
.topnav h1 span {
  color: var(--ink-3); font-weight: 400; font-size: 0.78rem;
  padding-left: 10px; border-left: 1px solid var(--line-1);
  text-transform: uppercase; letter-spacing: 0.08em;
}
/* ─── PRIMARY NAV (segmented control, anchored center) ─── */
.nav-links {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-lg);
  padding: 3px;
  box-shadow: 0 1px 2px rgba(21,25,45,0.03) inset;
}
.nav-links a {
  font-family: var(--font-display);
  color: var(--ink-2); text-decoration: none;
  font-size: 0.78rem; font-weight: 500;
  padding: 7px 16px; border-radius: var(--r-md);
  transition: all 0.15s;
  letter-spacing: -0.005em;
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.nav-links a:hover { color: var(--ink-0); background: var(--surface-1); }
.nav-links a.active {
  color: #fff !important;
  background: var(--landing-navy);
  font-weight: 500;
  box-shadow: 0 1px 2px rgba(21,25,45,0.12);
}
.nav-links a svg { width: 13px; height: 13px; stroke-width: 2; }

/* Live data indicator — a pulsing teal dot, quiet confidence */
.live-indicator {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 0.64rem; font-weight: 500;
  color: var(--landing-teal); text-transform: uppercase; letter-spacing: 0.1em;
  padding: 4px 10px; border-radius: 4px; background: var(--teal-tint);
}
.live-indicator::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--landing-teal); animation: livePulse 2s ease-in-out infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(21,96,130,0.4); }
  50% { opacity: 0.85; transform: scale(1.1); box-shadow: 0 0 0 4px rgba(21,96,130,0); }
}

/* ─── CONTROL PANEL (top-left, floating) ─── */
.map-controls {
  position: absolute; top: 76px; left: 16px; z-index: 900;
  display: flex; flex-direction: column; gap: 8px;
}
.control-group {
  background: var(--surface-1);
  border: 1px solid var(--line-1); border-radius: var(--r-lg);
  padding: 4px;
  box-shadow: var(--elev-1);
  display: flex; flex-direction: column; gap: 0;
}
.control-group.row { flex-direction: row; gap: 2px; padding: 3px; }
.pill {
  font-family: var(--font-display); font-size: 0.76rem; font-weight: 500;
  padding: 8px 14px; border: none; border-radius: var(--r-md); cursor: pointer;
  background: transparent; color: var(--ink-2); transition: all 0.15s;
  text-align: left; white-space: nowrap; letter-spacing: -0.005em;
  position: relative;
}
.pill:hover { color: var(--ink-0); background: var(--surface-2); }
.pill.active {
  background: var(--landing-navy); color: #fff !important;
  font-weight: 500;
}

/* ─── LEGEND ─── */
.map-legend {
  position: absolute; bottom: 88px; left: 16px; z-index: 900;
  background: var(--surface-1);
  border: 1px solid var(--line-1); border-radius: var(--r-lg);
  padding: 12px 14px; box-shadow: var(--elev-1);
  min-width: 200px;
}
.legend-title {
  font-family: var(--font-mono); font-size: 0.6rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3);
  margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line-0);
}
.legend-item {
  display: flex; align-items: center; gap: 10px; padding: 3px 0;
  font-size: 0.74rem; color: var(--ink-1); font-weight: 500;
}
.legend-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(21,25,45,0.06);
}

/* ─── SEARCH ─── */
.search-box {
  position: absolute; top: 76px; right: 16px; z-index: 1100;
  width: 320px;
}
.search-input {
  width: 100%; padding: 10px 14px 10px 38px;
  background: var(--surface-1);
  border: 1px solid var(--line-1); border-radius: var(--r-lg);
  font-family: var(--font-body); font-size: 0.82rem; font-weight: 400;
  color: var(--ink-0); outline: none;
  box-shadow: var(--elev-1);
  transition: all 0.15s;
  letter-spacing: -0.005em;
}
.search-input:focus {
  border-color: var(--landing-blue);
  box-shadow: var(--elev-1), 0 0 0 3px var(--blue-tint);
}
.search-input::placeholder { color: var(--ink-3); }
.search-icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  color: var(--ink-3); font-size: 0.85rem; pointer-events: none;
  display: flex; align-items: center;
}
/* Keyboard shortcut hint in search */
.search-box::after {
  content: '/'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
  color: var(--ink-3); padding: 2px 6px;
  border: 1px solid var(--line-1); border-radius: 4px; background: var(--surface-2);
  pointer-events: none; line-height: 1;
}
.search-box:focus-within::after { opacity: 0; }

.search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--surface-1);
  border: 1px solid var(--line-1); border-radius: var(--r-lg);
  max-height: 420px; overflow-y: auto;
  box-shadow: var(--elev-3);
  display: none; z-index: 1200;
  padding: 4px;
}
.search-results.open { display: block; }
.search-result {
  padding: 10px 12px; cursor: pointer; transition: background 0.1s;
  border-radius: var(--r-md);
}
.search-result:hover { background: var(--surface-2); }
.search-result-name {
  font-family: var(--font-display); font-weight: 500;
  font-size: 0.84rem; color: var(--ink-0);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.search-result-meta {
  font-size: 0.7rem; color: var(--ink-2); margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.search-result-type {
  display: inline-block; font-family: var(--font-mono); font-size: 0.58rem;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em;
  padding: 2px 7px; border-radius: 3px;
}
.type-partner      { background: var(--blue-tint);    color: var(--landing-blue); }
.type-market       { background: var(--navy-tint);    color: var(--landing-navy); }
.type-property     { background: var(--success-tint); color: var(--success); }
.type-target       { background: var(--error-tint);   color: var(--error); }
.type-target-owner { background: var(--blue-tint);    color: var(--landing-blue); }
.type-target-rep   { background: var(--success-tint); color: var(--success); }
.type-location     { background: var(--warning-tint); color: var(--warning); }

/* ─── DEINSTALL TOGGLE ─── */
.overlay-toggle {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; margin: 0;
  background: transparent; border: none; border-radius: var(--r-md);
  font-family: var(--font-body); font-size: 0.76rem; font-weight: 500;
  color: var(--ink-2); cursor: pointer;
  transition: all 0.15s; user-select: none;
}
.overlay-toggle:hover { color: var(--ink-0); background: var(--surface-2); }
.overlay-toggle.active { color: var(--error); }
.overlay-toggle input {
  accent-color: var(--error); cursor: pointer; margin: 0;
  width: 12px; height: 12px;
}

/* ─── TIME PERIOD PILLS ─── */
.period-pill {
  font-family: var(--font-mono); font-size: 0.68rem; font-weight: 500;
  padding: 5px 10px; border: none; border-radius: var(--r-sm); cursor: pointer;
  background: transparent; color: var(--ink-3); transition: all 0.15s;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.period-pill:hover { color: var(--ink-0); background: var(--surface-2); }
.period-pill.active {
  background: var(--landing-navy); color: #fff;
}

/* ─── CONTROL DIVIDER ─── */
.control-divider {
  height: 1px; background: var(--line-0); margin: 4px 10px;
}

/* ─── DETAIL PANEL (right side — sits below search box) ─── */
.detail-panel {
  position: absolute; top: 136px; right: 16px; bottom: 16px;
  width: 380px; z-index: 800;
  background: var(--surface-1);
  border: 1px solid var(--line-1); border-radius: var(--r-xl);
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transform: translateX(12px);
  transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: var(--elev-2);
  overflow: hidden;
}
.detail-panel.open { opacity: 1; pointer-events: auto; transform: translateX(0); }
.detail-panel-header {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--line-0);
  position: relative;
  background: var(--surface-1);
}
/* Brand tick on panel header */
.detail-panel-header::before {
  content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 28px;
  background: var(--landing-blue); border-radius: 0 2px 2px 0;
}
.detail-panel-title {
  font-family: var(--font-display); font-weight: 600; font-size: 1.15rem;
  letter-spacing: -0.015em; color: var(--ink-0);
  margin-bottom: 3px; padding-right: 30px; line-height: 1.2;
}
.detail-panel-subtitle {
  font-family: var(--font-mono); font-size: 0.66rem;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.12em;
  font-weight: 500;
}
.detail-panel-kpis {
  display: flex; gap: 0; padding: 14px 20px;
  border-bottom: 1px solid var(--line-0);
  background: var(--surface-2);
}
.detail-kpi {
  flex: 1; text-align: left;
  padding-right: 12px; border-right: 1px solid var(--line-0);
}
.detail-kpi:last-child { border-right: none; padding-right: 0; }
.detail-kpi + .detail-kpi { padding-left: 12px; }
.detail-kpi-val {
  font-family: var(--font-display); font-weight: 600; font-size: 1.3rem;
  color: var(--ink-0); letter-spacing: -0.02em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.detail-kpi-label {
  font-family: var(--font-mono); font-size: 0.58rem;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.12em;
  font-weight: 500; margin-top: 4px;
}
.detail-panel-tabs {
  display: flex; gap: 0; padding: 0 20px;
  border-bottom: 1px solid var(--line-0);
  background: var(--surface-1);
}
.detail-tab {
  font-family: var(--font-display); font-size: 0.76rem; font-weight: 500;
  padding: 10px 4px; margin-right: 16px; border: none; cursor: pointer;
  background: transparent; color: var(--ink-2); transition: all 0.15s;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  letter-spacing: -0.005em;
}
.detail-tab:hover { color: var(--ink-0); }
.detail-tab.active {
  color: var(--ink-0); border-bottom-color: var(--landing-blue);
  font-weight: 600;
}
.detail-panel-list {
  flex: 1; overflow-y: auto; padding: 4px 0;
  background: var(--surface-1);
}
.detail-panel-list::-webkit-scrollbar { width: 8px; }
.detail-panel-list::-webkit-scrollbar-track { background: transparent; }
.detail-panel-list::-webkit-scrollbar-thumb {
  background: var(--ink-4); border-radius: 4px;
  border: 2px solid var(--surface-1); background-clip: padding-box;
}
.detail-panel-list::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: padding-box; border: 2px solid var(--surface-1); }

.detail-section-label {
  font-family: var(--font-mono); font-size: 0.6rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3);
  padding: 10px 20px 4px;
}
.detail-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 20px; transition: background 0.1s; cursor: pointer;
  border-bottom: 1px solid var(--line-0);
  position: relative;
}
.detail-row:hover { background: var(--surface-2); }
.detail-row.target-row:hover { background: var(--error-tint); }
.detail-row-info { flex: 1; min-width: 0; }
.detail-row-name {
  font-family: var(--font-display); font-size: 0.85rem; font-weight: 600;
  color: var(--ink-0); letter-spacing: -0.005em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 4px;
}
.detail-row-market {
  font-size: 0.72rem; color: var(--ink-2); margin-top: 3px;
  letter-spacing: -0.003em;
}
.detail-row-metrics {
  display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
  align-items: center;
}
.detail-metric {
  font-family: var(--font-mono); font-size: 0.66rem;
  padding: 2px 8px; border-radius: var(--r-sm);
  font-weight: 500; white-space: nowrap;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
}
.detail-metric.units     { background: var(--surface-3);    color: var(--ink-1); }
.detail-metric.vacant    { background: var(--error-tint);   color: var(--error); }
.detail-metric.concession{ background: var(--warning-tint); color: var(--warning); }
.detail-metric.target-badge { background: var(--error-tint); color: var(--error); }
.detail-metric.lease-up  { background: rgba(139,92,246,0.09); color: #7C3AED; }

.detail-close {
  position: absolute; top: 14px; right: 14px; z-index: 10;
  width: 28px; height: 28px; border-radius: var(--r-md); border: none;
  background: transparent; color: var(--ink-3); cursor: pointer;
  font-size: 1.1rem; display: grid; place-items: center; transition: all 0.1s;
  line-height: 1;
}
.detail-close:hover { background: var(--surface-2); color: var(--ink-0); }
.detail-back {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 20px; font-family: var(--font-display);
  font-size: 0.76rem; font-weight: 500;
  color: var(--landing-blue); cursor: pointer;
  border-bottom: 1px solid var(--line-0);
  transition: background 0.1s;
}
.detail-back:hover { background: var(--surface-2); }
.detail-back svg { width: 12px; height: 12px; }

/* ─── BOTTOM BAR (ticker-style stats) ─── */
.bottom-bar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 900;
  display: flex; gap: 0;
  background: var(--surface-1);
  border: 1px solid var(--line-1); border-radius: var(--r-lg);
  padding: 12px 8px;
  box-shadow: var(--elev-2);
  position: relative;
}
/* Subtle brand accent on top edge */
.bottom-bar::before {
  content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--landing-blue), transparent);
  opacity: 0.4;
}
.bb-stat {
  text-align: left; padding: 0 18px;
  border-right: 1px solid var(--line-0);
  min-width: 88px;
}
.bb-stat:last-child { border-right: none; }
.bb-val {
  font-family: var(--font-display); font-size: 1.3rem; font-weight: 600;
  color: var(--ink-0); letter-spacing: -0.02em; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.bb-label {
  font-family: var(--font-mono); font-size: 0.58rem;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.12em;
  font-weight: 500; margin-top: 4px;
}

/* ─── MAP ─── */
#map {
  flex: 1; z-index: 1;
  background: var(--surface-0);
}
/* Subtle grid overlay on map edges via pseudo-element (editorial texture) */
.leaflet-container { font-family: var(--font-body); }
.leaflet-control-zoom { border: none !important; margin-bottom: 80px !important; margin-right: 12px !important; }
.leaflet-control-zoom a {
  background: var(--surface-1) !important; color: var(--ink-1) !important;
  border: 1px solid var(--line-1) !important;
  width: 32px !important; height: 32px !important;
  line-height: 32px !important; font-size: 15px !important;
  box-shadow: var(--elev-1) !important;
  font-family: var(--font-body) !important;
}
.leaflet-control-zoom a:hover { background: var(--surface-2) !important; color: var(--ink-0) !important; }
.leaflet-control-zoom a:first-child { border-radius: var(--r-md) var(--r-md) 0 0 !important; border-bottom: none !important; }
.leaflet-control-zoom a:last-child { border-radius: 0 0 var(--r-md) var(--r-md) !important; }
.leaflet-control-attribution { display: none !important; }

/* ─── BUBBLE LABELS (market bubbles) ─── */
.bubble-label {
  background: none !important; border: none !important; box-shadow: none !important;
  font-family: var(--font-mono); font-weight: 500; color: #fff;
  text-align: center; pointer-events: none !important;
  text-shadow: 0 1px 3px rgba(21,25,45,0.5);
  font-variant-numeric: tabular-nums;
}

/* ─── TOOLTIP (Leaflet hover) ─── */
.leaflet-tooltip {
  background: var(--surface-1) !important;
  color: var(--ink-0) !important;
  border: 1px solid var(--line-1) !important;
  border-radius: var(--r-lg) !important;
  padding: 11px 14px !important;
  font-family: var(--font-body) !important;
  font-size: 0.78rem !important;
  box-shadow: var(--elev-3) !important;
  max-width: 280px !important;
}
.leaflet-tooltip::before,
.leaflet-tooltip-top::before { border-top-color: var(--surface-1) !important; }
.leaflet-tooltip-bottom::before { border-bottom-color: var(--surface-1) !important; }

/* ─── POPUP (selected target) ─── */
.target-highlight-popup .leaflet-popup-content-wrapper {
  background: var(--surface-1);
  border-radius: var(--r-lg);
  box-shadow: var(--elev-3);
  padding: 4px;
  border: 1px solid var(--line-1);
}
.target-highlight-popup .leaflet-popup-content {
  margin: 12px 16px; font-family: var(--font-body);
  font-size: 0.78rem; color: var(--ink-0);
}
.target-highlight-popup .leaflet-popup-tip { background: var(--surface-1); }
.target-highlight-popup .leaflet-popup-close-button {
  color: var(--ink-3) !important; font-size: 18px !important;
  top: 6px !important; right: 8px !important;
}
.target-highlight-ring {
  animation: targetPulse 1.6s ease-in-out infinite;
  transform-origin: center;
}
@keyframes targetPulse {
  0%, 100% { stroke-opacity: 1; stroke-width: 4; }
  50% { stroke-opacity: 0.55; stroke-width: 6; }
}

/* Tooltip row typography */
.tt-name {
  font-family: var(--font-display);
  font-weight: 600; font-size: 0.88rem;
  color: var(--ink-0); letter-spacing: -0.01em;
  margin-bottom: 4px; line-height: 1.25;
}
.tt-row {
  display: flex; justify-content: space-between; gap: 20px;
  font-size: 0.72rem; padding: 1px 0;
}
.tt-dim {
  color: var(--ink-3);
  font-family: var(--font-mono); font-size: 0.62rem;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.tt-val {
  color: var(--ink-0); font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* ─── LOADING ─── */
.loading-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000;
  background: var(--surface-0);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  transition: opacity 0.4s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--line-0); border-top-color: var(--landing-blue);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.14em;
}
.loading-progress {
  width: 180px; height: 2px; background: var(--line-0); border-radius: 2px; overflow: hidden;
}
.loading-progress-fill {
  height: 100%; background: var(--landing-blue); border-radius: 2px;
  transition: width 0.3s; width: 0%;
}

/* ─── VIEW SWITCH (Map/Grid — secondary sub-toggle on map page) ─── */
.view-switch {
  display: inline-flex; background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md); padding: 2px;
}
.vs-btn {
  font-family: var(--font-display); font-size: 0.7rem; font-weight: 500;
  padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;
  background: transparent; color: var(--ink-3); transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 5px;
  letter-spacing: -0.005em;
  line-height: 1;
}
.vs-btn:hover { color: var(--ink-1); }
.vs-btn.active {
  background: var(--surface-1); color: var(--landing-navy);
  box-shadow: 0 1px 2px rgba(21,25,45,0.08);
  font-weight: 600;
}
.vs-btn svg { width: 12px; height: 12px; }

/* Label the view-switch for context */
.view-switch-wrap { display: inline-flex; align-items: center; gap: 8px; }
.view-switch-label {
  font-family: var(--font-mono); font-size: 0.6rem; font-weight: 500;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em;
}

/* ─── GRID VIEW ─── */
/* Whole grid-view scrolls as a single document. The inner .grid-scroll keeps
   horizontal-scroll on the wide table but no longer captures vertical scroll —
   that way the KPI strip + segments + leaderboards push the table down and the
   user uses the page scrollbar to reach the data. */
.grid-view {
  flex: 1; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
  background: var(--surface-0);
}
.grid-view .grid-scroll { flex: 0 0 auto; overflow-x: auto; overflow-y: visible; }
/* Sticky table header relative to .grid-view (the new scroll container). */
.grid-view .grid-table thead { top: 0; z-index: 10; }
/* Center the data table on ultra-wide displays so it doesn't anchor to the
   left edge with a giant empty band on the right. Capped at the same
   content-max so it visually aligns with the bands above it. */
.grid-view .grid-table {
  margin: 0 auto;
  max-width: var(--grid-content-max);
}

/* Content-width cap across the grid view so it doesn't stretch into a
   horizontal mess on ultra-wide displays. Each section's inner content is
   capped at --grid-content-max and centered. */
.grid-view { --grid-content-max: 1680px; }

/* ─── KPI strip ─── compact 8-tile horizontal row of cross-property aggregates */
.gv-kpi-strip {
  padding: 10px max(24px, calc((100% - var(--grid-content-max)) / 2)) 8px;
  background: var(--surface-0);
  border-bottom: 1px solid var(--line-0);
}
.gv-kpi-grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px;
  max-width: var(--grid-content-max);
  margin: 0 auto;
}
.gv-kpi-grid + .gv-kpi-grid { display: none; }   /* merged into single row */
.gv-kpi-tile {
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px 10px;
  background: var(--surface-1);
  border: 1px solid var(--line-0); border-radius: var(--r-md);
  cursor: pointer; transition: border-color 0.12s, transform 0.12s;
  min-width: 0;   /* allow truncation */
}
.gv-kpi-tile:hover { border-color: rgba(26,97,217,0.30); transform: translateY(-1px); }
.gv-kpi-tile .lbl {
  font-family: var(--font-mono); font-size: 8.5px;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--ink-3); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gv-kpi-tile .val {
  font-family: var(--font-mono); font-size: 16px; font-weight: 700;
  color: var(--ink-0); letter-spacing: -0.02em;
  line-height: 1.05;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gv-kpi-tile .val .unit { font-size: 11px; color: var(--ink-2); margin-left: 1px; }
.gv-kpi-tile .val .frac { font-size: 10px; color: var(--ink-3); font-weight: 500; }
.gv-kpi-tile .delta {
  font-family: var(--font-body); font-size: 9.5px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gv-kpi-tile .delta .up { color: var(--green); font-weight: 700; }
.gv-kpi-tile .delta .warn { color: #B95B00; font-weight: 700; }
.gv-kpi-tile.blue .val { color: var(--landing-blue); }
.gv-kpi-tile.warn { border-color: rgba(185, 91, 0, 0.30); }

/* ─── Segments chips bar ─── */
.gv-segments-wrap {
  padding: 8px max(24px, calc((100% - var(--grid-content-max)) / 2)) 6px;
  background: var(--surface-0);
  border-bottom: 1px solid var(--line-0);
}
.gv-segments {
  display: flex; gap: 8px; flex-wrap: wrap;
  max-width: var(--grid-content-max);
  margin: 0 auto;
}
.gv-seg-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px;
  background: var(--surface-1);
  border: 1px solid var(--line-1);
  border-radius: 999px;
  font-family: var(--font-body); font-size: 12px; font-weight: 500;
  color: var(--ink-1); cursor: pointer;
  transition: all 0.12s;
}
.gv-seg-chip:hover { border-color: var(--ink-3); color: var(--ink-0); }
.gv-seg-chip.active {
  background: var(--ink-0); color: #fff; border-color: var(--ink-0);
}
.gv-seg-chip.active .dot { background: #fff; }
.gv-seg-chip .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3);
}
.gv-seg-chip[data-tone="str"]   .dot { background: #D2552E; }
.gv-seg-chip[data-tone="lt"]    .dot { background: var(--landing-blue); }
.gv-seg-chip[data-tone="risk"]  .dot { background: #EE533D; }
.gv-seg-chip[data-tone="ramp"]  .dot { background: var(--green); }
.gv-seg-chip[data-tone="top"]   .dot { background: var(--green); }
.gv-seg-chip .count {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
  color: var(--ink-3); margin-left: 2px;
}
.gv-seg-chip.active .count { color: rgba(255,255,255,0.75); }

/* ─── Leaderboards ─── */
.gv-boards-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  /* padding-inline grows on wide viewports so the centered content stays
     within --grid-content-max even though the band itself still extends
     full-width via background-color on the element. */
  padding: 0 max(24px, calc((100% - var(--grid-content-max)) / 2)) 8px;
  background: var(--surface-0);
  border-bottom: 1px solid var(--line-1);
}
.gv-board {
  background: var(--surface-1);
  border: 1px solid var(--line-0); border-radius: var(--r-md);
  padding: 8px 10px;
}
.gv-board-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line-0);
}
.gv-board-title {
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--ink-2); font-weight: 700;
}
.gv-board-action {
  font-family: var(--font-mono); font-size: 9.5px;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--ink-3); cursor: pointer;
}
.gv-board-action:hover { color: var(--landing-blue); }
.gv-board-list { display: flex; flex-direction: column; gap: 2px; }
.gv-board-item {
  display: grid; grid-template-columns: 16px 1fr auto; gap: 8px;
  align-items: center; padding: 4px 6px; border-radius: 4px;
  cursor: pointer; transition: background 0.12s;
}
.gv-board-item:hover { background: var(--surface-2); }
.gv-board-item .rank {
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); font-weight: 700;
}
.gv-board-item .name {
  font-family: var(--font-body); font-size: 12px; color: var(--ink-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gv-board-item .metric {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
}
.gv-board-item .metric.good { color: var(--green); }
.gv-board-item .metric.bad  { color: #EE533D; }
.gv-board-item .metric.str  { color: #D2552E; }

@media (max-width: 1280px) {
  .gv-kpi-grid { grid-template-columns: repeat(4, 1fr); }
  .gv-boards-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 980px) {
  .gv-kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .gv-boards-row { grid-template-columns: 1fr; }
}

/* ─── Per-row sparkline + projection (new grid columns) ─── */
.gv-spark-svg { width: 100%; height: 28px; display: block; }
.gv-spark-bar { transition: fill 160ms ease; }
.gv-spark-bar.real { fill: var(--landing-blue); opacity: 0.85; }
.gv-spark-bar.ghost { fill: rgba(26,97,217,0.10); }
.gv-spark-bar.zero  { fill: var(--ink-4); opacity: 0.6; }
.gv-proj {
  display: inline-flex; align-items: baseline; gap: 5px;
  font-family: var(--font-mono); font-size: 12px;
  cursor: help;
}
.gv-proj .v { color: var(--landing-blue); font-weight: 700; font-size: 13px; }
.gv-proj .dots { font-size: 10px; letter-spacing: 0.6px; }
.gv-proj .dots.high { color: var(--green); }
.gv-proj .dots.med  { color: #B95B00; }
.gv-proj .refused {
  color: var(--ink-3); font-style: italic; font-size: 10.5px; font-family: var(--font-body);
}
.gv-rec {
  font-family: var(--font-mono); font-size: 14px; font-weight: 700;
  display: inline-flex; align-items: baseline; gap: 4px;
}
.gv-rec.good { color: var(--green); }
.gv-rec.warn { color: #B95B00; }
.gv-rec.bad  { color: #EE533D; }
.gv-rec .sub { font-size: 9px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; }
.gv-split-bar {
  display: flex; height: 7px; border-radius: 2px; overflow: hidden;
  background: rgba(21,25,45,0.06);
  border: 1px solid var(--line-0); margin-bottom: 4px;
}
.gv-split-bar .lt   { background: var(--landing-blue); }
.gv-split-bar .pt   { background: rgba(26,97,217,0.35); }
.gv-split-bar .gap  { background: repeating-linear-gradient(45deg, rgba(238,83,61,0.30) 0 2px, transparent 2px 4px); }
.gv-split-nums {
  display: flex; gap: 6px; font-family: var(--font-mono); font-size: 10.5px;
  color: var(--ink-2); align-items: baseline;
}
.gv-split-nums .l { color: var(--landing-blue); font-weight: 700; }
.gv-split-nums .p { color: var(--ink-1); font-weight: 600; }
.gv-split-nums .sep { color: var(--ink-4); }
.gv-split-nums .of  { color: var(--ink-3); font-size: 9px; }
.gv-split-nums .syn { color: var(--ink-3); font-size: 10px; font-weight: 700; margin-left: 2px; cursor: help; }
.gv-split-bar.synthetic { opacity: 0.75; }
.gv-split-bar.synthetic .lt,
.gv-split-bar.synthetic .pt { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.18) 0 2px, transparent 2px 4px); }

.grid-toolbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px max(24px, calc((100% - var(--grid-content-max, 1680px)) / 2));
  background: var(--surface-1);
  border-bottom: 1px solid var(--line-1);
  flex-shrink: 0;
  flex-wrap: wrap;
  row-gap: 10px;
}
.grid-search-wrap { position: relative; flex: 1 1 240px; max-width: 400px; min-width: 240px; }
/* On narrower viewports, drop the date stamp first (least essential), then
   let the search take a full row so the input stays usable. */
@media (max-width: 1280px) {
  .grid-date-ref { display: none !important; }
}
@media (max-width: 1100px) {
  .grid-search-wrap { flex-basis: 100%; max-width: none; }
}
.grid-search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--ink-3); pointer-events: none;
  display: flex; align-items: center;
}
.grid-search {
  width: 100%; padding: 8px 14px 8px 34px;
  font-family: var(--font-body); font-size: 0.82rem; font-weight: 400;
  background: var(--surface-2);
  border: 1px solid var(--line-1); border-radius: var(--r-md);
  color: var(--ink-0); outline: none; transition: all 0.15s;
}
.grid-search:focus {
  border-color: var(--landing-blue); background: var(--surface-1);
  box-shadow: 0 0 0 3px var(--blue-tint);
}
.grid-search::placeholder { color: var(--ink-3); }

.grid-active-btn {
  font-family: var(--font-display); font-size: 0.74rem; font-weight: 500;
  padding: 7px 14px; border: 1px solid var(--line-1); border-radius: var(--r-md);
  cursor: pointer; background: var(--surface-1); color: var(--ink-2);
  display: flex; align-items: center; gap: 7px; transition: all 0.15s;
  letter-spacing: -0.005em;
}
.grid-active-btn:hover { color: var(--ink-0); background: var(--surface-2); }
.grid-active-btn.active {
  border-color: var(--success); color: var(--success);
  background: var(--success-tint);
}
.grid-active-dot {
  width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  box-shadow: 0 0 0 2px rgba(8,120,108,0.15);
}

/* ─── Period Segmented Control ─── */
.grid-period {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  padding: 2px;
}
.grid-period-label {
  font-family: var(--font-mono); font-size: 0.58rem; font-weight: 500;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.12em;
  padding: 0 8px 0 6px;
}
.grid-period-btn {
  font-family: var(--font-display); font-size: 0.72rem; font-weight: 500;
  padding: 5px 11px; border: none; border-radius: 4px;
  background: transparent; color: var(--ink-2); cursor: pointer;
  transition: all 0.12s; letter-spacing: -0.005em;
  font-variant-numeric: tabular-nums;
}
.grid-period-btn:hover { color: var(--ink-0); background: var(--surface-1); }
.grid-period-btn.active {
  background: var(--landing-navy); color: #fff;
  box-shadow: 0 1px 2px rgba(21,25,45,0.12);
}
.grid-period-btn[disabled] {
  opacity: 0.55; cursor: wait;
}
/* Compact pill for the stats strip when in period mode */
.grid-period-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border-radius: var(--r-sm);
  background: var(--blue-tint); color: var(--landing-blue);
  font-family: var(--font-mono); font-size: 0.58rem; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-left: 8px;
}

.grid-stats {
  display: flex; gap: 0; margin-left: auto;
  font-family: var(--font-mono); font-size: 0.7rem;
  color: var(--ink-3);
}
.grid-stats > span {
  padding: 0 14px; border-right: 1px solid var(--line-0);
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
}
.grid-stats > span:last-child { border-right: none; padding-right: 0; }
.grid-stats > span:first-child { padding-left: 0; }
.grid-stat-val {
  font-family: var(--font-display); font-weight: 600; font-size: 0.95rem;
  color: var(--ink-0); margin-right: 5px; letter-spacing: -0.015em;
  font-variant-numeric: tabular-nums;
  text-transform: none;
}

.grid-scroll { flex: 1; overflow: auto; }
.grid-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.grid-scroll::-webkit-scrollbar-track { background: transparent; }
.grid-scroll::-webkit-scrollbar-thumb {
  background: var(--ink-4); border-radius: 5px;
  border: 2px solid var(--surface-0); background-clip: padding-box;
}
.grid-scroll::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: padding-box; border: 2px solid var(--surface-0); }

/* ─── GRID TABLE (editorial data) ─── */
.grid-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.grid-table thead { position: sticky; top: 0; z-index: 10; }
.grid-table th {
  background: var(--surface-1);
  padding: 10px 14px; text-align: left;
  font-family: var(--font-mono); font-size: 0.62rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3);
  border-bottom: 1px solid var(--line-1); white-space: nowrap;
  user-select: none;
  position: relative;
}
.grid-table thead tr::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-2), transparent);
}
.grid-table th.sortable { cursor: pointer; transition: color 0.15s; padding-right: 22px; }
.grid-table th.sortable:hover { color: var(--ink-0); }
.grid-table th.sorted { color: var(--landing-blue); }
.grid-table th.sortable::after {
  content: '↕'; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  font-size: 0.7rem; opacity: 0.25;
}
.grid-table th.sortable:hover::after { opacity: 0.55; }
.grid-table th.sorted.asc::after { content: '↑'; opacity: 1; }
.grid-table th.sorted.desc::after { content: '↓'; opacity: 1; }
.grid-table th.num { text-align: right; }
.col-expand { width: 28px; padding-right: 4px !important; }
.col-link { width: 40px; text-align: center !important; }

.grid-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-0);
  white-space: nowrap; color: var(--ink-1);
  font-weight: 400; line-height: 1.35;
}
.grid-table td.num {
  text-align: right; font-family: var(--font-mono);
  font-weight: 500; font-size: 0.76rem;
  color: var(--ink-0); letter-spacing: -0.005em;
  font-variant-numeric: tabular-nums;
}
.grid-table tbody tr { cursor: pointer; transition: background 0.08s; }
.grid-table tbody tr:hover { background: var(--blue-tint); }
.grid-table tbody tr.expanded {
  background: var(--landing-baby);
}
/* Zebra removed — hairline borders are enough */

.grid-prop {
  font-family: var(--font-display); font-weight: 600;
  font-size: 0.84rem; color: var(--ink-0);
  letter-spacing: -0.01em;
}
.deinstall-flag {
  display: inline-flex; align-items: center; gap: 3px;
  margin-left: 8px; padding: 2px 7px; border-radius: var(--r-sm);
  background: var(--error-tint); color: var(--error);
  font-family: var(--font-mono); font-size: 0.58rem; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  vertical-align: middle; cursor: help;
  border: 1px solid rgba(238,83,61,0.18);
}
.grid-partner {
  color: var(--ink-1); font-size: 0.74rem; font-weight: 500;
}
.grid-partner-sub {
  color: var(--ink-3); font-size: 0.66rem; margin-top: 2px;
  font-style: normal; font-family: var(--font-mono);
}
.grid-loc {
  color: var(--ink-2); font-size: 0.74rem; font-weight: 400;
}

/* ─── Occupancy Bar ─── */
.occ-wrap { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.occ-bar {
  display: block; width: 64px; height: 6px;
  background: var(--surface-3); border-radius: 3px;
  overflow: hidden; flex-shrink: 0; position: relative;
}
.occ-fill {
  display: block; height: 100%; border-radius: 3px;
  position: absolute; top: 0; left: 0;
  transition: width 0.3s ease;
}
.occ-val {
  font-family: var(--font-mono); font-weight: 500; font-size: 0.78rem;
  min-width: 42px; text-align: right; color: var(--ink-0);
  font-variant-numeric: tabular-nums; letter-spacing: -0.005em;
}

/* ─── Status Badge (pill with indicator) ─── */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono);
  font-size: 0.62rem; font-weight: 500;
  padding: 3px 9px 3px 7px; border-radius: var(--r-sm);
  letter-spacing: 0.06em; text-transform: uppercase;
  white-space: nowrap;
}
.status-badge::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor;
}
.status-active   { background: var(--success-tint); color: var(--success); }
.status-red      { background: var(--error-tint);   color: var(--error); }
.status-amber    { background: var(--warning-tint); color: var(--warning); }
.status-blue     { background: var(--blue-tint);    color: var(--landing-blue); }
.status-inactive { background: var(--navy-tint);    color: var(--ink-3); }

/* ─── Reservation Chips (table cells) ─── */
.res-chip {
  display: inline-flex; align-items: baseline; justify-content: center; gap: 4px;
  min-width: 26px; padding: 2px 8px; border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
  margin: 0 2px; font-variant-numeric: tabular-nums;
}
.res-curr { background: var(--success-tint); color: var(--success); }
.res-fut  { background: var(--blue-tint);    color: var(--landing-blue); }
.res-label {
  font-weight: 400; font-size: 0.56rem; opacity: 0.72;
  text-transform: uppercase; letter-spacing: 0.08em;
}

/* ─── Unit Status Dots (softer, no bright glow) ─── */
.unit-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.8);
}
.unit-dot-green { background: var(--success); }
.unit-dot-amber { background: var(--warning); }
.unit-dot-blue  { background: var(--landing-blue); }
.unit-dot-red   { background: var(--error); }

/* ─── Detail Badges (inside expanded detail) ─── */
.gd-badge-curr    { background: var(--success-tint); color: var(--success);     padding: 2px 8px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 0.64rem; font-weight: 500; white-space: nowrap; letter-spacing: -0.005em; }
.gd-badge-future  { background: var(--blue-tint);    color: var(--landing-blue);padding: 2px 8px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 0.64rem; font-weight: 500; white-space: nowrap; letter-spacing: -0.005em; }
.gd-badge-vacant  { background: var(--error-tint);   color: var(--error);       padding: 2px 8px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 0.64rem; font-weight: 500; white-space: nowrap; letter-spacing: -0.005em; }
.gd-badge-standby { background: rgba(139,92,246,0.09); color: #7C3AED;           padding: 2px 8px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 0.64rem; font-weight: 500; white-space: nowrap; letter-spacing: -0.005em; }
.gd-badge-other   { background: var(--surface-3);    color: var(--ink-2);       padding: 2px 8px; border-radius: var(--r-sm); font-family: var(--font-mono); font-size: 0.64rem; font-weight: 500; white-space: nowrap; letter-spacing: -0.005em; }

/* ─── Admin Link (arrow icon in last column) ─── */
.admin-link {
  color: var(--ink-3); text-decoration: none; font-weight: 500;
  font-size: 0.9rem; transition: all 0.15s;
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: var(--r-sm);
}
.admin-link:hover { color: var(--landing-blue); background: var(--blue-tint); }

/* ─── Expand Chevron ─── */
.expand-chevron {
  display: inline-block; transition: transform 0.15s;
  color: var(--ink-3); font-size: 0.6rem;
}
tr.expanded .expand-chevron {
  transform: rotate(90deg); color: var(--landing-blue);
}

/* ─── EXPANDED DETAIL (under grid row) ─── */
.grid-detail-cell {
  padding: 0 !important;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line-1) !important;
  border-left: 3px solid var(--landing-blue);
  position: relative;
}
.grid-detail {
  /* Stick to the viewport's left edge even when the parent table is wider
     than the viewport. Without this the detail panel rendered off-screen on
     viewports < table width (~1700px), clipping the right side of methodology
     text. position:sticky lets the panel anchor while the table scrolls
     horizontally underneath. */
  position: sticky;
  left: 0;
  padding: 18px 28px 22px;
  /* Cap to BOTH viewport width AND a sensible reading width so the panel
     doesn't stretch into a horizontal mess on ultra-wide displays. */
  width: min(calc(100vw - 24px), var(--grid-content-max, 1680px));
  max-width: min(calc(100vw - 24px), var(--grid-content-max, 1680px));
  box-sizing: border-box;
  overflow-x: auto;
  animation: gridSlideDown 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes gridSlideDown {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.grid-detail-tabs {
  display: flex; gap: 0; margin-bottom: 16px;
  border-bottom: 1px solid var(--line-1);
  padding-bottom: 0;
}
.gd-tab {
  font-family: var(--font-display); font-size: 0.76rem; font-weight: 500;
  padding: 8px 0; margin-right: 20px; border: none; background: none; cursor: pointer;
  color: var(--ink-2); border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: all 0.15s;
  letter-spacing: -0.005em;
}
.gd-tab.active {
  color: var(--ink-0); border-bottom-color: var(--landing-blue);
  font-weight: 600;
}
.gd-tab:hover:not(.active) { color: var(--ink-0); }

/* ─── Sub-table (units / reservations inside detail) ─── */
.gd-subtable {
  width: 100%; border-collapse: collapse; font-size: 0.74rem;
  background: var(--surface-1); border-radius: var(--r-md);
  overflow: hidden; box-shadow: var(--elev-1);
  border: 1px solid var(--line-0);
}
.gd-subtable th {
  text-align: left; padding: 9px 12px;
  font-family: var(--font-mono); font-size: 0.58rem; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line-1);
  white-space: nowrap;
}
.gd-subtable td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line-0);
  color: var(--ink-1);
}
.gd-subtable tbody tr:last-child td { border-bottom: none; }
.gd-subtable tbody tr:hover { background: var(--blue-tint); }
.gd-subtable th.num, .gd-subtable td.num {
  text-align: right;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink-0);
}
.gd-unit {
  font-family: var(--font-mono); font-weight: 500;
  color: var(--ink-0); font-variant-numeric: tabular-nums;
  letter-spacing: -0.005em;
}
.gd-yes { color: var(--success); font-weight: 500; }
.gd-no  { color: var(--error); font-weight: 500; }
.gd-empty, .gd-loading {
  text-align: center; padding: 32px;
  color: var(--ink-3); font-size: 0.78rem;
  font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em;
}

/* ─── STR (short-term rental) — coral accent system ───
   STR uses a deliberately warm coral, distinct from cool LT blue, so mixed
   portfolios scan as two product lines. Applied to: chips, badges, bars,
   per-unit S-mark, dormant-eligible variant. */
:root {
  --str:        #D2552E;
  --str-2:      #B33F1A;
  --str-tint:   rgba(210, 85, 46, 0.12);
  --str-tint-2: rgba(210, 85, 46, 0.05);
}

.gd-chip-str {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--str); color: #FFFFFF;
  font-family: var(--font-mono); font-size: 0.62rem;
  text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600;
  padding: 6px 11px; border-radius: var(--r-sm);
  white-space: nowrap;
  box-shadow: 0 1px 0 var(--str-2);
}
.gd-chip-str::before {
  content: ''; width: 6px; height: 6px; background: #FFFFFF; border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.28);
}
.gd-chip-aux {
  display: inline-flex; align-items: center;
  background: transparent; color: var(--ink-2);
  border: 1px solid var(--line-2);
  font-family: var(--font-mono); font-size: 0.6rem;
  text-transform: uppercase; letter-spacing: 0.12em; font-weight: 500;
  padding: 5px 10px; border-radius: var(--r-sm);
  white-space: nowrap;
}
.gd-badge-str {
  background: var(--str-tint); color: var(--str-2);
  border: 1px solid var(--str);
  padding: 2px 8px; border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: 0.64rem; font-weight: 500;
  white-space: nowrap; letter-spacing: -0.005em;
}

/* Per-unit STR marker — small square next to unit number.
   "Active" (current res is nightly) = filled coral.
   "Dormant" (STR-eligible but on monthly contract) = dashed outline. */
.str-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px;
  background: var(--str-tint); color: var(--str);
  border: 1px solid var(--str);
  border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: 0.55rem; font-weight: 700;
  line-height: 1; margin-left: 6px;
  cursor: help;
  vertical-align: middle;
}
.str-mark.dormant {
  background: transparent;
  color: var(--str-2);
  border: 1px dashed var(--str);
}

/* Opportunity tag — used on dormant-STR rows to say "this could earn nightly" */
.gd-opportunity-tag {
  display: inline-block;
  font-family: var(--font-mono); font-size: 0.54rem;
  text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
  color: var(--str-2);
  background: var(--str-tint); border: 1px solid var(--str);
  padding: 1px 5px; border-radius: var(--r-sm);
}

/* Rent cell — for STR units the cell stacks: nightly rate (primary) /
   stay total (secondary) / monthly equivalent (struck through, legacy noise). */
.rent-stack {
  display: flex; flex-direction: column; gap: 2px; align-items: flex-end;
  line-height: 1.25;
}
.rent-primary       { font-family: var(--font-mono); font-weight: 700; font-size: 0.78rem; color: var(--ink-0); }
.rent-primary.nt    { color: var(--str-2); }
.rent-secondary     { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-3); }
.rent-secondary.struck { text-decoration: line-through; opacity: 0.55; }
.rent-tag-potential { font-family: var(--font-mono); font-size: 0.6rem; color: var(--str-2); font-style: italic; }

/* Markup column — multi-line treatment for STR rows.
   Headline = realized MTD margin (can be red/negative — the truth).
   Context line = nights MTD + break-even nights/occupancy threshold.
   Tail line = per-stay rate quality (coral, secondary). */
.markup-mtd-info  { display: block; font-family: var(--font-mono); font-size: 0.58rem; color: var(--ink-3); margin-top: 3px; letter-spacing: 0; font-weight: 400; }
.markup-mtd-info b{ color: var(--ink-2); font-weight: 600; }
.markup-per-stay  { display: block; font-family: var(--font-mono); font-size: 0.6rem; color: var(--str-2); margin-top: 2px; font-weight: 500; letter-spacing: 0; }
.markup-per-stay b{ font-weight: 700; }
.markup-be-warn   { color: var(--warning); font-weight: 600; }
.markup-be-ok     { color: var(--success); font-weight: 600; }
.markup-be-met    { color: var(--success); font-weight: 700; }

/* Current-reservation cell — date pill + nights badge instead of raw text.
   "May 10 → May 31" reads faster than "2026-05-10 → 2026-05-31" and the
   night count gets its own little chip. */
.res-cell { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.res-dates-pill {
  font-family: var(--font-mono); font-size: 0.66rem;
  background: var(--surface-2); color: var(--ink-1);
  padding: 2px 8px; border-radius: var(--r-sm);
  border: 1px solid var(--line-1);
  white-space: nowrap;
}
.res-dates-pill .arrow { color: var(--ink-3); margin: 0 4px; }
.res-nights-badge {
  font-family: var(--font-mono); font-size: 0.6rem; font-weight: 600;
  padding: 2px 6px; border-radius: var(--r-sm);
  letter-spacing: 0.02em; white-space: nowrap;
  background: var(--blue-tint); color: var(--landing-blue);
}
.res-nights-badge.str  { background: var(--str-tint); color: var(--str-2); }
.res-nights-badge.long { background: var(--success-tint); color: var(--success); }

/* Row-level STR pill — visible in the property column without needing to
   expand the row. Same coral system as the per-unit S-mark, scaled to fit
   inline alongside the property name. */
.grid-str-pill {
  display: inline-flex; align-items: center;
  margin-left: 8px;
  padding: 1px 6px;
  background: var(--str-tint); color: var(--str-2);
  border: 1px solid var(--str);
  border-radius: var(--r-sm);
  font-family: var(--font-mono); font-size: 0.55rem; font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  vertical-align: middle;
  cursor: help;
}

/* ─── Trend module ── the centerpiece, sits above the tabs in expanded row ───
   Width control lives on .grid-detail now (max-width: 1140px) so the trend
   module and the units table below share the same left AND right edges.
   The chart fills its grid column without overflowing the parent. */
.gd-trend-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 320px);
  gap: 0;
  margin: 12px 0 14px;
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--surface-1);
}
@media (max-width: 1080px) {
  .gd-trend-wrap { grid-template-columns: 1fr; }
  .gd-trend-side { border-left: 0; border-top: 1px solid var(--line-1); }
}
.gd-trend-chart-wrap { padding: 16px 18px 14px; position: relative; min-width: 0; }
.gd-trend-eyebrow {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 10px; gap: 12px; flex-wrap: wrap;
}
/* POV + LT counterfactual toggles (v4 mock parity) */
.gd-pov-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.gd-pov-toggle {
  display: inline-flex; padding: 2px; background: var(--surface-2);
  border: 1px solid var(--line-1); border-radius: 6px;
}
.gd-pov-toggle button {
  border: 0; background: transparent; padding: 5px 10px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--ink-3); cursor: pointer; border-radius: 4px;
}
.gd-pov-toggle button.active {
  background: var(--ink-0); color: #fff;
}
.gd-lt-wrap { display: inline-flex; align-items: center; gap: 8px; }
.gd-lt-label {
  font-family: var(--font-mono); font-size: 9.5px;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--ink-3); font-weight: 600;
  cursor: help;
}
.gd-lt-toggle {
  display: inline-flex; padding: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line-1); border-radius: 5px;
}
.gd-lt-toggle button {
  border: 0; background: transparent;
  padding: 3px 8px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  color: var(--ink-3); cursor: pointer; border-radius: 3px;
}
.gd-lt-toggle button.active { background: var(--landing-blue); color: #fff; }

/* POV panes — only one shown at a time, mirrors the v4 mock layout. */
.gd-pov-pane { display: none; flex-direction: column; gap: 12px; }
.gd-pov-pane.active { display: flex; }

/* Landing POV verdict (the headline net-vs-LT number) */
.gd-verdict {
  display: flex; flex-direction: column; gap: 4px;
  padding: 12px 14px;
  background: var(--surface-1);
  border: 1px solid var(--line-1); border-radius: var(--r-md);
}
.gd-verdict-label {
  font-family: var(--font-mono); font-size: 9.5px;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--ink-3); font-weight: 600;
}
.gd-verdict-number {
  font-family: var(--font-mono); font-size: 22px; font-weight: 700;
  letter-spacing: -0.02em;
}
.gd-verdict-number.surplus { color: var(--success, var(--green)); }
.gd-verdict-number.shortfall { color: #EE533D; }
.gd-verdict-pct {
  font-family: var(--font-body); font-size: 11px; color: var(--ink-2);
}

/* Breakdown rows in Landing POV pane */
.gd-bk { display: flex; flex-direction: column; gap: 4px; }
.gd-bk-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 4px 0;
  font-family: var(--font-body); font-size: 11px;
  color: var(--ink-2);
}
.gd-bk-row.sub { padding-left: 12px; color: var(--ink-3); font-size: 10.5px; }
.gd-bk-row .v {
  font-family: var(--font-mono); font-weight: 700; color: var(--ink-1);
  font-feature-settings: 'tnum' 1;
}
.gd-bk-row .v.blue { color: var(--landing-blue); }
.gd-bk-row .v.muted { color: var(--ink-3); font-weight: 500; }
.gd-bk-row .v.good { color: var(--success, var(--green)); }
.gd-bk-row .v.warn { color: #B95B00; }
.gd-bk-row .v.bad  { color: #EE533D; }

/* Trajectory line shown at the bottom of each POV pane */
.gd-trajectory {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
  color: var(--ink-2);
}
.gd-trajectory .glyph { font-size: 16px; line-height: 1; }
.gd-trajectory.widening { color: #EE533D; }
.gd-trajectory.surplus  { color: var(--success, var(--green)); }

/* Italic narrative paragraph */
.gd-narrative {
  font-family: var(--font-body); font-size: 12.5px; line-height: 1.55;
  color: var(--ink-2); font-style: italic;
}
.gd-narrative b { color: var(--ink-0); font-style: normal; font-weight: 600; }

/* Source-mix bar (unit-ratio) inside POV panes */
.gd-source-mix {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
}
.gd-source-mix .lbl {
  font-family: var(--font-mono); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--ink-3); font-weight: 600;
  white-space: nowrap;
}
/* Always-visible exact split next to the bar — guarantees the numbers are
   readable even when one segment is too narrow to fit its inline label. */
.gd-source-mix .lbl-detail {
  font-family: var(--font-mono); font-size: 9.5px;
  color: var(--ink-1); font-weight: 700;
  white-space: nowrap;
  margin-left: -2px;
}
.gd-source-mix .bar {
  flex: 1; height: 14px;
  display: flex; border-radius: 2px; overflow: hidden;
  background: var(--line-0);
}
.gd-source-mix .bar .seg {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  color: #fff; letter-spacing: 0.02em;
}
.gd-source-mix .bar .seg.lt  { background: var(--landing-blue); }
.gd-source-mix .bar .seg.str { background: #D2552E; }

/* Per-month rollup grid (below the chart) */
.gd-rollup-wrap {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--line-1);
  overflow-x: auto;
}
.gd-rollup-grid {
  display: grid; gap: 0;
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  background: var(--surface-1);
  min-width: 100%;
  max-width: 980px;
  margin: 0 auto;
}
.gd-rollup-cell {
  padding: 6px 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  text-align: right;
  border-right: 1px solid var(--line-0);
  border-bottom: 1px solid var(--line-0);
  white-space: nowrap;
  color: var(--ink-1);
}
.gd-rollup-cell:last-child { border-right: 0; }
.gd-rollup-cell.label {
  text-align: left;
  text-transform: uppercase; letter-spacing: 0.1em;
  font-size: 9.5px; font-weight: 700; color: var(--ink-2);
  background: var(--surface-2);
  display: flex; align-items: center; gap: 6px;
}
.gd-rollup-cell.label .swatch {
  width: 8px; height: 8px; display: inline-block; border-radius: 1px;
}
.gd-rollup-cell.label .swatch.lt      { background: var(--landing-blue); }
.gd-rollup-cell.label .swatch.partner { background: rgba(26, 97, 217, 0.35); border: 1px solid var(--landing-blue); }
.gd-rollup-cell.month-header {
  text-align: center;
  text-transform: uppercase; letter-spacing: 0.1em;
  font-size: 9px; font-weight: 700; color: var(--ink-3);
  background: var(--surface-2);
}
.gd-rollup-cell.lt      { color: var(--landing-blue); font-weight: 600; }
.gd-rollup-cell.partner { color: var(--ink-1); font-weight: 500; }
.gd-rollup-cell.total   { font-weight: 700; }
.gd-rollup-cell.actual.good { color: var(--success, var(--green)); font-weight: 700; background: rgba(8,120,108,0.04); }
.gd-rollup-cell.actual.warn { color: #B95B00; font-weight: 700; background: rgba(185,91,0,0.04); }
.gd-rollup-cell.actual.bad  { color: #EE533D; font-weight: 700; background: rgba(238,83,61,0.04); }
.gd-rollup-cell.ghost { color: var(--ink-4); font-style: italic; font-size: 9px; text-align: center; }

/* Projection cells (and bars) — faded + diagonal hatch to read as "modeled". */
.gd-rollup-cell.proj {
  opacity: 0.62;
  background-image: repeating-linear-gradient(45deg, rgba(26,97,217,0.04) 0 3px, transparent 3px 6px);
}
.gd-rollup-cell.month-header.proj { color: var(--landing-blue); opacity: 0.85; }
.gd-rollup-cell .proj-tag {
  display: inline-block; margin-left: 3px;
  font-family: var(--font-mono); font-size: 8px; font-weight: 700;
  color: var(--landing-blue); background: rgba(26,97,217,0.10);
  padding: 1px 3px; border-radius: 2px; letter-spacing: 0.04em;
}

/* Chart: projection bars are hatched, partner segment uses dashed outline */
.bar-landing.proj { fill: var(--landing-blue); opacity: 0.45; }
.bar-partner.proj { fill: rgba(26,97,217,0.20); stroke: var(--landing-blue); stroke-width: 0.6; stroke-dasharray: 2 2; }
.proj-bar-label {
  font-family: var(--font-mono); font-size: 7.5px; font-weight: 700;
  fill: var(--landing-blue); letter-spacing: 0.05em;
  text-transform: uppercase; opacity: 0.85;
}

/* Small annotation inside a breakdown label, e.g. "15u × $2.3K/mo" */
.gd-bk-note {
  display: inline-block;
  margin-left: 4px;
  font-family: var(--font-mono); font-size: 9px;
  color: var(--ink-3); font-weight: 500;
  letter-spacing: 0;
  vertical-align: 1px;
}

/* Contracted-rev-share chip — sits next to realized take chip when
   dimhome.revenue_share_percentage is populated for at least one unit.
   Visually distinct (outline + landing-blue) so reps can see at a glance
   that THIS one is the contracted rate and the dim chip next to it is realized. */
.gd-take-contracted {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  font-family: var(--font-mono); font-size: 8.5px;
  font-weight: 700; letter-spacing: 0.04em;
  background: rgba(26, 97, 217, 0.08);
  border: 1px solid rgba(26, 97, 217, 0.45);
  border-radius: 3px;
  color: var(--landing-blue);
  vertical-align: 1px;
  cursor: help;
}

/* Take-rate chip displayed inline next to "Landing kept" / "Partner kept" */
.gd-take {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 5px;
  font-family: var(--font-mono); font-size: 8.5px;
  font-weight: 700; letter-spacing: 0.06em;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: 3px;
  color: var(--ink-2);
  vertical-align: 1px;
}

/* Cumulative vs last-month explainer — appears under the breakdown when the
   two figures disagree by ≥25pp (typically on ramping or seasonal properties). */
.gd-recovery-note {
  margin-top: 4px;
  padding: 9px 11px;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-left: 3px solid var(--landing-blue);
  border-radius: var(--r-sm);
  font-family: var(--font-body); font-size: 11px;
  color: var(--ink-2); line-height: 1.55;
}
.gd-recovery-note b { color: var(--ink-0); font-weight: 700; }

/* "Why is Landing > Partner?" explainer for STR-heavy properties */
.gd-take-note {
  margin-top: 4px;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-left: 3px solid #D2552E;
  border-radius: var(--r-sm);
  font-family: var(--font-body); font-size: 11.5px;
  color: var(--ink-2); line-height: 1.55;
  cursor: help;
}
.gd-take-note b { color: var(--ink-0); font-weight: 700; }

/* Verdict 'even' state */
.gd-verdict-number.even { color: var(--ink-1); }

/* Refused state for properties without bundle data */
.gd-proj-refuse {
  margin: 12px 0;
  padding: 14px 16px;
  background: var(--paper-warm, var(--surface-1));
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  font-family: var(--font-body); font-size: 12.5px;
  color: var(--ink-2); line-height: 1.55;
}
.gd-proj-refuse b { color: var(--ink-0); font-weight: 700; }

/* ─── Methodology disclosure (collapsible audit trail) ─── */
.gd-methodology {
  grid-column: 1 / -1;           /* spans full width below chart + aside */
  margin: 14px 18px 18px;
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  background: var(--paper-warm, var(--surface-1));
}
.gd-methodology > summary {
  cursor: pointer;
  padding: 10px 14px;
  font-family: var(--font-mono); font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--ink-2); font-weight: 600;
  list-style: none;
  display: flex; align-items: center; gap: 8px;
  user-select: none;
}
.gd-methodology > summary::-webkit-details-marker { display: none; }
.gd-methodology > summary::before {
  content: '▸'; font-size: 14px; color: var(--ink-3);
  transition: transform 150ms ease;
}
.gd-methodology[open] > summary::before { transform: rotate(90deg); }
.gd-methodology > summary:hover { color: var(--ink-0); }
.gd-meth-body { padding: 8px 18px 18px; }
.gd-meth-section { margin-bottom: 16px; }
.gd-meth-section:last-child { margin-bottom: 0; }
.gd-meth-h {
  font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--ink-0); font-weight: 700;
  margin-bottom: 6px;
}
.gd-meth-p {
  font-family: var(--font-body); font-size: 12.5px;
  color: var(--ink-1); line-height: 1.6;
  /* Allow long mono words/codes to break instead of stretching the line. */
  overflow-wrap: anywhere;
}
.gd-meth-p code {
  font-family: var(--font-mono); font-size: 11px;
  background: var(--surface-0); padding: 1px 4px; border-radius: 2px;
  border: 1px solid var(--line-1);
  /* Don't let inline code force a wide row */
  word-break: break-all;
}
.gd-meth-p b { color: var(--ink-0); font-weight: 700; }

.gd-meth-table {
  width: 100%; border-collapse: collapse;
  margin-top: 8px;
  font-family: var(--font-mono); font-size: 11px;
  background: var(--surface-0);
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.gd-meth-table th, .gd-meth-table td {
  padding: 5px 8px;
  border-bottom: 1px solid var(--line-0);
  text-align: left;
}
.gd-meth-table th {
  background: var(--paper-warm, var(--surface-1)); font-weight: 600;
  color: var(--ink-2); text-transform: uppercase; font-size: 9.5px;
  letter-spacing: 0.12em;
}
.gd-meth-table td.num, .gd-meth-table th.num { text-align: right; }
.gd-meth-table tfoot td {
  background: var(--paper-warm, var(--surface-1));
  font-weight: 600; color: var(--ink-0); border-top: 1px solid var(--line-1);
}
.gd-meth-table tbody tr.lt  td { color: var(--landing-blue); }
.gd-meth-table tbody tr.str td { color: #D2552E; }

/* ─── Text-wrap fixes across POV pane content ───
   The trend-side aside is ~320px wide. Flex children default to min-content
   sizing — without min-width:0, a long inline-block child stretches the
   parent beyond viewport. These rules constrain every direct child of the
   POV pane to its container and let long text break safely. */
/* RESET: the parent <td.grid-detail-cell> declares white-space:nowrap to
   keep its main grid row tidy. That inherits into the entire trend module
   and prevents text wrapping — explicitly reset it here. */
.gd-trend-wrap, .gd-trend-wrap * { white-space: normal; }
.gd-rollup-cell { white-space: nowrap; }   /* rollup cells stay single-line */

.gd-trend-side, .gd-pov-pane {
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
}
.gd-pov-pane > * {
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
}
.gd-verdict, .gd-bk, .gd-source-mix, .gd-narrative, .gd-trajectory {
  min-width: 0;
  max-width: 100%;
}
/* Breakdown rows: label + value with guaranteed separation. flex: 1 on the
   label fills the row width, but a gap ensures the numeric value never
   visually butts up against the label. */
.gd-bk-row {
  flex-wrap: wrap;
  min-width: 0; max-width: 100%;
  gap: 14px;
}
.gd-bk-row .l {
  flex: 1 1 auto; min-width: 0;
  overflow-wrap: anywhere; word-break: break-word;
  padding-right: 4px;
}
.gd-bk-row .v {
  flex: 0 0 auto;
  white-space: nowrap;
  text-align: right;
}
/* Verdict pct line — the long parenthetical must wrap cleanly. */
.gd-verdict-pct {
  overflow-wrap: anywhere; word-break: break-word;
  line-height: 1.5;
  max-width: 100%;
}
.gd-verdict-number {
  /* Long values like "−$140.7K" mustn't push the column wider */
  overflow-wrap: normal;
  max-width: 100%;
}
/* Narrative + trajectory — wrap on whole words, no overflow. */
.gd-narrative, .gd-trajectory {
  word-break: break-word; overflow-wrap: break-word;
  min-width: 0; max-width: 100%;
}
/* Source-mix bar — when segments are tiny, hide labels rather than overflow. */
.gd-source-mix {
  min-width: 0; max-width: 100%;
  overflow: hidden;   /* segments don't push past the container */
}
.gd-source-mix .bar { min-width: 0; }
.gd-source-mix .bar .seg { overflow: hidden; text-overflow: clip; min-width: 0; }

/* Inline legend right below the eyebrow — explains the four visual elements
   on the chart so users don't have to guess at the bar / line semantics. */
.gd-trend-legend {
  display: flex; flex-wrap: wrap; gap: 10px 18px;
  font-family: var(--font-mono); font-size: 0.55rem;
  color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 8px;
}
.gd-trend-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.gd-trend-legend .sw { width: 12px; height: 8px; border-radius: 1px; display: inline-block; }
.gd-trend-legend .sw-landing { background: var(--landing-blue); }
.gd-trend-legend .sw-partner { background: var(--blue-tint); border: 1px dashed var(--landing-blue); }
.gd-trend-legend .sw-occ     { width: 14px; height: 0; border-top: 1.5px solid var(--success); }
.gd-trend-legend .sw-ghost   { background: rgba(26,97,217,0.04); border: 1px dashed var(--line-2); }
.gd-trend-wrap.str .gd-trend-legend .sw-landing { background: var(--str); }
.gd-trend-wrap.str .gd-trend-legend .sw-partner { background: var(--str-tint); border-color: var(--str); }
.gd-trend-title {
  font-family: var(--font-mono); font-size: 0.66rem;
  text-transform: uppercase; letter-spacing: 0.16em;
  color: var(--ink-1); font-weight: 600;
}
.gd-trend-subtitle {
  font-family: var(--font-body); font-size: 0.7rem;
  color: var(--ink-3); font-style: italic;
}
/* Cap chart width so bars don't stretch into slivers on ultra-wide screens.
   preserveAspectRatio="none" on the SVG element stretches the 660×200 viewBox
   to fill its container — capping the container preserves a chart-like aspect.
   Height bumped to 240px to give bars more room (the Y axis includes 20%
   headroom for the occupancy line). */
.gd-chart-canvas { width: 100%; max-width: 880px; height: 240px; display: block; overflow: visible; margin: 0 auto; }

.gd-chart-canvas .bar-landing { fill: var(--landing-blue); transition: fill 160ms ease; }
/* Solid partner bar (lighter blue) — no dashed outline. The previous
   stroke-dasharray rendered every partner segment as a dashed ghost-looking
   rectangle which was hard to read as a real bar. */
.gd-chart-canvas .bar-partner {
  fill: rgba(26, 97, 217, 0.38);
  transition: fill 160ms ease;
}
.gd-chart-canvas .bar-ghost {
  fill: rgba(26,97,217,0.04);
  stroke: var(--line-2); stroke-width: 0.6;
  stroke-dasharray: 1.4 1.4;
}
.gd-chart-canvas .bar-zero    { fill: var(--landing-blue); opacity: 0.5; }
.gd-chart-canvas .occ-line    { fill: none; stroke: var(--success); stroke-width: 1.6; stroke-linejoin: round; }
/* Projection portion of the occupancy line — dashed pattern to signal modeled. */
.gd-chart-canvas .occ-line-proj {
  fill: none; stroke: var(--success); stroke-width: 1.4; stroke-linejoin: round;
  stroke-dasharray: 4 3; opacity: 0.72;
}
.gd-chart-canvas .occ-dot-proj {
  fill: var(--surface-1); stroke: var(--success); stroke-width: 1.2; opacity: 0.72;
  stroke-dasharray: 2 1.5;
}
.gd-chart-canvas .occ-dot     { fill: var(--surface-1); stroke: var(--success); stroke-width: 1.4; }
.gd-chart-canvas .occ-dot-active { fill: var(--success); }
.gd-chart-canvas .grid-line   { stroke: var(--line-0); stroke-width: 0.6; stroke-dasharray: 1.5 2; }
.gd-chart-canvas .axis-label  { font-family: var(--font-mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.12em; fill: var(--ink-3); }
.gd-chart-canvas .axis-label-strong { fill: var(--ink-1); font-weight: 600; }
.gd-chart-canvas .zero-label  { font-family: var(--font-mono); font-size: 7.5px; font-weight: 600; fill: var(--ink-3); }
.gd-chart-canvas .onb-flag    { fill: var(--ink-1); }
.gd-chart-canvas .onb-flag-label { font-family: var(--font-mono); font-size: 7.5px; font-weight: 700; fill: var(--ink-1); letter-spacing: 0.08em; text-transform: uppercase; }
/* pointer-events: all so transparent SVG rects still catch mouse events
   (default for SVG fill: transparent is visiblePainted which excludes
   transparent paint regions on some browsers). */
.gd-chart-canvas .col-hit     { fill: transparent; cursor: pointer; pointer-events: all; }

/* STR-variant of the trend (when property is STR-enabled) */
.gd-trend-wrap.str .bar-landing { fill: var(--str); }
.gd-trend-wrap.str .bar-partner { fill: var(--str-tint); stroke: var(--str); }
.gd-trend-wrap.str .bar-zero    { fill: var(--str); opacity: 0.6; }

.gd-chart-tooltip {
  position: absolute; pointer-events: none;
  background: var(--ink-0); color: var(--surface-0);
  font-family: var(--font-mono); font-size: 0.8rem;
  padding: 10px 14px; border-radius: var(--r-sm);
  opacity: 0; transition: opacity 120ms ease;
  /* Anchor BELOW the cursor — .gd-trend-wrap has overflow:hidden so floating
     above the bars clipped the tooltip at the top edge. Anchoring below
     places it within the wrap bounds where there's room for it. */
  transform: translate(-50%, 0);
  white-space: nowrap; z-index: 5;
  box-shadow: var(--elev-2);
  min-width: 200px;
}
.gd-chart-tooltip.show { opacity: 1; }
.gd-chart-tooltip .ttip-month {
  font-size: 0.7rem; color: rgba(255,255,255,0.65);
  text-transform: uppercase; letter-spacing: 0.12em;
  margin-bottom: 6px; padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
}
.gd-chart-tooltip .ttip-row {
  display: flex; justify-content: space-between; gap: 16px;
  padding: 2px 0;
}
.gd-chart-tooltip .ttip-row span { color: rgba(255,255,255,0.72); }
.gd-chart-tooltip .ttip-row b { color: var(--surface-0); font-weight: 700; font-feature-settings: 'tnum' 1; }
.gd-chart-tooltip .ttip-mom {
  display: inline-block;
  padding: 2px 6px; border-radius: 3px;
  font-size: 0.65rem; letter-spacing: 0.04em;
  font-weight: 700;
}
.gd-chart-tooltip .ttip-mom.mom-up { background: rgba(8, 120, 108, 0.35); color: #6ee7b7; }
.gd-chart-tooltip .ttip-mom.mom-down { background: rgba(238, 83, 61, 0.35); color: #fca5a5; }

/* Right-side summary card with Landing | Partner split */
.gd-trend-side {
  border-left: 1px solid var(--line-1);
  padding: 14px 16px;
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface-1) 100%);
  display: flex; flex-direction: column; gap: 10px;
}
.gd-split-card {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  border: 1px solid var(--line-1);
  border-radius: var(--r-sm);
  overflow: hidden;
  background: var(--surface-1);
}
.gd-split-col {
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px;
  min-width: 0;
}
.gd-split-col + .gd-split-col {
  border-left: 1px dashed var(--line-1);
  background: var(--surface-2);
}
.gd-split-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line-1);
}
.gd-split-head .who { font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.16em; font-weight: 700; }
.gd-split-head .who.landing { color: var(--landing-blue); }
.gd-split-head .who.partner { color: var(--ink-1); }
.gd-trend-wrap.str .gd-split-head .who.landing { color: var(--str); }
.gd-split-head .take { font-family: var(--font-mono); font-size: 0.55rem; color: var(--ink-3); letter-spacing: 0.08em; font-weight: 600; }
.gd-split-total { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700; color: var(--ink-0); letter-spacing: -0.01em; line-height: 1; }
.gd-split-row   { display: flex; align-items: baseline; justify-content: space-between; font-family: var(--font-mono); font-size: 0.62rem; }
.gd-split-row .l{ color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.55rem; }
.gd-split-row .v{ color: var(--ink-0); font-weight: 600; font-size: 0.68rem; }
