function gridPeriodMiddleCols() {
  const meta = PERIOD_META[gridPeriod];
  const suffix = meta ? ` (${meta.label})` : '';
  return [
    { id: 'period_occupancy', label: 'Occupancy' + suffix, cls: 'num', sortable: true,
      title: 'Occupied unit-nights ÷ available unit-nights over ' + (meta?.desc || 'period'),
      cell: r => {
        const occ = r.period_occupancy, occW = occ != null ? Math.round(occ * 100) : 0;
        return `<td class="num"><div class="occ-wrap"><span class="occ-bar"><span class="occ-fill" style="width:${occW}%;background:${gOccColor(occ)}"></span></span><span class="occ-val" style="color:${gOccColor(occ)}">${gPct(occ)}</span></div></td>`;
      } },
    { id: 'period_reservations', label: 'Reservations', cls: 'num', sortable: true,
      title: 'Bookings that started in the period',
      cell: r => `<td class="num" style="font-weight:700">${gFmt(r.period_reservations)}</td>` },
    { id: 'period_occupied_nights', label: 'Cum. Nights', cls: 'num', sortable: true,
      title: 'Total occupied unit-nights across all units in the period',
      cell: r => `<td class="num">${gFmt(r.period_occupied_nights)}</td>` },
    { id: 'period_rev_per_res', label: 'Rev / Res', cls: 'num', sortable: true,
      title: 'Average revenue per new reservation started in the period',
      cell: r => `<td class="num">${r.period_rev_per_res != null ? '$' + Math.round(r.period_rev_per_res).toLocaleString() : '--'}</td>` },
    { id: 'period_revenue', label: 'Period Rev', cls: 'num', sortable: true,
      title: 'Total rent revenue booked through Landing in the period',
      cell: r => `<td class="num" style="color:var(--green);font-weight:700">${r.period_revenue != null ? '$' + Math.round(r.period_revenue).toLocaleString() : '--'}</td>` },
    { id: 'period_adr', label: 'ADR', cls: 'num', sortable: true,
      title: 'Average Daily Rate — revenue per occupied unit-night',
      cell: r => `<td class="num">${r.period_adr != null ? '$' + r.period_adr.toFixed(0) : '--'}</td>` },
    { id: 'period_revpau', label: 'RevPAU', cls: 'num', sortable: true,
      title: 'Revenue per Available Unit — revenue ÷ all available unit-nights (incl. vacant)',
      cell: r => `<td class="num" style="font-weight:700">${r.period_revpau != null ? '$' + r.period_revpau.toFixed(0) : '--'}</td>` },
  ];
}

function gridColumns() {
  const middle = gridPeriod === 'now' ? gridNowMiddleCols() : gridPeriodMiddleCols();
  return [...gridCommonHeadCols(), ...middle, ...gridCommonTailCols()];
}

function gridRenderThead() {
  const thead = document.getElementById('grid-thead');
  const cols = gridColumns();
  let html = '<tr>';
  for (const c of cols) {
    const clsParts = [];
    if (c.sortable) clsParts.push('sortable');
    if (c.cls) clsParts.push(c.cls);
    if (c.id && c.id === gridSortCol) {
      clsParts.push('sorted', gridSortDir === 'asc' ? 'asc' : 'desc');
    }
    const cls = clsParts.length ? ` class="${clsParts.join(' ')}"` : '';
    const dc = c.id ? ` data-col="${c.id}"` : '';
    const ttl = c.title ? ` title="${gEsc(c.title)}"` : '';
    html += `<th${cls}${dc}${ttl}>${gEsc(c.label)}</th>`;
  }
  html += '</tr>';
  thead.innerHTML = html;
}

function gridRender() {
  gridRenderThead();
  const tbody = document.getElementById('grid-body');
  const cols = gridColumns();
  const sorted = gridSorted(gridFiltered);
  if (!sorted.length) {
    tbody.innerHTML = `<tr><td colspan="${cols.length}" class="gd-empty">No properties match your search</td></tr>`;
    return;
  }
  let html = '';
  sorted.forEach(r => {
    const isExp = gridExpandedProp === r.property_name;
    html += `<tr class="${isExp ? 'expanded' : ''}" data-prop="${gEsc(r.property_name)}" onclick="gridToggleExpand('${gEsc(r.property_name)}')" onmouseenter="gridPrefetch('${gEsc(r.property_name)}')">`;
    for (const c of cols) {
      const out = c.cell(r);
      // If the cell function returned a full <td>, use it; otherwise wrap.
      if (typeof out === 'string' && out.trim().startsWith('<td')) html += out;
      else html += `<td${c.cls ? ' class="' + c.cls + '"' : ''}>${out}</td>`;
    }
    html += '</tr>';
  });
  tbody.innerHTML = html;
  // If a property was expanded, re-inject the detail row via targeted DOM
  if (gridExpandedProp) gridToggleExpand(gridExpandedProp);
}

// ─── Period filter handler ─────────────────────────────────────────────
// `force` bypasses the same-period no-op — used on initial load when the
// persisted period matches `gridPeriod` but we still need to fetch its data.
async function gridSetPeriod(period, force) {
  if (!PERIOD_META[period]) return;
  if (period === gridPeriod && !_periodLoading && !force) return;
  gridPeriod = period;
  try { localStorage.setItem('ap_grid_period', period); } catch {}

  // Reflect active state in segmented control
  document.querySelectorAll('#grid-period .grid-period-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.period === period);
  });

  // "Now" uses gridData directly, no extra fetch needed.
  if (period === 'now') {
    _periodLookup = {};
    // Reset sort to a column that exists in "now" mode if needed
    if (gridSortCol && gridSortCol.startsWith('period_')) {
      gridSortCol = 'property_name'; gridSortDir = 'asc';
    }
    mergePeriodIntoFiltered();
    gridApplyFilters();
    gridUpdateStats();
    return;
  }

  // Period mode — fetch rollups (cached per period)
  if (!_periodCache[period]) {
    _periodLoading = true;
    // Visual cue: disable buttons while loading
    document.querySelectorAll('#grid-period .grid-period-btn').forEach(b => b.disabled = true);
    try {
      const resp = await fetch(GRID_API + '/grid-history?period=' + encodeURIComponent(period));
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      _periodCache[period] = Array.isArray(data.records) ? data.records : [];
    } catch (e) {
      console.error('grid-history fetch failed:', e);
      _periodCache[period] = [];
      // Don't leave user stuck — revert to Now
      alert('Could not load ' + PERIOD_META[period].label + ' rollups: ' + e.message);
      gridSetPeriod('now');
      return;
    } finally {
      _periodLoading = false;
      document.querySelectorAll('#grid-period .grid-period-btn').forEach(b => b.disabled = false);
    }
  }

  // Build lookup: property_name -> period record
  _periodLookup = {};
  for (const p of _periodCache[period]) {
    if (p.property_name) _periodLookup[p.property_name] = p;
  }

  // Default-sort by Period Rev (desc) the first time user switches to a period
  if (!gridSortCol || !gridSortCol.startsWith('period_')) {
    gridSortCol = 'period_revenue'; gridSortDir = 'desc';
  }

  mergePeriodIntoFiltered();
  gridApplyFilters();
  gridUpdateStats();
}

// Merge period fields into each gridData record so sort + render can read them directly.
function mergePeriodIntoFiltered() {
  for (const r of gridData) {
    // Clear any previous period values
    delete r.period_occupancy; delete r.period_reservations; delete r.period_occupied_nights;
    delete r.period_rev_per_res; delete r.period_revenue; delete r.period_adr;
    delete r.period_revpau; delete r.period_available_nights; delete r.period_cost;
    const p = _periodLookup[r.property_name];
    if (p) {
      r.period_occupancy = p.period_occupancy;
      r.period_reservations = p.period_reservations;
      r.period_occupied_nights = p.period_occupied_nights;
      r.period_available_nights = p.period_available_nights;
      r.period_rev_per_res = p.period_rev_per_res;
      r.period_revenue = p.period_revenue;
      r.period_cost = p.period_cost;
      r.period_adr = p.period_adr;
      r.period_revpau = p.period_revpau;
    }
  }
}

function gridToggleExpand(name) {
  const tbody = document.getElementById('grid-body');
  const prev = gridExpandedProp;
  gridExpandedProp = prev === name ? null : name;

  // Targeted DOM: remove old detail row + un-expand old row
  if (prev) {
    const oldDetail = document.getElementById('grid-detail-row');
    if (oldDetail) oldDetail.remove();
    // Remove 'expanded' class from old row
    for (const tr of tbody.querySelectorAll('tr.expanded')) tr.classList.remove('expanded');
  }

  if (gridExpandedProp) {
    // Find the clicked row and insert detail after it
    const rows = tbody.querySelectorAll('tr');
    for (const tr of rows) {
      if (tr.getAttribute('data-prop') === gridExpandedProp) {
        tr.classList.add('expanded');
        const r = gridFiltered.find(d => d.property_name === gridExpandedProp);
        if (!r) break;
        const detailTr = document.createElement('tr');
        detailTr.id = 'grid-detail-row';
        detailTr.innerHTML = `<td colspan="14" class="grid-detail-cell"><div class="grid-detail">
          <div id="grid-detail-header" class="gd-detail-header"></div>
          <div id="grid-detail-trend"></div>
          <div class="grid-detail-tabs">
            <button class="gd-tab active" onclick="event.stopPropagation();gridDetailTab('${gEsc(r.property_name)}','units',this)">Units &amp; Status</button>
            <button class="gd-tab" onclick="event.stopPropagation();gridDetailTab('${gEsc(r.property_name)}','reservations',this)">Reservations</button>
          </div>
          <div id="grid-detail-content" class="gd-loading"><div class="spinner" style="display:inline-block;width:16px;height:16px;border-width:2px;vertical-align:middle;margin-right:6px"></div>Loading...</div>
        </div></td>`;
        tr.after(detailTr);
        gridLoadUnits(gridExpandedProp);
        break;
      }
    }
  }
}

// Fetch both units + reservations in one call, cache with 10-min TTL
const DETAIL_TTL = 600000; // 10 minutes
async function fetchPropertyDetail(name) {
  const cached = _detailCache[name];
  if (cached && (Date.now() - cached._ts) < DETAIL_TTL) return cached;
  const resp = await fetch(GRID_API + '/property-detail?name=' + encodeURIComponent(name));
  if (!resp.ok) throw new Error('API returned ' + resp.status);
  const data = await resp.json();
  data._ts = Date.now();
  _detailCache[name] = data;
  return data;
}

// Prefetch on hover — cache-warms so click is instant
let _prefetchTimer = null;
function gridPrefetch(name) {
  clearTimeout(_prefetchTimer);
  _prefetchTimer = setTimeout(() => {
    const cached = _detailCache[name];
    if (!cached || (Date.now() - cached._ts) >= DETAIL_TTL) {
      fetchPropertyDetail(name).catch(() => {}); // fire-and-forget
    }
  }, 150);
}

async function gridDetailTab(name, tab, btn) {
  btn.parentElement.querySelectorAll('.gd-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const el = document.getElementById('grid-detail-content');
  if (!el) return;

  // If cached and fresh, render instantly
  const cached = _detailCache[name];
  if (cached && (Date.now() - cached._ts) < DETAIL_TTL) {
    if (tab === 'units') renderUnitTable(el, cached.units, cached.meta);
    else renderResTable(el, cached.reservations, cached.units);
    return;
  }

  // Otherwise show loader and fetch
  el.innerHTML = '<div class="gd-loading"><div class="spinner" style="display:inline-block;width:16px;height:16px;border-width:2px;vertical-align:middle;margin-right:6px"></div>Loading...</div>';
  try {
    const data = await fetchPropertyDetail(name);
    if (tab === 'units') renderUnitTable(el, data.units, data.meta);
    else renderResTable(el, data.reservations, data.units);
    renderDetailHeader(name, data);
    renderTrendModule(name, data);
  } catch (e) { el.innerHTML = `<div class="gd-empty">Error: ${e.message}</div>`; }
}

async function gridLoadUnits(name) {
  const el = document.getElementById('grid-detail-content');
  if (!el) return;

  const c = _detailCache[name];
  if (c && (Date.now() - c._ts) < DETAIL_TTL) {
    renderUnitTable(el, c.units, c.meta);
    renderDetailHeader(name, c);
    renderTrendModule(name, c);
    return;
  }

  el.innerHTML = '<div class="gd-loading"><div class="spinner" style="display:inline-block;width:16px;height:16px;border-width:2px;vertical-align:middle;margin-right:6px"></div>Loading...</div>';
  try {
    const data = await fetchPropertyDetail(name);
    renderUnitTable(el, data.units, data.meta);
    renderDetailHeader(name, data);
    renderTrendModule(name, data);
  } catch (e) { el.innerHTML = `<div class="gd-empty">Error: ${e.message}</div>`; }
}

function renderUnitTable(el, units, meta) {
    // Clear the loading class so the 32px padding from .gd-loading doesn't
    // push the table inward and force horizontal overflow of the detail panel.
    el.classList.remove('gd-loading');
    if (!units.length) { el.innerHTML = '<div class="gd-empty">No unit data</div>'; return; }

    // Quick counts for summary bar
    let cntOccupied = 0, cntAvailable = 0, cntDeinstalled = 0, cntNotInstalled = 0;
    let cntStrEligible = 0;
    for (const u of units) {
      const inst = u.home_is_installed === 'Yes';
      const rs = (u.home_reservation_status || '').toLowerCase();
      const hasRes = rs && !rs.includes('not reserved') && rs !== '';
      if (inst && hasRes) cntOccupied++;
      else if (inst && !hasRes) cntAvailable++;
      else if (u.deinstall_date) cntDeinstalled++;
      else cntNotInstalled++;
      if (u.str_eligible) cntStrEligible++;
    }
    const activeUnits = cntOccupied + cntAvailable;

    // Sort: occupied first, then available (by days vacant desc), then deinstalled, then not-installed
    const sorted = [...units].sort((a, b) => {
      function rank(u) {
        const inst = u.home_is_installed === 'Yes';
        const rs = (u.home_reservation_status || '').toLowerCase();
        const hasRes = rs && !rs.includes('not reserved') && rs !== '';
        if (inst && hasRes) return 0;   // occupied
        if (inst && !hasRes) return 1;  // available
        if (u.deinstall_date) return 3; // deinstalled
        return 2;                       // unactivated
      }
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      // Within available: sort by days vacant desc (worst first)
      if (ra === 1) return (b.days_vacant_standard || 0) - (a.days_vacant_standard || 0);
      // Otherwise sort by unit number
      return String(a.unit_number || '').localeCompare(String(b.unit_number || ''), undefined, { numeric: true });
    });

    // Stat strip — extended w/ Today's Occ + (when STR-active) property ADR
    const occToday = activeUnits > 0 ? (cntOccupied / activeUnits) : null;
    const adrSlot = (meta && meta.property_adr != null)
      ? `<span><b style="color:var(--str-2);font-weight:800">$${meta.property_adr}</b> ADR today</span>`
      : '';
    const strSlot = cntStrEligible > 0
      ? `<span><b style="color:var(--str-2);font-weight:800">${cntStrEligible}</b> STR-eligible</span>`
      : '';

    let h = `<div style="display:flex;gap:14px;margin-bottom:10px;font-family:Outfit,sans-serif;font-size:0.7rem;color:var(--silver);flex-wrap:wrap">
      <span><b style="color:var(--white);font-weight:800">${activeUnits}</b> active</span>
      <span><span class="unit-dot unit-dot-green"></span><b style="color:var(--green)">${cntOccupied}</b> occupied</span>
      <span><span class="unit-dot unit-dot-amber"></span><b style="color:#B95B00">${cntAvailable}</b> available</span>
      ${cntDeinstalled ? '<span><span class="unit-dot unit-dot-red"></span><b style="color:#EE533D">' + cntDeinstalled + '</b> deinstalled</span>' : ''}
      ${cntNotInstalled ? '<span><span class="unit-dot unit-dot-blue"></span><b style="color:var(--blue)">' + cntNotInstalled + '</b> unactivated</span>' : ''}
      ${occToday != null ? `<span><b style="color:var(--white);font-weight:800">${Math.round(occToday * 100)}%</b> occ today</span>` : ''}
      ${strSlot}
      ${adrSlot}
    </div>
    <table class="gd-subtable"><thead><tr>
      <th>Unit</th><th>Status</th><th>Res. Status</th><th>Current Reservation</th><th>Days Vacant</th>
      <th class="num">Base Rent</th><th class="num">Landing Rent</th>
      <th class="num" title="Month-to-date revenue collected on this unit. For LT/mid-term: accumulated daily slice. For STR: sum of all stay revenues so far this month.">MTD $</th>
      <th class="num">Markup</th><th>Deinstall</th>
    </tr></thead><tbody>`;
    sorted.forEach(u => {
      // Status indicator — use installed + reservation status as the real signals
      const installed = u.home_is_installed === 'Yes';
      const resStatus = (u.home_reservation_status || '').toLowerCase();
      const hasRes = resStatus && !resStatus.includes('not reserved') && resStatus !== '';
      let statusIcon, statusTip;
      if (installed && hasRes) { statusIcon = '<span class="unit-dot unit-dot-green" title="Installed & Occupied"></span>'; statusTip = 'Occupied'; }
      else if (installed && !hasRes) { statusIcon = '<span class="unit-dot unit-dot-amber" title="Installed, No Reservation"></span>'; statusTip = 'Available'; }
      else if (!installed && u.deinstall_date) { statusIcon = '<span class="unit-dot unit-dot-red" title="Deinstalled"></span>'; statusTip = 'Deinstalled'; }
      else if (!installed) { statusIcon = '<span class="unit-dot unit-dot-blue" title="Never activated with Landing"></span>'; statusTip = 'Unactivated'; }
      else { statusIcon = '<span class="unit-dot unit-dot-red"></span>'; statusTip = 'Inactive'; }

      // Reservation status badge — Looker's home_reservation_status field is
      // unreliable for short-vs-long distinction (it labels 2-night and
      // 7-night stays as "Extended Stay" at One Club Gulf Shores). We compute
      // the ACTUAL reservation length from start/end dates and use that as
      // the source of truth:
      //   - < 30 actual nights AND str_eligible AND nightly → "Short-term"
      //   - 30+ actual nights → trust home_reservation_status (Extended Stay)
      //   - No active reservation → trust home_reservation_status (Not Reserved)
      // This catches 8 Metro 4608 (49-night = Extended Stay) and One Club's
      // genuine short stays (2-7 nights = Short-term).
      const resStatusRaw = u.home_reservation_status;
      const isNightly = u.rent_kind === 'nightly';
      const minStayU = u.minimum_nightly_stay || 0;
      // Compute actual current reservation length from raw dates
      const resStart = u.current_reservation_start_date_raw_date;
      const resEnd   = u.current_reservation_end_raw_date;
      let actualNights = null;
      if (resStart && resEnd) {
        const s = new Date(resStart), e = new Date(resEnd);
        if (!isNaN(s) && !isNaN(e)) actualNights = Math.round((e - s) / 86400000);
      }
      // True short-term: actual nights < 30, str_eligible, and nightly-billed.
      // We require an active reservation (actualNights != null) so vacant
      // units don't get labeled Short-term based on potential.
      const isTrueStr = u.str_eligible && isNightly && actualNights != null && actualNights > 0 && actualNights < 30;
      let resBadge = '<span style="color:var(--muted)">--</span>';
      if (isTrueStr) {
        resBadge = `<span class="gd-badge-str" title="STR-eligible · billed nightly · ${actualNights}-night actual stay (${minStayU}-night minimum on file)">Short-term</span>`;
      } else if (resStatusRaw) {
        const rsLower = resStatusRaw.toLowerCase();
        if (rsLower.includes('short'))                                   resBadge = `<span class="gd-badge-str">${gEsc(resStatusRaw)}</span>`;
        else if (rsLower.includes('extended') || rsLower.includes('long')
              || rsLower.includes('occupied') || rsLower.includes('indefinite'))
                                                                          resBadge = `<span class="gd-badge-curr">${gEsc(resStatusRaw)}</span>`;
        else if (rsLower.includes('vacant') || rsLower.includes('not reserved'))
                                                                          resBadge = `<span class="gd-badge-vacant">${gEsc(resStatusRaw)}</span>`;
        else if (rsLower.includes('standby'))                             resBadge = `<span class="gd-badge-standby">${gEsc(resStatusRaw)}</span>`;
        else                                                              resBadge = `<span class="gd-badge-other">${gEsc(resStatusRaw)}</span>`;
      }
      // Auxiliary tags that explain mismatches an operator might wonder about.
      // (1) Truly-short nightly stay on a non-STR property: actual reservation
      //     is < 30 nights but property doesn't allow STR. Unusual; flag for
      //     review. Uses actualNights (not min_stay) because min_stay alone
      //     isn't reliable — Looker often has 30-night min on units that are
      //     hosting 2-7 night stays in practice.
      // (2) STR-eligible-but-on-monthly: "STR paused" — Landing has nightly
      //     rights but the unit is currently on a long-term lease.
      // (3) Extended nightly: str_eligible + nightly + 30+ night actual stay.
      //     Labeled as Extended Stay (above) but a small chip clarifies it's
      //     nightly-billed (not a monthly lease).
      if (isNightly && !u.str_eligible && actualNights != null && actualNights > 0 && actualNights < 30) {
        resBadge += `<div style="margin-top:3px"><span class="gd-opportunity-tag" title="Priced nightly with a ${actualNights}-night actual stay on a property that doesn't allow STR — unusual configuration worth investigating.">short nightly · ${actualNights}nt actual</span></div>`;
      }
      const isDormant = u.str_eligible && !isNightly && installed && hasRes;
      if (isDormant) {
        resBadge += `<div style="margin-top:4px"><span class="gd-opportunity-tag" title="STR-eligible but currently on a monthly contract — could earn nightly">STR paused</span></div>`;
      }
      if (u.str_eligible && isNightly && actualNights != null && actualNights >= 30) {
        resBadge += `<div style="margin-top:3px"><span class="gd-opportunity-tag" title="STR-eligible and billed nightly, but the current reservation is ${actualNights} nights — long enough that it's classified as an extended stay, not true STR.">nightly · ${actualNights}nt stay</span></div>`;
      }

      // Rent — branch on nightly vs monthly
      const baseRent = u.rent_cost != null ? '$' + Number(u.rent_cost).toLocaleString() : '--';
      let landingCell = '<span style="color:var(--muted);font-size:0.62rem">--</span>';
      if (isNightly && u.nightly_rate != null) {
        const ntFmt = Number(u.nightly_rate).toFixed(2);
        const stayFmt = u.nightly_stay_total != null ? '$' + Math.round(u.nightly_stay_total).toLocaleString() : null;
        const nts = u.nightly_nights || 0;
        const moEq = u.landing_rent_mo_eq != null ? '≈$' + Math.round(u.landing_rent_mo_eq).toLocaleString() + '/mo eq.' : '';
        landingCell = `<div class="rent-stack">
          <span class="rent-primary nt">$${ntFmt}<span style="font-size:0.55rem;color:var(--ink-3);font-weight:400">/nt</span></span>
          ${stayFmt ? `<span class="rent-secondary">${stayFmt} stay total <span style="color:var(--ink-3);font-size:0.55rem">(${nts}nt)</span></span>` : ''}
          ${moEq ? `<span class="rent-secondary struck">${moEq}</span>` : ''}
        </div>`;
      } else if (u.landing_rent != null) {
        const baseHtml = `<span class="rent-primary">$${Number(u.landing_rent).toLocaleString()}</span>`;
        const oppHint = isDormant && meta && meta.property_adr != null
          ? `<span class="rent-tag-potential">~$${meta.property_adr}/nt avail at ADR</span>`
          : '';
        landingCell = `<div class="rent-stack">${baseHtml}<span class="rent-secondary">monthly</span>${oppHint}</div>`;
      }

      // MTD revenue cell — color-coded vs base rent
      let mtdCell = '<span style="color:var(--muted)">--</span>';
      if (u.mtd_revenue != null) {
        const mtd = u.mtd_revenue;
        let color = 'var(--ink-3)';
        if (mtd === 0) color = installed ? 'var(--error)' : 'var(--muted)';
        else if (u.rent_cost && mtd >= u.rent_cost) color = 'var(--success)';
        else color = 'var(--warning)';
        mtdCell = `<span style="color:${color};font-weight:600">$${Math.round(mtd).toLocaleString()}</span>`;
      }

      // Markup cell — branches:
      //   STR-active (nightly): MTD margin headline + nights/BE + per-stay
      //   Dormant STR (eligible, on monthly): realized monthly + STR potential
      //   LT: single realized markup %
      const baseN = Number(u.rent_cost);
      let markupCell = '<span style="color:var(--muted)">--</span>';
      if (isNightly && baseN > 0 && u.nightly_rate > 0) {
        const mtd = u.mtd_revenue || 0;
        const mtdMarginPct = ((mtd / baseN) - 1) * 100;
        const beN = u.str_break_even_nights || (baseN / u.nightly_rate);
        const beOccPct = Math.round((beN / 30.42) * 100);
        const mtdNts = u.mtd_nights || 0;
        const perStayPct = (((u.nightly_rate * 30.42) / baseN) - 1) * 100;
        const cls = mtdMarginPct >= 0 ? 'var(--success)' : 'var(--error)';
        // Two BE display modes:
        //   - Below break-even (negative margin): show the threshold + occ % needed
        //   - At/above break-even: replace with "BE met" — the threshold misleads
        //     once you've passed it, because actual break-even depends on the
        //     BLENDED rate across all stays this month, not just the current rate
        const beLine = mtdMarginPct >= 0
          ? `<b>${mtdNts}nt</b> MTD · <span class="markup-be-met">BE met ✓</span>`
          : `<b>${mtdNts}nt</b> MTD · BE <b>${beN.toFixed(1)}nt</b> <span class="markup-be-warn">(${beOccPct}% occ)</span>`;
        const ttip = mtdMarginPct >= 0
          ? `MTD margin = stay revenues ÷ base rent − 1. Already over break-even ($${Math.round(baseN)} base). Per-stay = current nightly rate vs daily base.`
          : `MTD margin = stay revenues ÷ base rent − 1. Break-even nights = base ÷ current nightly rate; blended rates across stays can change actual BE. Per-stay = nightly rate vs daily base.`;
        markupCell = `<span title="${ttip}">
          <span style="color:${cls};font-weight:700">${mtdMarginPct >= 0 ? '+' : ''}${mtdMarginPct.toFixed(0)}%</span>
          <span class="markup-mtd-info">${beLine}</span>
          <span class="markup-per-stay"><b>${perStayPct >= 0 ? '+' : ''}${perStayPct.toFixed(0)}%</b> per stay</span>
        </span>`;
      } else if (isDormant && u.computed_markup != null && meta && meta.property_adr != null && baseN > 0) {
        const realizedPct = u.computed_markup * 100;
        const propOcc = (occToday != null ? occToday : 0.75); // fall back if today's occ unknown
        const strPotPct = (((meta.property_adr * propOcc * 30.42) / baseN) - 1) * 100;
        markupCell = `<span title="Realized monthly markup. STR potential assumes property ADR × current property occupancy.">
          <span style="color:var(--success);font-weight:700">+${realizedPct.toFixed(1)}%</span>
          <span class="markup-mtd-info">monthly · realized</span>
          <span class="markup-per-stay">STR pot @ ${Math.round(propOcc * 100)}%: <b>${strPotPct >= 0 ? '+' : ''}${strPotPct.toFixed(0)}%</b></span>
        </span>`;
      } else {
        const markupVal = u.computed_markup != null ? u.computed_markup : u.markup;
        if (markupVal != null) {
          const color = markupVal > 0 ? 'var(--green)' : markupVal < 0 ? '#EE533D' : 'var(--muted)';
          markupCell = `<span style="color:${color};font-weight:700">${(markupVal * 100).toFixed(1)}%</span>`;
        }
      }

      // Vacancy
      const daysVacant = u.days_vacant_standard;
      let vacantHtml = '<span style="color:var(--muted)">--</span>';
      if (daysVacant != null) {
        const vc = daysVacant > 30 ? '#EE533D' : daysVacant > 14 ? '#B95B00' : 'var(--green)';
        vacantHtml = `<span style="color:${vc};font-weight:700">${daysVacant}d</span>`;
        if (u.vacant_since_date) vacantHtml += ` <span style="color:var(--muted);font-size:0.62rem">since ${gEsc(u.vacant_since_date)}</span>`;
      }

      // Current reservation — date pill + nights badge. Year is hidden when
      // the reservation is fully within the current year (compact, scannable);
      // appended on either end when it crosses years or sits outside (e.g.
      // "Dec 15 '25 → Feb 28 '26" so the timeline isn't ambiguous).
      let currRes = '<span style="color:var(--muted)">--</span>';
      if (u.current_reservation_start_date_raw_date) {
        const startIso = u.current_reservation_start_date_raw_date;
        const endIso   = u.current_reservation_end_raw_date;
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const parse = iso => {
          const m = iso && String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
          return m ? { y: +m[1], mo: +m[2], d: +m[3] } : null;
        };
        const sP = parse(startIso), eP = parse(endIso);
        const currentYear = new Date().getFullYear();
        // Show year on either end if not the current year, OR if start year ≠ end year
        const showStartYr = sP && (sP.y !== currentYear || (eP && sP.y !== eP.y));
        const showEndYr   = eP && (eP.y !== currentYear || (sP && sP.y !== eP.y));
        const fmt = (p, showYr) => {
          if (!p) return '?';
          return `${months[p.mo-1]} ${p.d}${showYr ? ` &rsquo;${String(p.y).slice(2)}` : ''}`;
        };
        const startStr = fmt(sP, showStartYr);
        const endStr   = eP ? fmt(eP, showEndYr) : '?';
        const nts = u.nightly_nights || (() => {
          if (!startIso || !endIso) return null;
          const s = new Date(startIso), e = new Date(endIso);
          if (isNaN(s) || isNaN(e)) return null;
          return Math.round((e - s) / 86400000);
        })();
        let badgeCls = '';
        if (nts != null) {
          if (nts < 14) badgeCls = isNightly ? 'str' : '';
          else if (nts >= 30) badgeCls = 'long';
        }
        const nightsBadge = nts != null
          ? `<span class="res-nights-badge ${badgeCls}">${nts} nt</span>`
          : '';
        currRes = `<div class="res-cell">
          <span class="res-dates-pill">${startStr}<span class="arrow">→</span>${endStr}</span>
          ${nightsBadge}
        </div>`;
      }

      // Deinstall — only show expected dates on non-installed units (stale expected dates on active units are noise)
      let deinstallHtml = '<span style="color:var(--muted)">--</span>';
      if (u.deinstall_date) {
        deinstallHtml = `<span style="color:#EE533D;font-weight:600">${gEsc(u.deinstall_date)}</span>`;
        if (u.home_deinstall_reason) deinstallHtml += `<br><span style="color:var(--muted);font-size:0.6rem">${gEsc(u.home_deinstall_reason)}</span>`;
      } else if (u.expected_deinstall_date && !installed) {
        deinstallHtml = `<span style="color:#B95B00">${gEsc(u.expected_deinstall_date)}</span> <span style="color:var(--muted);font-size:0.6rem">(expected)</span>`;
      }

      // Unit cell — number + STR mark (active or dormant variant) when eligible
      const strMark = u.str_eligible
        ? `<span class="str-mark${isNightly ? '' : ' dormant'}" title="${isNightly ? 'STR active · current res is nightly' : 'STR-eligible · currently on monthly contract'}">S</span>`
        : '';
      const unitCell = `<span class="gd-unit">${gEsc(u.unit_number)}${strMark}</span>`;

      h += `<tr>
        <td>${unitCell}</td>
        <td>${statusIcon} <span style="font-size:0.68rem">${statusTip}</span></td>
        <td>${resBadge}</td>
        <td style="font-size:0.7rem">${currRes}</td>
        <td>${vacantHtml}</td>
        <td class="num" style="text-align:right">${baseRent}</td>
        <td class="num" style="text-align:right">${landingCell}</td>
        <td class="num" style="text-align:right">${mtdCell}</td>
        <td class="num" style="text-align:right">${markupCell}</td>
        <td style="max-width:160px;white-space:normal;line-height:1.3">${deinstallHtml}</td>
      </tr>`;
    });
    h += '</tbody></table>';
    el.innerHTML = h;
}

// Detail-panel header — STR chip + first-stable-month "Onboarded" chip
function renderDetailHeader(name, data) {
  const el = document.getElementById('grid-detail-header');
  if (!el) return;
  const meta = data.meta || {};
  const trend = data.trend || [];
  const chips = [];
  // STR chip — driven solely by dimhome.str_status='enabled' per unit,
  // rolled up to the property. Single source of truth, matches the grid pill.
  // Nightly billing alone does NOT mean STR (2001 East has long nightly stays
  // but its str_status is "not wanted by property" — that's LT, not STR).
  const strUnits = meta.str_unit_count || 0;
  if (meta.property_str_eligible) {
    chips.push(`<span class="gd-chip-str">STR enabled${strUnits ? ' · ' + strUnits + ' units' : ''}</span>`);
  } else {
    chips.push(`<span class="gd-chip-aux">Long-term only</span>`);
  }
  // Onboarded date = first month with any reporting in the trend
  const onb = trend.find(m => m.l != null || m.p != null || m.g != null);
  if (onb) {
    const monthsActive = trend.filter(m => m.l != null || m.p != null || m.g != null).length;
    chips.push(`<span class="gd-chip-aux">Onboarded · ${onb.period} · ${monthsActive}mo</span>`);
  }
  el.innerHTML = chips.join('');
}

// Build the per-unit base-rent table used inside the methodology disclosure.
// Reps open this when a partner asks "where did the contract base come from?"
// Each row is a real unit + its contracted rent + STR / LT class.
function renderUnitRentTable(units) {
  if (!units || !units.length) return '';
  let ltSubtotal = 0, strSubtotal = 0;
  const rows = units.slice(0, 30).map(u => {
    const rent = u.rent_cost || 0;
    const isStr = !!u.str_eligible;
    if (isStr) strSubtotal += rent; else ltSubtotal += rent;
    return `<tr class="${isStr ? 'str' : 'lt'}">
      <td>Unit ${gEsc(u.unit_number || '—')}</td>
      <td>${isStr ? 'STR' : 'LT'}</td>
      <td class="num">$${rent.toLocaleString()}</td>
    </tr>`;
  }).join('');
  const total = ltSubtotal + strSubtotal;
  const moreNote = units.length > 30 ? `<tr><td colspan="3" style="text-align:center;font-style:italic;color:var(--ink-3);font-size:10px">+ ${units.length - 30} more units · only first 30 shown</td></tr>` : '';
  return `<table class="gd-meth-table">
    <thead><tr><th>Unit</th><th>Type</th><th class="num">Base rent</th></tr></thead>
    <tbody>${rows}${moreNote}</tbody>
    <tfoot>
      ${ltSubtotal > 0 ? `<tr><td colspan="2"><b>LT subtotal</b></td><td class="num"><b>$${ltSubtotal.toLocaleString()}</b></td></tr>` : ''}
      ${strSubtotal > 0 ? `<tr><td colspan="2"><b>STR subtotal</b></td><td class="num"><b>$${strSubtotal.toLocaleString()}</b></td></tr>` : ''}
      <tr><td colspan="2"><b>Contract base / month</b></td><td class="num"><b>$${total.toLocaleString()}</b></td></tr>
    </tfoot>
  </table>`;
}

// ─── Trend module · v4 mock parity ────────────────────────────────────
// Layout: chart on top + per-month rollup grid + aside with two POV panes
//   + collapsible methodology disclosure (the audit trail).
//   Partner POV : Cumulative recovery vs contract base, with breakdown
//                  (Actual to partner / Contract base / LT alt) + trajectory.
//   Landing POV : Net vs LT-only alt @ X% with breakdown + talking points.
// Properties without bundle data get an honest refusal block, not fake data.
function renderTrendModule(name, data) {
  const wrap = document.getElementById('grid-detail-trend');
  if (!wrap) return;
  const trend = data.trend || [];
  const meta  = data.meta || {};
  const gridRow = (typeof gridData !== 'undefined' ? gridData : []).find(g => g.property_name === name) || {};
  const units = gridRow.home_count || 0;
  const strUnits = gridRow.str_unit_count || meta.str_unit_count || 0;
  const ltUnits = Math.max(0, units - strUnits);
  const isStr = !!meta.property_str_eligible || strUnits > 0;
  const monthlyBase = (gridRow.home_average_rent_cost || 0) * units;
  const fmtK = v => v == null ? '—' : (Math.abs(v) >= 1000 ? '$' + (v / 1000).toFixed(1) + 'K' : '$' + Math.round(v));
  const fmtKShort = v => v == null ? '—' : (Math.abs(v) >= 1000 ? '$' + Math.round(v / 1000) + 'K' : '$' + Math.round(v));

  // No bundle data → honest refusal state. We don't fabricate POV numbers
  // because the LT counterfactual math depends on a real cumulative comparison.
  if (!trend.length || !trend.some(m => m.l != null || m.p != null)) {
    wrap.innerHTML = `<div class="gd-trend-wrap"><div class="gd-trend-chart-wrap">
      <div class="gd-trend-eyebrow">
        <span class="gd-trend-title">Revenue trajectory</span>
      </div>
      <div class="gd-proj-refuse">
        <b>P&amp;L unavailable.</b> This property hasn't reported into the revshare bundle yet
        (bundle covers Jun 2025 → Apr 2026). Once a month of revshare data exists,
        Partner POV recovery, Landing POV vs-LT comparison, and the per-month rollup
        will populate automatically.
        ${units > 0 ? `<div style="margin-top:8px;font-size:11px;color:var(--ink-3)">Snapshot: ${units} installed units${strUnits ? ' (' + strUnits + ' STR-eligible)' : ''}${monthlyBase > 0 ? ' · contract base $' + Math.round(monthlyBase).toLocaleString() + '/mo' : ''}</div>` : ''}
      </div>
    </div></div>`;
    return;
  }

  // Aggregates
  let totalL = 0, totalP = 0, monthsWithData = 0;
  let latestL = null, latestP = null, latestMonth = null;
  let prevL = null, prevP = null;
  for (const m of trend) {
    if (m.l == null && m.p == null) continue;
    monthsWithData++;
    totalL += m.l || 0;
    totalP += m.p || 0;
    prevL = latestL; prevP = latestP;
    latestL = m.l; latestP = m.p; latestMonth = m.period;
  }
  const totalToParties = totalL + totalP;
  // Contract base — use ACTUAL sum of per-unit contracted rents when units
  // data is available (more honest than count × average since each unit has
  // its own rent_cost). Fall back to count × avg only if units array missing.
  const unitsArr = data.units || [];
  const monthlyBaseActual = unitsArr.reduce((s, u) => s + (u.rent_cost || 0), 0);
  const useActualBase = unitsArr.length > 0 && monthlyBaseActual > 0;
  const effectiveMonthlyBase = useActualBase ? monthlyBaseActual : monthlyBase;
  const contractBase = effectiveMonthlyBase * monthsWithData;
  // Contracted rev share — derived from signoff rent-roll mgmt_fee per month
  // (|mgmt_fee| ÷ gross). This IS the partnership's contracted Landing take
  // rate. Other fees (FFE / install / wifi) are setup-cost reimbursements
  // and aren't part of the rev share.
  const contractedMgmtPct = gridRow.contracted_mgmt_pct;
  const contractedMgmtMonths = gridRow.contracted_mgmt_months;
  const contractedMgmtMin = gridRow.contracted_mgmt_min;
  const contractedMgmtMax = gridRow.contracted_mgmt_max;
  const hasContractedRs = contractedMgmtPct != null;
  const contractedMgmtStable = hasContractedRs && (contractedMgmtMax - contractedMgmtMin) < 0.5;
  // Partner's contracted share is the complement of Landing's mgmt fee — if
  // Landing's contract takes 25% of gross via mgmt fee, the partner's
  // contract entitles them to the remaining 75%.
  const contractedPartnerPct = hasContractedRs ? Math.round((100 - contractedMgmtPct) * 10) / 10 : null;
  const partnerRecoveryPct = contractBase > 0 ? Math.round((totalP / contractBase) * 100) : null;
  const allInRecoveryPct = contractBase > 0 ? Math.round((totalToParties / contractBase) * 100) : null;
  const partnerShortfall = contractBase > 0 ? contractBase - totalP : null;
  const partnerVerdictCls = partnerShortfall == null ? '' : (partnerShortfall > contractBase * 0.05 ? 'shortfall' : partnerShortfall < -contractBase * 0.05 ? 'surplus' : 'even');
  const partnerVerdictSign = partnerShortfall == null ? '' : (partnerShortfall >= 0 ? '−' : '+');
  // Take rates — Landing's share of total cash that flowed to either party.
  // For LT-only properties Landing typically takes 20-35% (markup on contract
  // base). For STR-dominant properties Landing operates bookings and keeps a
  // bigger share (often 50%+), while partner receives an effective base-rent
  // equivalent. Surfacing both numbers prevents the "wait, why is Landing
  // more than Partner?" confusion when the property is STR-heavy.
  const landingTakePct = totalToParties > 0 ? Math.round((totalL / totalToParties) * 100) : null;
  const partnerTakePct = landingTakePct != null ? 100 - landingTakePct : null;
  const takeInverted = landingTakePct != null && landingTakePct > 50;   // Landing keeps more (STR-typical)

  // Vacant-fallback counterfactual: these units are hard-to-lease — without
  // Landing they'd typically sit vacant most of the time. 15% occupancy is
  // a realistic baseline for that "would otherwise be empty" scenario, much
  // more honest than comparing to a stabilized-LT 85%. Toggle 10/15/25 in
  // the eyebrow for more or less generous assumptions.
  const ltAlt85 = contractBase * 0.15;   // var name kept for selector compat
  const landingNetVsLt85 = totalToParties - ltAlt85;
  const netSign = landingNetVsLt85 >= 0 ? '+' : '−';
  const netCls = landingNetVsLt85 >= 0 ? 'surplus' : 'shortfall';

  // Trajectory (last vs prior month)
  const lDelta = (latestL != null && prevL != null && prevL > 0) ? ((latestL / prevL) - 1) * 100 : null;
  let trajCls = 'flat', trajGlyph = '→', trajText = 'Steady · MoM';
  if (lDelta != null) {
    if (lDelta > 5)        { trajCls = 'surplus';     trajGlyph = '↗'; trajText = 'Growing · ' + lDelta.toFixed(1) + '% MoM'; }
    else if (lDelta < -5)  { trajCls = 'widening';    trajGlyph = '▾'; trajText = 'Softening · ' + lDelta.toFixed(1) + '% MoM'; }
  }

  // Source-mix from unit ratio (we don't have per-month $ split, only units).
  const ltPct  = units > 0 ? Math.round((ltUnits  / units) * 100) : 0;
  const strPct = units > 0 ? 100 - ltPct : 0;

  // Narrative — generated from the actual numbers
  const dirWord = lDelta == null ? 'flat MoM' : (lDelta > 0 ? 'up ' + lDelta.toFixed(1) + '%' : 'down ' + Math.abs(lDelta).toFixed(1) + '%');
  const partnerStanding = partnerRecoveryPct == null ? 'unknown' : (partnerRecoveryPct >= 95 ? 'on plan' : partnerRecoveryPct >= 60 ? 'below plan' : 'well below plan');
  const narrative = `Over ${monthsWithData} months, partner received <b>${fmtK(totalP)}</b> of <b>${fmtK(contractBase)}</b> contract base (${partnerRecoveryPct}% — ${partnerStanding}). Last reported month is ${dirWord} vs prior. Landing kept <b>${fmtK(totalL)}</b> over the same window.`;

  const accentLabel = isStr ? 'STR — variable revenue add' : 'LT — standard split';

  // Helper: synthesize N future months from avg-of-last-3 actual values.
  // Months are marked .isProjection so chart + rollup can style them lighter
  // and so they're excluded from the cumulative POV math (we don't want
  // hypothetical Aug 2026 numbers inflating "actual" Partner net).
  function buildProjectionMonths(trend, horizon) {
    if (!horizon) return [];
    const lastL = trend.slice().reverse().filter(t => t.l != null).slice(0, 3);
    const lastP = trend.slice().reverse().filter(t => t.p != null).slice(0, 3);
    const lastO = trend.slice().reverse().filter(t => t.o != null).slice(0, 3);
    if (!lastL.length) return [];
    const avgL = lastL.reduce((s, t) => s + t.l, 0) / lastL.length;
    const avgP = lastP.length ? lastP.reduce((s, t) => s + t.p, 0) / lastP.length : 0;
    const avgO = lastO.length ? lastO.reduce((s, t) => s + t.o, 0) / lastO.length : null;
    const monthLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const lastPeriod = trend[trend.length - 1].period;   // e.g. "Apr 2026"
    const pm = lastPeriod.match(/^(\w{3}) (\d{4})$/);
    if (!pm) return [];
    let mIdx = monthLabels.indexOf(pm[1]);
    let year = parseInt(pm[2], 10);
    const out = [];
    for (let i = 0; i < horizon; i++) {
      mIdx++;
      if (mIdx >= 12) { mIdx = 0; year++; }
      out.push({
        period: monthLabels[mIdx] + ' ' + year,
        l: Math.round(avgL),
        p: Math.round(avgP),
        g: Math.round(avgL + avgP),
        o: avgO,                  // projected occupancy = avg of last 3 actual months
        isProjection: true,
      });
    }
    return out;
  }

  // Build the per-month rollup grid: label col + monthHeader cols, then rows:
  //   Landing $ / Partner $ / Total $ / Recovery % / Landing take %
  // Projection months get a ".proj" class so they fade visually.
  function buildRollupHTML(months) {
    const cells = [];
    cells.push('<div class="gd-rollup-cell label">&nbsp;</div>');
    for (const m of months) cells.push(`<div class="gd-rollup-cell month-header${m.isProjection ? ' proj' : ''}">${gEsc(m.period)}${m.isProjection ? ' <span class="proj-tag">proj</span>' : ''}</div>`);
    // Landing row
    cells.push('<div class="gd-rollup-cell label"><span class="swatch lt"></span>Landing</div>');
    for (const m of months) {
      if (m.l == null) cells.push('<div class="gd-rollup-cell ghost">—</div>');
      else cells.push(`<div class="gd-rollup-cell lt${m.isProjection ? ' proj' : ''}">${fmtKShort(m.l)}</div>`);
    }
    // Partner row
    cells.push('<div class="gd-rollup-cell label"><span class="swatch partner"></span>Partner</div>');
    for (const m of months) {
      if (m.p == null) cells.push('<div class="gd-rollup-cell ghost">—</div>');
      else cells.push(`<div class="gd-rollup-cell partner${m.isProjection ? ' proj' : ''}">${fmtKShort(m.p)}</div>`);
    }
    // Total row
    cells.push('<div class="gd-rollup-cell label">Total</div>');
    for (const m of months) {
      if (m.l == null && m.p == null) { cells.push('<div class="gd-rollup-cell ghost">—</div>'); continue; }
      const tot = (m.l || 0) + (m.p || 0);
      cells.push(`<div class="gd-rollup-cell total${m.isProjection ? ' proj' : ''}">${fmtKShort(tot)}</div>`);
    }
    // Per-month "% of base" row (color-coded). Renamed from "Recovery" for clarity.
    cells.push('<div class="gd-rollup-cell label" title="Each month\'s total (Landing + Partner) ÷ that month\'s contract base. 100% = full base earned.">% of base</div>');
    for (const m of months) {
      if ((m.l == null && m.p == null) || !monthlyBase) { cells.push('<div class="gd-rollup-cell ghost">—</div>'); continue; }
      const tot = (m.l || 0) + (m.p || 0);
      const pct = Math.round((tot / monthlyBase) * 100);
      const cc = pct >= 95 ? 'good' : pct >= 60 ? 'warn' : 'bad';
      cells.push(`<div class="gd-rollup-cell actual ${cc}${m.isProjection ? ' proj' : ''}">${pct}%</div>`);
    }
    // Landing take row
    cells.push('<div class="gd-rollup-cell label" title="Landing\'s share of monthly net (Landing ÷ Total).">L take</div>');
    for (const m of months) {
      const tot = (m.l || 0) + (m.p || 0);
      if ((m.l == null && m.p == null) || tot === 0) { cells.push('<div class="gd-rollup-cell ghost">—</div>'); continue; }
      const pct = Math.round(((m.l || 0) / tot) * 100);
      cells.push(`<div class="gd-rollup-cell lt${m.isProjection ? ' proj' : ''}">${pct}%</div>`);
    }
    return cells.join('');
  }
  // Initial rollup (no projection)
  const rollupInitial = buildRollupHTML(trend);

  wrap.innerHTML = `<div class="gd-trend-wrap ${isStr ? 'str' : ''}">
    <div class="gd-trend-chart-wrap">
      <div class="gd-trend-eyebrow">
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
          <span class="gd-trend-title">Revenue trajectory</span>
          <span class="gd-trend-subtitle">Landing vs partner · monthly net · ${monthsWithData} of ${trend.length} mo reporting</span>
        </div>
        <div class="gd-pov-row">
          <div class="gd-pov-toggle" role="tablist" aria-label="Point of view">

        bold.classList.add(netVsLt >= 0 ? 'good' : 'bad');

      // Partner POV — recompute partner vs LT

// Pure SVG painter — takes the prepared <g class="bars">/etc. and fills them.
// Coordinate system: viewBox 0 0 660 200, plot area y = 30..170.
function paintTrendChart(svg, ttip, trend) {
  const N = trend.length;
  if (!N) return;
  const left = 30, right = 660, top = 30, bottom = 170;
  const colW = (right - left) / N;
  const barW = colW * 0.58;

  // Y axis max = max gross (landing + partner), rounded up to nice number
  let maxStack = 0;
  for (const m of trend) {
    const s = (m.l || 0) + (m.p || 0);
    if (s > maxStack) maxStack = s;
  }
  // Round to nearest sensible $$ ceiling
  const niceMax = (() => {
    if (maxStack === 0) return 1000;
    const mag = Math.pow(10, Math.floor(Math.log10(maxStack)));
    const ratio = maxStack / mag;
    let nice = 10;
    if (ratio <= 1) nice = 1; else if (ratio <= 2) nice = 2; else if (ratio <= 5) nice = 5;
    return nice * mag * 1.2; // 20% headroom — enough for occ line at top without making bars look short
  })();

  // Grid lines + axis labels
  const ticks = [niceMax * 0.25, niceMax * 0.5, niceMax * 0.75];
  let gridHtml = '';
  ticks.forEach(t => {
    const y = bottom - (t / niceMax) * (bottom - top);
    gridHtml += `<line class="grid-line" x1="0" y1="${y}" x2="660" y2="${y}"/>`;
    const tLabel = t >= 1000 ? '$' + Math.round(t / 1000) + 'K' : '$' + Math.round(t);
    gridHtml += `<text class="axis-label" x="2" y="${y + 3}">${tLabel}</text>`;
  });
  svg.querySelector('.grid').innerHTML = gridHtml;

  // Find onboarding index (first month with any data)
  const onboardingIdx = trend.findIndex(m => m.l != null || m.p != null || m.g != null);

  // Render bars + occ line + hit targets
  let barsHtml = '';
  let xLabelsHtml = '';
  let occDotsHtml = '';
  const occPtsActual = [];
  const occPtsProj   = [];
  let lastActualOccPt = null;   // for stitching the projection line back to actual
  const occVals = trend.filter(m => m.o != null).map(m => m.o);
  const maxOcc = occVals.length ? Math.max(...occVals) : 0;

  // Y position for x-axis labels — bumped down to match the new 240px chart height
  const labelY = bottom + 18;

  for (let i = 0; i < N; i++) {
    const cx = left + i * colW + colW / 2;
    const x  = cx - barW / 2;
    const m  = trend[i];

    // Deduplicate year suffix on x-axis labels. Show "Mon YYYY" only on the
    // first month and any month that's a different year than the previous one
    // (typically Jan boundaries). Other months show just "Mon". Prevents
    // collision when projection adds extra columns and labels run together.
    const prevPeriod = i > 0 ? trend[i - 1].period : null;
    const prevYear = prevPeriod ? prevPeriod.split(' ')[1] : null;
    const [monStr, yearStr] = (m.period || '').split(' ');
    const showYear = (i === 0) || (yearStr !== prevYear);
    const periodLabel = showYear ? `${monStr} ${yearStr}` : monStr;
    const labelClass = (i === 0 || i === N - 1 || showYear) ? 'axis-label axis-label-strong' : 'axis-label';
    xLabelsHtml += `<text class="${labelClass}" x="${cx}" y="${labelY}" text-anchor="middle">${gEsc(periodLabel)}</text>`;

    const hasData = (m.l != null || m.p != null || m.g != null);
    if (!hasData) {
      // Ghost / pre-onboarding
      barsHtml += `<rect class="bar-ghost" x="${x}" y="${bottom - 28}" width="${barW}" height="28" rx="1"/>`;
      continue;
    }

    // Onboarding flag — first month with data
    if (i === onboardingIdx && i > 0) {
      barsHtml += `<polygon class="onb-flag" points="${cx - 4},${top + 2} ${cx + 4},${top + 2} ${cx},${top + 8}"/>`;
      barsHtml += `<text class="onb-flag-label" x="${cx}" y="${top}" text-anchor="middle">onb</text>`;
    }

    const l = m.l || 0, p = m.p || 0;
    const total = l + p;
    if (total === 0) {
      // Onboarded but earned $0 — small pip + label
      const pipH = 3;
      barsHtml += `<rect class="bar-zero" x="${x}" y="${bottom - pipH}" width="${barW}" height="${pipH}" rx="1"/>`;
      barsHtml += `<text class="zero-label" x="${cx}" y="${bottom - 5}" text-anchor="middle">$0</text>`;
    } else {
      const totalH = (total / niceMax) * (bottom - top);
      const landingH = (l / niceMax) * (bottom - top);
      const partnerH = (p / niceMax) * (bottom - top);
      const projCls = m.isProjection ? ' proj' : '';
      if (landingH > 0) barsHtml += `<rect class="bar-landing${projCls}" x="${x}" y="${bottom - landingH}" width="${barW}" height="${landingH}" rx="1"/>`;
      if (partnerH > 0) barsHtml += `<rect class="bar-partner${projCls}" x="${x}" y="${bottom - totalH}" width="${barW}" height="${partnerH}" rx="1"/>`;
      // Light "proj" label above the projected bar so reps know it's not actual
      if (m.isProjection) {
        barsHtml += `<text class="proj-bar-label" x="${cx}" y="${bottom - totalH - 4}" text-anchor="middle">proj</text>`;
      }
    }

    if (m.o != null) {
      const oy = bottom - (m.o * (bottom - top));
      const pt = `${cx},${oy}`;
      if (m.isProjection) {
        // First projection point — stitch to the last actual occ point so the
        // dashed line connects to where the solid line left off (no gap).
        if (occPtsProj.length === 0 && lastActualOccPt) occPtsProj.push(lastActualOccPt);
        occPtsProj.push(pt);
        occDotsHtml += `<circle class="occ-dot occ-dot-proj" cx="${cx}" cy="${oy}" r="2.2"/>`;
      } else {
        occPtsActual.push(pt);
        lastActualOccPt = pt;
        const isApex = (m.o === maxOcc && m.o > 0);
        occDotsHtml += `<circle class="occ-dot${isApex ? ' occ-dot-active' : ''}" cx="${cx}" cy="${oy}" r="${isApex ? 3.2 : 2.4}"/>`;
      }
    }
  }

  // Hit targets (separate so they don't overlap visible bars).
  // Stash tooltip payloads on the SVG element itself instead of as JSON in
  // an HTML attribute — JSON quotes get truncated by attribute parsing
  // (data-info="{"month":...}" terminates at the first inner ").
  const hitInfo = [];
  let hitsHtml = '';
  let prevTotal = null;   // for MoM delta (skips ghost / null months)
  for (let i = 0; i < N; i++) {
    const m = trend[i];
    if (m.l == null && m.p == null && m.g == null) continue;
    const l = m.l || 0, p = m.p || 0;
    const total = l + p;
    const take = total > 0 ? Math.round(l / total * 100) : null;
    let momText = '';
    let momCls = '';
    if (prevTotal != null && prevTotal > 0 && total > 0) {
      const momPct = ((total - prevTotal) / prevTotal) * 100;
      const sign = momPct >= 0 ? '+' : '−';
      momText = `${sign}${Math.abs(momPct).toFixed(1)}% MoM`;
      momCls = momPct >= 0 ? 'mom-up' : 'mom-down';
    } else if (prevTotal == null) {
      momText = 'first month';
    }
    prevTotal = total;
    hitInfo.push({
      month: m.period,
      l: '$' + Math.round(l).toLocaleString(),
      p: '$' + Math.round(p).toLocaleString(),
      tot: '$' + Math.round(total).toLocaleString(),
      take: take != null ? take + '%' : '—',
      o: m.o != null ? (m.o * 100).toFixed(1) + '% occ' : '',
      u: m.u != null ? m.u + ' stays' : '',
      mom: momText,
      momCls,
    });
    const idx = hitInfo.length - 1;
    hitsHtml += `<rect class="col-hit" data-idx="${idx}" x="${left + i * colW}" y="${top}" width="${colW}" height="${bottom - top}"/>`;
  }
  svg._hitInfo = hitInfo;

  svg.querySelector('.bars').innerHTML = barsHtml + hitsHtml;
  svg.querySelector('.occ-line').setAttribute('points', occPtsActual.join(' '));
  const projLine = svg.querySelector('.occ-line-proj');
  if (projLine) projLine.setAttribute('points', occPtsProj.join(' '));
  svg.querySelector('.occ-dots').innerHTML = occDotsHtml;
  svg.querySelector('.xlabels').innerHTML = xLabelsHtml;

  // Tooltip — look up payload from the in-memory array by data-idx.
  // Clamps horizontal position so the tooltip can't extend past the chart
  // wrap bounds (otherwise it gets clipped on bars near the right edge).
  svg.addEventListener('mousemove', e => {
    const target = e.target.closest('.col-hit');
    if (!target) { ttip.classList.remove('show'); return; }
    const idx = +target.getAttribute('data-idx');
    const info = svg._hitInfo && svg._hitInfo[idx];
    if (!info) { ttip.classList.remove('show'); return; }
    const rect = svg.getBoundingClientRect();
    const wrap = ttip.parentElement.getBoundingClientRect();
    const cx = +target.getAttribute('x') + +target.getAttribute('width') / 2;
    const screenX = rect.left + (cx / 660) * rect.width;
    ttip.innerHTML = `
      <div class="ttip-month">${gEsc(info.month)} · L take ${gEsc(info.take)}${info.mom ? ` <span class="ttip-mom ${info.momCls}">${gEsc(info.mom)}</span>` : ''}</div>
      <div class="ttip-row"><span>Landing net</span><b>${gEsc(info.l)}</b></div>
      <div class="ttip-row"><span>Partner net</span><b>${gEsc(info.p)}</b></div>
      <div class="ttip-row"><span>Total net</span><b>${gEsc(info.tot)}</b></div>
      ${info.o ? `<div class="ttip-row"><span>Occ</span><b>${gEsc(info.o)}</b></div>` : ''}
      ${info.u ? `<div class="ttip-row"><span>Stays</span><b>${gEsc(info.u.replace(' stays',''))}</b></div>` : ''}
    `;
    // Position BELOW the cursor (.gd-trend-wrap has overflow:hidden, so above
    // gets clipped). translate(-50%, 0) places top-center at (left, top).
    // Clamp horizontally so the tooltip never extends past the wrap bounds.
    ttip.style.top = `${rect.bottom - wrap.top + 6}px`;
    ttip.style.left = '0px';   // measure with default position first
    ttip.classList.add('show');
    const tipW = ttip.getBoundingClientRect().width;
    const halfTip = tipW / 2;
    const wrapW = wrap.width;
    const rawLeft = screenX - wrap.left;
    const clampedLeft = Math.max(halfTip + 4, Math.min(wrapW - halfTip - 4, rawLeft));
    ttip.style.left = `${clampedLeft}px`;
  });
  svg.addEventListener('mouseleave', () => ttip.classList.remove('show'));
}

function renderResTable(el, res, units) {
    el.classList.remove('gd-loading');
    if (!res.length) { el.innerHTML = '<div class="gd-empty">No reservations</div>'; return; }

    // Build deinstall lookup from units data
    const diMap = {};
    if (units) {
      for (const u of units) {
        if (u.deinstall_date && u.unit_number != null) diMap[String(u.unit_number)] = u.deinstall_date;
      }
    }

    // Sort: Active first, then Upcoming, then Past. Within each group, newest start date first.
    const sorted = [...res].sort((a, b) => {
      function rank(r) {
        if (r.current_reservation_count > 0) return 0; // active
        if (r.future_reservation_count > 0) return 1;  // upcoming
        return 2; // past
      }
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      return (b.reservation_start_date || '').localeCompare(a.reservation_start_date || '');
    });

    let h = `<table class="gd-subtable"><thead><tr>
      <th style="width:70px">Unit</th>
      <th style="width:100px">Check-in</th>
      <th style="width:100px">Check-out</th>
      <th class="num" style="width:80px">Total Nights</th>
      <th class="num" style="width:80px">Nights So Far</th>
      <th style="width:90px">Type</th>
      <th style="width:80px">Status</th>
    </tr></thead><tbody>`;
    sorted.slice(0, 50).forEach(r => {
      const isCurr = r.current_reservation_count > 0;
      const isFut = r.future_reservation_count > 0;
      const badge = isCurr ? '<span class="gd-badge-curr">Active</span>' : isFut ? '<span class="gd-badge-future">Upcoming</span>' : '<span style="color:var(--muted);font-size:0.65rem">Past</span>';

      // Deinstall indicator for this unit
      const unitKey = String(r.unit_number || '');
      const isDI = diMap[unitKey];
      const diTag = isDI ? ' <span style="color:#EE533D;font-size:0.6rem;font-weight:700" title="Deinstalled ' + gEsc(isDI) + '">DI</span>' : '';

      // Total nights from reservation_length_raw, or compute from start/end
      let totalNights = r.reservation_length_raw;
      if (totalNights == null && r.reservation_start_date && r.reservation_end_date) {
        const start = new Date(r.reservation_start_date);
        const end = new Date(r.reservation_end_date);
        if (!isNaN(start) && !isNaN(end)) totalNights = Math.round((end - start) / 86400000);
      }
      const totalStr = totalNights != null ? totalNights.toLocaleString() : '--';
      const monthsStr = totalNights != null && totalNights >= 28 ? '<span style="color:var(--muted);font-size:0.6rem;margin-left:3px">(' + (totalNights / 30.4).toFixed(1) + 'mo)</span>' : '';

      // Elapsed nights
      const elapsed = r.days_in_reservation != null ? Math.max(0, r.days_in_reservation) : '--';

      // Reservation type
      const resType = r.reservation_length || '--';

      h += `<tr${isDI ? ' style="opacity:0.6"' : ''}>
        <td class="gd-unit">${gEsc(r.unit_number)}${diTag}</td>
        <td>${gEsc(r.reservation_start_date || '--')}</td>
        <td>${gEsc(r.reservation_end_date || '--')}</td>
        <td class="num" style="font-weight:700">${totalStr}${monthsStr}</td>
        <td class="num">${elapsed}</td>
        <td><span class="gd-badge-other">${gEsc(resType)}</span></td>
        <td>${badge}</td>
      </tr>`;
    });
    if (res.length > 50) h += `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:12px;font-size:0.72rem">Showing 50 of ${res.length} reservations</td></tr>`;
    h += '</tbody></table>';
    el.innerHTML = h;
}

function gridUpdateStats() {
  const d = gridFiltered;
  const units = d.reduce((s, r) => s + (r.home_count || 0), 0);
  const el = document.getElementById('grid-stats');

  if (gridPeriod === 'now') {
    const occupied = d.reduce((s, r) => s + (r.home_occupied_count || 0), 0);
    const available = units - occupied;
    const avgOcc = units > 0 ? occupied / units : null;
    el.innerHTML =
      `<span><span class="grid-stat-val">${d.length.toLocaleString()}</span>Properties</span>` +
      `<span><span class="grid-stat-val">${units.toLocaleString()}</span>Units</span>` +
      `<span><span class="grid-stat-val" style="color:var(--green)">${occupied.toLocaleString()}</span>Occupied</span>` +
      `<span><span class="grid-stat-val" style="color:#B95B00">${available.toLocaleString()}</span>Available</span>` +
      `<span><span class="grid-stat-val">${avgOcc != null ? gPct(avgOcc) : '--'}</span>Avg Occ.</span>`;
    return;
  }

  // Period mode — sum rollups across filtered properties
  const meta = PERIOD_META[gridPeriod] || { label: gridPeriod };
  let totalOccNights = 0, totalAvailNights = 0, totalRev = 0, totalRes = 0;
  for (const r of d) {
    totalOccNights  += r.period_occupied_nights  || 0;
    totalAvailNights += r.period_available_nights || 0;
    totalRev        += r.period_revenue         || 0;
    totalRes        += r.period_reservations    || 0;
  }
  const portfolioOcc = totalAvailNights > 0 ? totalOccNights / totalAvailNights : null;
  const portfolioAdr = totalOccNights > 0 ? totalRev / totalOccNights : null;
  const portfolioRevPerRes = totalRes > 0 ? totalRev / totalRes : null;
  const fmtMoney = v => v == null ? '--' : (v >= 1e6 ? '$' + (v/1e6).toFixed(2) + 'M' : v >= 1e3 ? '$' + Math.round(v/1e3) + 'k' : '$' + Math.round(v).toLocaleString());

  el.innerHTML =
    `<span><span class="grid-stat-val">${d.length.toLocaleString()}</span>Properties</span>` +
    `<span><span class="grid-stat-val">${units.toLocaleString()}</span>Units</span>` +
    `<span><span class="grid-stat-val">${portfolioOcc != null ? gPct(portfolioOcc) : '--'}</span>${gEsc(meta.label)} Occ.</span>` +
    `<span><span class="grid-stat-val">${totalRes.toLocaleString()}</span>Reservations</span>` +
    `<span><span class="grid-stat-val">${totalOccNights.toLocaleString()}</span>Occ. Nights</span>` +
    `<span><span class="grid-stat-val" style="color:var(--green)">${fmtMoney(totalRev)}</span>Revenue</span>` +
    `<span><span class="grid-stat-val">${portfolioAdr != null ? '$' + portfolioAdr.toFixed(0) : '--'}</span>ADR</span>` +
    `<span><span class="grid-stat-val">${portfolioRevPerRes != null ? fmtMoney(portfolioRevPerRes) : '--'}</span>Rev/Res</span>`;
}

// Prefetch grid data immediately — will be ready by the time user clicks Grid
loadGrid();

if (_isLocal) {
  switchMapGrid('grid');
  initMap().catch(() => {});
} else {
  initMap();
}

</script>
