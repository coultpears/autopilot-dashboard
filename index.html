<script>
// ─── CONFIG ───
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGbdrb1E8-Ctt4eSJ4A_fsth1CgTCw3zdD_cqVcGLAoQiMh2r_5mN5opRvlW0tYTO7aLvkz-IZm3XH/pub?output=csv';
const DEINSTALL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGbdrb1E8-Ctt4eSJ4A_fsth1CgTCw3zdD_cqVcGLAoQiMh2r_5mN5opRvlW0tYTO7aLvkz-IZm3XH/pub?gid=1480705445&single=true&output=csv';
const HS_PORTAL = '20754835';
const HS_DEALS_API = '/api/hubspot-deals';
const NOW = new Date();
const CUR_YEAR = NOW.getFullYear();
const PREV_YEAR = CUR_YEAR - 1;
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const QUARTER_NAMES = ['Q1','Q2','Q3','Q4'];

// ─── CSV PARSER ───
function parseCSV(text) {
  const lines = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i+1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === ',' && !inQuotes) {
      lines.push(current); current = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      lines.push(current); lines.push('%%ROW%%'); current = '';
    } else {
      current += ch;
    }
  }
  lines.push(current);

  const rows = [];
  let row = [];
  for (const cell of lines) {
    if (cell === '%%ROW%%') {
      if (row.length) rows.push(row);
      row = [];
    } else {
      row.push(cell.trim());
    }
  }
  if (row.length) rows.push(row);

  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] || '');
    return obj;
  });
}

// ─── NUMBER FORMAT ───
const fmt = (n) => Number(n).toLocaleString();

// ─── DATE HELPERS ───
function parseDate(s) {
  if (!s) return null;
  // Handle M/D/YYYY format
  const mdy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (mdy) {
    const d = new Date(parseInt(mdy[3]), parseInt(mdy[1]) - 1, parseInt(mdy[2]));
    return isNaN(d) ? null : d;
  }
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? null : d;
}

function getWeekNum(d) {
  const start = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - start) / 86400000 + start.getDay() + 1) / 7);
}

function getQuarter(d) { return Math.floor(d.getMonth() / 3); }

function addMonths(d, n) {
  const r = new Date(d);
  r.setMonth(r.getMonth() + n);
  return r;
}

function daysBetween(a, b) {
  return Math.floor((b - a) / 86400000);
}

function formatDate(d) {
  return `${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function extractFirstName(email) {
  if (!email || !email.includes('@')) {
    // Handle plain names like "Jack Thomasson"
    if (email && email.includes(' ')) return email.split(' ')[0];
    return email || '—';
  }
  // Two reps named Jack: jack.thomasson (central pod) → "Jack",
  // jack.harvey (NMHC lead) → "Jack H". Disambiguate so they don't merge.
  if (email.toLowerCase().startsWith('jack.harvey@')) return 'Jack H';
  const local = email.split('@')[0];
  const parts = local.split('.');
  return parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
}

// ─── RENDER ENGINE ───
// ─── DM SCOREBOARD BUILDER ───────────────────────────────────────────────
// Mirrors the Hub's Development-Manager activity view. Data is a fixture of the
// current Hub snapshot (exact figures) so the layout can be reviewed 1:1; swap
// DM[] for the live Hub/HubSpot feed to go live. Self-contained (own formatter).
// ─── DM SCOREBOARD — mirrors the Hub's "Pitches by rep" section ───────────
const DM_PODS = {
  xander: { name: "Xander's Pod", lead: 'Xander' },
  wells:  { name: "Wells's Pod",  lead: 'Wells' },
  jack:   { name: "Jack's Pod",   lead: 'Jack' },
  scout:  { name: "Scout's Pod",  lead: 'Scout' },
  g:      { name: "G's Pod",      lead: 'G' },
};
// Avatar colour + initials per DM (from the Hub roster).
const DM_ROSTER = {
  'Brady Lowery':{i:'BL',c:'#79872B'}, 'Dan Holden':{i:'DH',c:'#1A61D9'},
  'Cameron Copeland':{i:'CC',c:'#BA7517'}, 'Chandler Barrow':{i:'CB',c:'#156082'},
  'Renato Lagomarsino':{i:'RL',c:'#534AB7'}, 'Luke Schaller':{i:'LS',c:'#2E8B7A'},
  'Richard Baugh':{i:'RB',c:'#993C1D'}, 'Blake Barrow':{i:'BB',c:'#A33556'},
  'Raegan Harris':{i:'RH',c:'#0B7A66'}, 'Ben Prater':{i:'BP',c:'#6E5AA0'},
};

const dmNf = n => n == null ? '—' : Number(n).toLocaleString('en-US');
const dmPct = (v, g) => Math.max(0, Math.min(100, Math.round(((v || 0) / g) * 100)));
function dmDelta(cur, prev) {
  if (prev == null) return '';
  const d = (cur || 0) - prev;
  if (d === 0) return '<span class="dm-delta">±0</span>';
  return `<span class="dm-delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${dmNf(Math.abs(d))}</span>`;
}
const dmInitials = name => (DM_ROSTER[name] && DM_ROSTER[name].i) || name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const dmColor = name => (DM_ROSTER[name] && DM_ROSTER[name].c) || '#4B5563';

// ── Rep avatars (deterministic colour from the name) ──
const REP_PALETTE = ['#1A61D9','#156082','#534AB7','#0B7A66','#993C1D','#BA7517','#79872B','#A33556','#6E5AA0','#2E8B7A','#B4530A','#30618F'];
function repColor(name){ let h=0; for(let k=0;k<name.length;k++) h=(h*31+name.charCodeAt(k))>>>0; return REP_PALETTE[h % REP_PALETTE.length]; }
function repInitials(name){ const p=name.trim().split(/\s+/); return (p.length>=2 ? p[0][0]+p[1][0] : name.trim().slice(0,2)).toUpperCase(); }

// ── Comparison visual (Rep Scorecard). Two labeled bars — the current period
// and the prior period, scaled to the same max — so the reader literally sees
// one bar longer than the other. A coloured delta chip states the change.
function cmp(cur, prior, curLab, priorLab, scaleMax){
  const c = cur||0, p = prior||0, scale = Math.max(scaleMax||0, c, p, 1);
  const cw = Math.round(c/scale*100), pw = Math.round(p/scale*100);
  const diff = c - p;
  const dir = diff>0?'up':diff<0?'down':'flat';
  const glyph = diff>0?'▲':diff<0?'▼':'±';
  const delta = p===0
    ? (c>0 ? '<span class="cmp-d up">new this year</span>' : '<span class="cmp-d flat">no change</span>')
    : `<span class="cmp-d ${dir}">${glyph}${dmNf(Math.abs(diff))}</span><span class="cmp-f-t">${dmNf(p)} in ${priorLab}</span>`;
  return `<div class="cmp">
    <div class="cmp-r"><span class="cmp-k">${curLab}</span><div class="cmp-t"><div class="cmp-b cur" style="width:${cw}%"></div></div></div>
    <div class="cmp-r"><span class="cmp-k">${priorLab}</span><div class="cmp-t"><div class="cmp-b" style="width:${pw}%"></div></div></div>
    <div class="cmp-f">${delta}</div>
  </div>`;
}

// One DM row: avatar+name · Pitches/wk (goal 10) · Trailing 4 wks (goal 40) ·
// Avg/wk · Cad→Pitch. Mirrors the Hub's pitchCell / cell4 / ratePill.
function dmRow(d, i) {
  const G = 10, G4 = 40;
  const booked = d.booked > 0 ? `<span class="dm-booked">+${d.booked} booked</span>` : '';
  const avg = (d.trail4 || 0) / 4;
  const r = (d.trail4 || 0) / G4;
  const pillCls = r >= 0.8 ? 'hi' : r >= 0.5 ? 'mid' : 'lo';
  return `<tr class="dm-row" style="--i:${i}">
    <td><div class="dm-name-inner"><div class="dm-avatar" style="background:${dmColor(d.name)}">${dmInitials(d.name)}</div><div class="dm-name-txt">${d.name}</div></div></td>
    <td><div class="dm-metric">
      <div class="dm-mnum"><span class="pitchn">${dmNf(d.pitWk)}</span><span class="g">/ ${G}</span>${booked}</div>
      <div class="dm-bar"><div class="f" style="width:${dmPct(d.pitWk, G)}%"></div></div>
      <div class="dm-prev">PREV ${dmNf(d.pitWkPrev)} ${dmDelta(d.pitWk, d.pitWkPrev)}</div>
    </div></td>
    <td><div class="dm-metric">
      <div class="dm-mnum">${dmNf(d.trail4)}<span class="dm-pill ${pillCls}">${dmPct(d.trail4, G4)}%</span></div>
      <div class="dm-sub">${avg.toFixed(1)}/wk avg · goal ${G4}</div>
    </div></td>
    <td><div class="dm-metric">
      <div class="dm-mnum">${avg.toFixed(1)}</div>
      <div class="dm-sub">completed only</div>
    </div></td>
    <td><div class="dm-metric">
      <div class="dm-mnum">${d.cadPitch}%</div>
      <div class="dm-bar gold"><div class="f" style="width:${Math.min(100, d.cadPitch)}%"></div></div>
    </div></td>
  </tr>`;
}

// Group DMs by pod, order pods by total pitches this week, render bands + rows.
function dmScoreboardRows(dms) {
  const byPod = {};
  dms.forEach(d => { (byPod[d.pod] = byPod[d.pod] || []).push(d); });
  const podTotal = p => byPod[p].reduce((s, d) => s + (d.pitWk || 0), 0);
  const pods = Object.keys(byPod).sort((a, b) => podTotal(b) - podTotal(a));
  let html = '', i = 0;
  pods.forEach(pod => {
    const meta = DM_PODS[pod] || { name: pod || 'Unassigned', lead: '—' };
    html += `<tr class="dm-pod"><td colspan="5"><b>${meta.name.toUpperCase()}</b><span class="lead">pod lead ${meta.lead}</span></td></tr>`;
    byPod[pod].slice().sort((a, b) => (b.pitWk || 0) - (a.pitWk || 0)).forEach(d => { html += dmRow(d, i++); });
  });
  return html;
}

// Card shell — rows load async from the Hub.
function buildDmScoreboard() {
  return `<div class="scorecard dm-scoreboard">
    <div class="section-header scorecard-header">
      <div class="section-title scorecard-title">DM Scoreboard</div>
      <div class="scorecard-period">
        <span class="scorecard-period__main">Pitches by rep</span>
        <span class="scorecard-period__sep">·</span>
        <span class="scorecard-period__sub">this week · trailing 4 wks · paced to the 10/wk goal</span>
      </div>
    </div>
    <div class="table-wrap">
      <table class="dm-table">
        <thead><tr>
          <th class="dm-name-head">Development Manager</th>
          <th>Pitches / wk</th>
          <th>Trailing 4 wks</th>
          <th>Avg / wk</th>
          <th>Cad &rarr; Pitch</th>
        </tr></thead>
        <tbody id="dm-tbody"><tr><td colspan="5" class="dm-loading">Loading pitches from the Hub…</td></tr></tbody>
      </table>
    </div>
    <div class="dm-legend"><b>Pitches / wk</b> paced to a 10/wk goal (<span style="color:var(--landing-blue)">blue</span> = completed, <span style="color:var(--landing-blue)">+ booked</span> = scheduled). <b>Trailing 4 wks</b> = completed pitches over the last 28 days vs a 40 goal. <b>Cad &rarr; Pitch</b> = share of cadences that converted to a pitch.</div>
  </div>`;
}

// Fetch the live pitches feed (dashboard proxy → Hub /api/cadence) and fill the table.
async function loadDmScoreboard() {
  const tbody = document.getElementById('dm-tbody');
  if (!tbody) return;
  try {
    const r = await fetch('/api/dm-scoreboard');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const dms = data.dms || [];
    if (!dms.length) throw new Error('no DM data');
    tbody.innerHTML = dmScoreboardRows(dms);
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="dm-loading dm-error">Pitches feed unavailable — ${String((e && e.message) || e)}</td></tr>`;
  }
}

function render(deals, deinstalls, dealMap, pitchData) {
  const app = document.getElementById('app');

  // Helper: get HubSpot deal link for a property name
  // HS deal names use formats like "ric - sphere - 22" or "fd - tpa - the wayland - 39"
  const _hsCache = {};
  function hsDealLink(propertyName) {
    const key = (propertyName || '').trim().toLowerCase();
    if (_hsCache[key] !== undefined) return _hsCache[key];

    // Clean property name: remove (expansion), (phase X), etc
    const cleanName = key.replace(/\s*\(expansion\)|\s*\(phase \d+\)/gi, '').trim();

    // Direct match first
    if (dealMap[cleanName]) {
      _hsCache[key] = `https://app.hubspot.com/contacts/${HS_PORTAL}/deal/${dealMap[cleanName]}`;
      return _hsCache[key];
    }

    // Fuzzy: find HS deal names that contain the property name
    const stripped = cleanName.replace(/^the /, '');
    const candidates = [];
    for (const [hsName, dealId] of Object.entries(dealMap)) {
      // Exact substring match on full name or without "the"
      if (hsName.includes(cleanName) || hsName.includes(stripped)) {
        candidates.push({ hsName, dealId, score: 2 });
      }
    }

    // If no direct match, try matching significant words (3+ chars)
    if (!candidates.length) {
      const words = stripped.split(/\s+/).filter(w => w.length >= 3);
      if (words.length >= 1) {
        for (const [hsName, dealId] of Object.entries(dealMap)) {
          const matchCount = words.filter(w => hsName.includes(w)).length;
          // Require all significant words to match
          if (matchCount === words.length) {
            candidates.push({ hsName, dealId, score: 1 });
          }
        }
      }
    }

    if (candidates.length >= 1) {
      // Pick highest score, then shortest name (most specific)
      candidates.sort((a, b) => b.score - a.score || a.hsName.length - b.hsName.length);
      _hsCache[key] = `https://app.hubspot.com/contacts/${HS_PORTAL}/deal/${candidates[0].dealId}`;
    } else {
      _hsCache[key] = null;
    }
    return _hsCache[key];
  }

  // Parse deinstalls — each row is one unit
  const validDeinstalls = deinstalls.filter(d => {
    const dt = parseDate(d['Deinstall_Date'] || d['Requested Date']);
    return dt && !isNaN(dt);
  }).map(d => ({
    ...d,
    deinstallDate: parseDate(d['Deinstall_Date'] || d['Requested Date']),
    requestDate: parseDate(d['Requested Date']),
    property: d['Property Name'] || '—',
    market: d['Market'] || '—',
    partner: d['Partner'] || '—',
    rep: d['AP_Sales_Person'] || '',
    reason: d['Reason'] || d['Reason '] || '—'
  }));

  const curDeinstalls = validDeinstalls.filter(d => d.deinstallDate.getFullYear() === CUR_YEAR);
  const prevDeinstalls = validDeinstalls.filter(d => d.deinstallDate.getFullYear() === PREV_YEAR);

  // Filter deals with valid sign dates
  const validDeals = deals.filter(d => {
    const dt = parseDate(d['Contract Signed Date']);
    return dt && !isNaN(dt);
  }).map(d => ({
    ...d,
    signDate: parseDate(d['Contract Signed Date']),
    units: parseInt(d['Total Unit Count']) || 0,
    renewalDate: addMonths(parseDate(d['Contract Signed Date']), 12),
    rep: d['AP Sales Person'] || '',
    partner: d['Partner'] || '—',
    property: d['Property Name'] || '—',
    market: d['Market'] || '—'
  }));

  const curDeals = validDeals.filter(d => d.signDate.getFullYear() === CUR_YEAR);
  const prevDeals = validDeals.filter(d => d.signDate.getFullYear() === PREV_YEAR);

  // Current period boundaries
  const curMonth = NOW.getMonth();
  const curQuarter = getQuarter(NOW);
  const curWeek = getWeekNum(NOW);

  // YTD: up to current date equivalent
  const ytdCur = curDeals.filter(d => d.signDate <= NOW);
  const prevYtdEnd = new Date(PREV_YEAR, curMonth, NOW.getDate());
  const ytdPrev = prevDeals.filter(d => d.signDate <= prevYtdEnd);

  // Quarter — current side capped at today (<= NOW) so it's quarter-to-date,
  // matching qPrev which already caps at the equivalent prior-year date. Without
  // the cap, deals dated later in the quarter (data-entry quirk) would inflate it.
  const qCur = curDeals.filter(d => getQuarter(d.signDate) === curQuarter && d.signDate <= NOW);
  const qPrev = prevDeals.filter(d => getQuarter(d.signDate) === curQuarter && d.signDate <= new Date(PREV_YEAR, NOW.getMonth(), NOW.getDate()));

  // Month — current side capped at today (<= NOW) so "this month" is month-to-date.
  // Critical for the deinstall side below: rows are routinely entered with a
  // future Deinstall_Date (scheduled deinstalls). Counting those before they
  // happen understates Net Units This Month. mPrev already caps via getDate().
  const mCur = curDeals.filter(d => d.signDate.getMonth() === curMonth && d.signDate <= NOW);
  const mPrev = prevDeals.filter(d => d.signDate.getMonth() === curMonth && d.signDate.getDate() <= NOW.getDate());

  // Week
  const wCur = curDeals.filter(d => getWeekNum(d.signDate) === curWeek);
  const wPrev = prevDeals.filter(d => getWeekNum(d.signDate) === curWeek);

  const sum = (arr) => arr.reduce((s, d) => s + d.units, 0);

  // Last calendar month, through the same day-of-month as today (apples-to-apples
  // MTD vs this month). new Date(year, curMonth-1, 1) rolls Jan back to Dec of the
  // prior year automatically.
  const lmDate = new Date(CUR_YEAR, curMonth - 1, 1);
  const lmYear = lmDate.getFullYear(), lmMonth = lmDate.getMonth();
  const lmThroughDay = validDeals.filter(d => d.signDate.getFullYear() === lmYear && d.signDate.getMonth() === lmMonth && d.signDate.getDate() <= NOW.getDate());

  // Deinstall metrics (each row = 1 unit)
  const diYtdCur = curDeinstalls.filter(d => d.deinstallDate <= NOW);
  const diYtdPrev = prevDeinstalls.filter(d => d.deinstallDate <= prevYtdEnd);
  const diMonthCur = curDeinstalls.filter(d => d.deinstallDate.getMonth() === curMonth && d.deinstallDate <= NOW);
  const diMonthPrev = prevDeinstalls.filter(d => d.deinstallDate.getMonth() === curMonth && d.deinstallDate.getDate() <= NOW.getDate());
  const diQtrCur = curDeinstalls.filter(d => getQuarter(d.deinstallDate) === curQuarter);
  const diQtrPrev = prevDeinstalls.filter(d => getQuarter(d.deinstallDate) === curQuarter && d.deinstallDate <= new Date(PREV_YEAR, NOW.getMonth(), NOW.getDate()));

  // Net units = new installs - deinstalls
  const netUnitsYtd = sum(ytdCur) - diYtdCur.length;
  const netUnitsYtdPrev = sum(ytdPrev) - diYtdPrev.length;
  const netUnitsMonth = sum(mCur) - diMonthCur.length;
  const netUnitsMonthPrev = sum(mPrev) - diMonthPrev.length;

  function badge(cur, prev) {
    const diff = cur - prev;
    if (diff > 0) return `<span class="kpi-badge ahead"><svg viewBox="0 0 12 12"><path d="M6 2L10 8H2L6 2Z" fill="currentColor"/></svg>+${fmt(diff)} vs ${PREV_YEAR}</span>`;
    if (diff < 0) return `<span class="kpi-badge behind"><svg viewBox="0 0 12 12"><path d="M6 10L2 4H10L6 10Z" fill="currentColor"/></svg>${fmt(diff)} vs ${PREV_YEAR}</span>`;
    return `<span class="kpi-badge neutral">= ${PREV_YEAR}</span>`;
  }

  // Sparkline helper: returns HTML for 6-month mini bar chart
  function sparkline(monthlyValues) {
    const max = Math.max(...monthlyValues, 1);
    return `<div class="sparkline">${monthlyValues.map(v => `<div class="spark-bar" style="height:${Math.max((v/max)*100, 5)}%"></div>`).join('')}</div>`;
  }

  // Monthly data for sparklines (last 6 months with data)
  const sparkMonths = [];
  for (let m = Math.max(0, curMonth - 5); m <= curMonth; m++) {
    sparkMonths.push({
      // <= NOW cap is a no-op for past months (all their dates precede today)
      // and makes the current month's bar month-to-date instead of counting
      // future-dated rows (notably scheduled deinstalls).
      newUnits: curDeals.filter(d => d.signDate.getMonth() === m && d.signDate <= NOW).reduce((s,d) => s + d.units, 0),
      deals: curDeals.filter(d => d.signDate.getMonth() === m && d.signDate <= NOW).length,
      diUnits: curDeinstalls.filter(d => d.deinstallDate.getMonth() === m && d.deinstallDate <= NOW).length
    });
  }
  const sparkNet = sparkMonths.map(m => Math.max(m.newUnits - m.diUnits, 0));
  const sparkGross = sparkMonths.map(m => m.newUnits);
  const sparkDeals = sparkMonths.map(m => m.deals);
  const sparkDi = sparkMonths.map(m => m.diUnits);

  // Pitch metrics
  const pitchThisWeek = pitchData.byWeek?.thisWeek || 0;
  const pitchLastWeek = pitchData.byWeek?.lastWeek || 0;
  const pitchesByRep = pitchData.byRep || {};
  const monthlyPitchesByRep = pitchData.monthlyByRep || {};
  const ytdPitchesByRep = pitchData.ytdByRep || {};
  const lastWeekByRep = pitchData.lastWeekByRep || {};
  const lastMonthByRep = pitchData.lastMonthByRep || {};
  const pitchRepsSorted = Object.entries(pitchesByRep).sort((a, b) => b[1] - a[1]);
  // Week label: "Mon – [Today]"
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pitchWeekLabel = 'Mon – ' + dayNames[NOW.getDay()];
  const pitchMonthKey = CUR_YEAR + '-' + String(curMonth + 1).padStart(2, '0');
  const prevPitchMonthKey = PREV_YEAR + '-' + String(curMonth + 1).padStart(2, '0');
  // Last calendar month's pitch total (e.g., March if current is April)
  const lastMonthKey = curMonth === 0 ? (CUR_YEAR - 1) + '-12' : CUR_YEAR + '-' + String(curMonth).padStart(2, '0');
  const pitchLastMonth = pitchData.byMonth[lastMonthKey] || 0;
  const pitchThisMonth = pitchData.byMonth[pitchMonthKey] || 0;
  const pitchPrevMonth = pitchData.byMonth[prevPitchMonthKey] || 0;
  // YTD pitches
  let pitchYtdCur = 0, pitchYtdPrev = 0;
  Object.entries(pitchData.byMonth).forEach(([k, v]) => {
    if (k.startsWith(CUR_YEAR + '-') && parseInt(k.split('-')[1]) <= curMonth + 1) pitchYtdCur += v;
    if (k.startsWith(PREV_YEAR + '-') && parseInt(k.split('-')[1]) <= curMonth + 1) pitchYtdPrev += v;
  });
  // Spark for pitches (monthly)
  const sparkPitches = [];
  for (let m = Math.max(0, curMonth - 5); m <= curMonth; m++) {
    const mk = CUR_YEAR + '-' + String(m + 1).padStart(2, '0');
    sparkPitches.push(pitchData.byMonth[mk] || 0);
  }

  // Pitch category breakdowns (unique-company counts per window per category).
  // Backend keys: 'New Logo' | 'Expansion Existing' | 'Expansion New' | 'Other'
  const pitchCat = pitchData.byCategory || { thisWeek:{}, lastWeek:{}, thisMonth:{}, lastMonth:{} };
  const pitchRepCat = pitchData.byRepCategory || { thisWeek:{}, lastWeek:{}, thisMonth:{}, lastMonth:{} };
  const CAT_ORDER = ['New Logo', 'Expansion Existing', 'Expansion New', 'Other'];
  const CAT_SHORT = { 'New Logo': 'NL', 'Expansion Existing': 'EE', 'Expansion New': 'EN', 'Other': 'UT' };
  const CAT_LONG = { 'New Logo': 'New Logo', 'Expansion Existing': 'Expansion Existing', 'Expansion New': 'Expansion New', 'Other': 'Untagged' };
  function catBreakdownLine(catCounts) {
    const parts = CAT_ORDER.map(c => CAT_SHORT[c] + ' ' + (catCounts[c] || 0));
    return parts.join(' · ');
  }

  // Deal type breakdown
  const dealTypeMap = {};
  curDeals.forEach(d => {
    const dt = (d['Deal Type'] || '').trim() || 'Other';
    if (!dealTypeMap[dt]) dealTypeMap[dt] = { deals: 0, units: 0 };
    dealTypeMap[dt].deals++;
    dealTypeMap[dt].units += d.units;
  });
  const dealTypeColors = { 'New Partner': 'var(--green-light)', 'Partner Expansion': 'var(--blue-glow)', 'Property Expansion': 'var(--yellow)', 'Other': 'var(--silver)' };

  // Top partners by new units (installs)
  const partnerInstallMap = {};
  ytdCur.forEach(d => {
    const p = d.partner && d.partner !== '—' ? d.partner.trim() : null;
    if (!p) return;
    if (!partnerInstallMap[p]) partnerInstallMap[p] = 0;
    partnerInstallMap[p] += d.units;
  });
  const topPartners = Object.entries(partnerInstallMap).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const maxPartnerInstall = topPartners.length ? topPartners[0][1] : 1;

  // Renewals
  const renewals = validDeals.map(d => ({
    ...d,
    daysUntilRenewal: daysBetween(NOW, d.renewalDate)
  })).filter(d => d.daysUntilRenewal >= -30 && d.daysUntilRenewal <= 365)
    .sort((a, b) => a.renewalDate - b.renewalDate);

  const urgentRenewals = renewals.filter(d => d.daysUntilRenewal <= 30);
  const soonRenewals = renewals.filter(d => d.daysUntilRenewal > 30 && d.daysUntilRenewal <= 90);
  const upcomingRenewals = renewals.filter(d => d.daysUntilRenewal > 0 && d.daysUntilRenewal <= 180);

  // Monthly renewal sums (next 12 months)
  const renewalMonths = [];
  for (let i = 0; i < 12; i++) {
    const mStart = new Date(CUR_YEAR, curMonth + i, 1);
    const mEnd = new Date(CUR_YEAR, curMonth + i + 1, 0);
    const mRenewals = renewals.filter(d => d.renewalDate >= mStart && d.renewalDate <= mEnd);
    renewalMonths.push({
      label: MONTH_NAMES[mStart.getMonth()] + ' ' + String(mStart.getFullYear()).slice(2),
      units: sum(mRenewals),
      deals: mRenewals.length,
      isUrgent: i === 0,
      isSoon: i === 1 || i === 2
    });
  }
  const maxRenewalUnits = Math.max(...renewalMonths.map(m => m.units), 1);

  // Rep leaderboard (current year) — include all AP reps even if 0 deals
  const AP_REPS = ['Wells', 'Scout', 'Jack', 'Sophia', 'Ghislain', 'Jason', 'Richard', 'Nolan', 'Raegan', 'Xander', 'Renato', 'Jack H'];
  // Scorecard rows: the 7 territory pod leaders (5 geographic SDMs + NMHC leads
  // Nolan & Jack H), plus any EXTRA_REPS shown alongside them (Jason). Ref:
  // landing-territory-map DEFAULT_CONFIG.
  const POD_LEADER_SDMS = new Set(['Jack', 'Wells', 'Scout', 'Xander', 'Ghislain', 'Nolan', 'Jack H']);
  const EXTRA_REPS = ['Jason'];
  const POD_LEADERS = new Set([...POD_LEADER_SDMS, ...EXTRA_REPS]);
  // Former reps — explicitly excluded from scorecard even if they appear in
  // historical deal data or HubSpot owner records. Their deals still count
  // toward team YTD totals; they just don't get their own row.
  const FORMER_REPS = new Set(['John', 'Ashtyn']);
  const repMap = {};
  AP_REPS.forEach(name => { repMap[name] = { deals: 0, units: 0 }; });
  curDeals.forEach(d => {
    let name = extractFirstName(d.rep);
    if (name === '—' || !d.rep.includes('@')) return;
    // Normalize "Jasoncreel" to "Jason"
    if (name.toLowerCase() === 'jasoncreel') name = 'Jason';
    if (FORMER_REPS.has(name)) return;
    if (!repMap[name]) repMap[name] = { deals: 0, units: 0 };
    repMap[name].deals++;
    repMap[name].units += d.units;
  });
  const reps = Object.entries(repMap).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.units - a.units);

  // ─── REP SCORECARD DATA ───
  const repScorecard = {};
  const scInit = () => ({ ytdDeals: 0, ytdUnits: 0, monthDeals: 0, monthUnits: 0, ytdPitches: 0, monthPitches: 0, weekPitches: 0, lastWeekPitches: 0, lastMonthPitches: 0 });
  AP_REPS.forEach(name => { repScorecard[name] = scInit(); });
  curDeals.forEach(d => {
    let name = extractFirstName(d.rep);
    if (name === '—' || !d.rep.includes('@')) return;
    if (name.toLowerCase() === 'jasoncreel') name = 'Jason';
    if (FORMER_REPS.has(name)) return;
    if (!repScorecard[name]) repScorecard[name] = scInit();
    repScorecard[name].ytdDeals++;
    repScorecard[name].ytdUnits += d.units;
    if (d.signDate.getMonth() === curMonth && d.signDate <= NOW) {
      repScorecard[name].monthDeals++;
      repScorecard[name].monthUnits += d.units;
    }
  });
  Object.entries(ytdPitchesByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].ytdPitches = count;
  });
  Object.entries(monthlyPitchesByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].monthPitches = count;
    else { repScorecard[name] = scInit(); repScorecard[name].monthPitches = count; }
  });
  Object.entries(pitchesByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].weekPitches = count;
    else { repScorecard[name] = scInit(); repScorecard[name].weekPitches = count; }
  });
  Object.entries(lastWeekByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].lastWeekPitches = count;
  });
  Object.entries(lastMonthByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].lastMonthPitches = count;
  });
  // Filter former reps from the displayed scorecard rows (catches any reps added
  // through the per-column fallbacks above that didn't go through the explicit
  // FORMER_REPS check, e.g. legacy data shapes)
  // Only pod leaders are shown now that territories are pod-based.
  const scRows = Object.entries(repScorecard)
    .filter(([name]) => POD_LEADERS.has(name))
    .sort((a, b) => b[1].ytdUnits - a[1].ytdUnits);
  // Roster caption: count true pod leaders, list any extra reps shown alongside.
  const scSdmCount = scRows.filter(([n]) => POD_LEADER_SDMS.has(n)).length;
  const scExtras = scRows.filter(([n]) => !POD_LEADER_SDMS.has(n)).map(([n]) => n);
  const scRosterLabel = `${scSdmCount} pod leaders${scExtras.length ? ' + ' + scExtras.join(', ') : ''}`;

  // Per-column rankings for badge display (top 3 in each non-YTD metric)
  const colRanks = {};
  ['monthDeals','monthUnits'].forEach(col => {
    const sorted = scRows.slice().filter(r => r[1][col] > 0).sort((a, b) => b[1][col] - a[1][col]);
    colRanks[col] = {};
    let rank = 0, prevVal = -1;
    sorted.forEach((r, i) => {
      const val = r[1][col];
      if (val !== prevVal) rank = i + 1;
      if (rank <= 3) colRanks[col][r[0]] = rank;
      prevVal = val;
    });
  });
  function scBadge(name, col, val) {
    if (val === 0) return '<span class="sc-zero">&mdash;</span>';
    const rank = colRanks[col] && colRanks[col][name];
    if (!rank) return fmt(val);
    const colors = { 1: 'var(--blue-glow)', 2: 'var(--silver)', 3: 'var(--silver)' };
    return '<span style="position:relative">' + fmt(val) +
      '<span style="position:absolute;top:-8px;right:-10px;font-size:0.5rem;font-weight:700;color:' + colors[rank] + ';letter-spacing:0">#' + rank + '</span></span>';
  }

  // ─── BUILD HTML ───
  let html = '';

  // ─── HERO: Booked Units (gross) — YTD vs LY, and current month vs LY + LM ───
  // "Booked" = gross units on signed deals (no deinstall netting). Comparisons are
  // point-in-period: YTD through today's date, month through today's day-of-month.
  const grossYtd = sum(ytdCur), grossYtdPrev = sum(ytdPrev);
  const grossMonth = sum(mCur), grossMonthPrev = sum(mPrev), grossLM = sum(lmThroughDay);
  const shortMon = (m) => MONTH_NAMES[m].slice(0, 3);
  const cmpChip = (cur, prev, label) => {
    const diff = cur - prev;
    if (diff > 0) return `<span class="kpi-badge ahead"><svg viewBox="0 0 12 12"><path d="M6 2L10 8H2L6 2Z" fill="currentColor"/></svg>+${fmt(diff)} ${label}</span>`;
    if (diff < 0) return `<span class="kpi-badge behind"><svg viewBox="0 0 12 12"><path d="M6 10L2 4H10L6 10Z" fill="currentColor"/></svg>${fmt(diff)} ${label}</span>`;
    return `<span class="kpi-badge neutral">= ${label}</span>`;
  };
  html += `<div class="hero-strip">
      <div class="kpi-card hero green">
        <div class="hero-lead">
          <div class="kpi-label">Booked Units YTD</div>
          <div class="kpi-value">${fmt(grossYtd)}</div>
        </div>
        <div class="hero-meta">
          <div class="kpi-sub">gross · through ${MONTH_NAMES[curMonth]} ${NOW.getDate()}</div>
          ${cmpChip(grossYtd, grossYtdPrev, `vs ${PREV_YEAR} YTD`)}
        </div>
      </div>
      <div class="kpi-card hero blue">
        <div class="hero-lead">
          <div class="kpi-label">Booked Units · ${MONTH_NAMES[curMonth]}</div>
          <div class="kpi-value">${fmt(grossMonth)}</div>
        </div>
        <div class="hero-meta">
          <div class="kpi-sub">gross · month-to-date</div>
          <div class="kpi-chips">
            ${cmpChip(grossMonth, grossMonthPrev, `vs ${shortMon(curMonth)} '${String(PREV_YEAR).slice(2)}`)}
            ${cmpChip(grossMonth, grossLM, `vs ${shortMon(lmMonth)}`)}
          </div>
        </div>
      </div>
    </div>`;

  // Footer YoY caption (same period last year). Whole-team figures, matching the
  // team-wide pitch totals already shown in the footer.
  const yoyFoot = (cur, prev) => {
    if (!cur && !prev) return '<div class="sc-yoy-wrap"></div>';
    if (!prev) return '<div class="sc-yoy-wrap"><span class="sc-yoy flat">new</span></div>';
    const diff = cur - prev;
    if (diff === 0) return '<div class="sc-yoy-wrap"><span class="sc-yoy flat">±0</span></div>';
    const cls = diff > 0 ? 'up' : 'down';

    var prevRepYtd = {}, prevRepMonth = {}, prevRepLM = {};
    var addName = function(d) {
      var n = extractFirstName(d.rep);
      if (n === '—' || !d.rep.includes('@')) return null;
      if (n.toLowerCase() === 'jasoncreel') n = 'Jason';
      return n;
    };
    prevDeals.forEach(function(d) {
      var n = addName(d); if (!n) return;
      if (d.signDate <= prevYtdEnd) prevRepYtd[n] = (prevRepYtd[n] || 0) + d.units;
      if (d.signDate.getMonth() === curMonth && d.signDate.getDate() <= NOW.getDate()) prevRepMonth[n] = (prevRepMonth[n] || 0) + d.units;
    });
    lmThroughDay.forEach(function(d) {
      var n = addName(d); if (!n) return;
      prevRepLM[n] = (prevRepLM[n] || 0) + d.units;
    });
    // Scale each column to the leader across all reps (current + prior), so bars
    // read as a leaderboard — only the top rep is full, everyone else shows true
    // relative volume rather than every current-period bar pinning to 100%.
    var maxYtdAll = 1, maxMoAll = 1;
    scRows.forEach(function(row) {
      var nm = row[0], vv = row[1];
      maxYtdAll = Math.max(maxYtdAll, vv.ytdUnits, prevRepYtd[nm] || 0);
      maxMoAll = Math.max(maxMoAll, vv.monthUnits, prevRepLM[nm] || 0);
    });
    scTbody.innerHTML = scRows.map(function(row, i) {
      var name = row[0], v = row[1];
      var ytdBench = prevRepYtd[name] || 0, moBench = prevRepLM[name] || 0;
      return '<tr class="dm-row" style="--i:' + i + '">' +
        '<td><div class="dm-name-inner"><div class="dm-avatar" style="background:' + repColor(name) + '">' + repInitials(name) + '</div><div class="dm-name-txt">' + name + '</div></div></td>' +
        '<td><div class="dm-metric"><div class="dm-mnum">' + fmt(v.ytdUnits) + '</div>' + cmp(v.ytdUnits, ytdBench, '&rsquo;' + curYr2, '&rsquo;' + prevYr2, maxYtdAll) + '</div></td>' +
        '<td><div class="dm-metric"><div class="dm-mnum">' + fmt(v.monthUnits) + '</div>' + cmp(v.monthUnits, moBench, curMonShort, lmLabel, maxMoAll) + '</div></td>' +
      '</tr>';
    }).join('');
  }

  // Store data for chart rendering
  window._dashData = { curDeals, prevDeals, validDeals };
  setView('monthly');

  document.getElementById('last-updated').innerHTML = 'Updated ' + NOW.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '<span style="opacity:0.5;margin-left:6px">· Sources: New Deal Sheet + HubSpot AP Pipeline · Auto-refreshes every hour</span>';
}

// ─── CHART RENDERING ───
let currentView = 'monthly';
let currentMetric = 'deals';

function setView(view) {
  currentView = view;
  document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === view));
  renderChart();
}

function setMetric(metric) {
  currentMetric = metric;
  document.querySelectorAll('.metric-toggle .metric-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === metric));
  renderChart();
}

function renderChart() {
  const { curDeals, prevDeals } = window._dashData;
  const area = document.getElementById('chart-area');
  if (!area) return;

  const sum = (arr) => arr.reduce((s, d) => s + d.units, 0);
  const metric = currentMetric === 'units' ? (arr) => sum(arr) : (arr) => arr.length;

  let buckets = [];

  if (currentView === 'monthly') {
    for (let m = 0; m < 12; m++) {
      const cur = curDeals.filter(d => d.signDate.getMonth() === m);
      const prev = prevDeals.filter(d => d.signDate.getMonth() === m);
      // Only show months up to current month for current year
      const isFuture = m > NOW.getMonth();
      buckets.push({ label: MONTH_NAMES[m], cur: isFuture ? 0 : metric(cur), prev: metric(prev), isFuture });
    }
  } else if (currentView === 'quarterly') {
    for (let q = 0; q < 4; q++) {
      const cur = curDeals.filter(d => getQuarter(d.signDate) === q);
      const prev = prevDeals.filter(d => getQuarter(d.signDate) === q);
      const isFuture = q > getQuarter(NOW);
      buckets.push({ label: QUARTER_NAMES[q], cur: isFuture ? 0 : metric(cur), prev: metric(prev), isFuture });
    }
  } else if (currentView === 'weekly') {
    // Show last 12 weeks
    const curWeek = getWeekNum(NOW);
    for (let w = Math.max(1, curWeek - 11); w <= curWeek; w++) {
      const cur = curDeals.filter(d => getWeekNum(d.signDate) === w);
      const prev = prevDeals.filter(d => getWeekNum(d.signDate) === w);
      buckets.push({ label: `Wk ${w}`, cur: metric(cur), prev: metric(prev), isFuture: false });
    }
  }

  const maxVal = Math.max(...buckets.flatMap(b => [b.cur, b.prev]), 1);

  area.innerHTML = `<div class="chart-container">
    ${buckets.map(b => {
      const diff = b.cur - b.prev;
      const cls = b.isFuture ? 'neutral' : diff > 0 ? 'ahead' : diff < 0 ? 'behind' : 'neutral';
      const sign = diff > 0 ? '+' : '';
      return `<div class="chart-row">
        <div class="chart-label">${b.label}</div>
        <div class="chart-bars">
          <div class="bar-track"><div class="bar-fill current" style="width:${(b.cur / maxVal) * 100}%">${b.cur || ''}</div></div>
          <div class="bar-track"><div class="bar-fill previous" style="width:${(b.prev / maxVal) * 100}%">${b.prev || ''}</div></div>
        </div>
        <div class="chart-delta ${cls}">${b.isFuture ? '—' : (diff === 0 ? '=' : sign + diff)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

// ─── FETCH & BOOT ───
async function boot() {
  try {
    // Fetch sheets + HubSpot deal mapping in parallel
    const [resp, diResp, hsResp] = await Promise.all([
      fetch(SHEET_CSV),
      fetch(DEINSTALL_CSV),
      fetch(HS_DEALS_API).catch(() => null) // don't block on HS failure
    ]);
    if (!resp.ok) throw new Error(`Deals HTTP ${resp.status}`);
    if (!diResp.ok) throw new Error(`Deinstalls HTTP ${diResp.status}`);
    const [text, diText] = await Promise.all([resp.text(), diResp.text()]);
    const deals = parseCSV(text);
    const deinstalls = parseCSV(diText).filter(d => d['Property Name']);

    // Parse HubSpot data (graceful fallback if unavailable)
    let dealMap = {}, pitchData = { byWeek: {}, byMonth: {}, total: 0 };
    if (hsResp && hsResp.ok) {
      const hsData = await hsResp.json();
      dealMap = hsData.deals || {};
      pitchData = hsData.pitches || pitchData;
      console.log('HubSpot deals loaded:', hsData.count, 'Pitches:', pitchData.total);
    } else {
      console.log('HubSpot data unavailable');
    }

    console.log('Parsed deals:', deals.length, 'Deinstalls:', deinstalls.length);
    if (!deals.length) throw new Error('No data parsed');
    render(deals, deinstalls, dealMap, pitchData);
  } catch (err) {
    console.error(err);
    document.getElementById('app').innerHTML = `
      <div class="error-card">
        <h2>Unable to Load Data</h2>
        <p>The dashboard couldn't access the Google Sheet. This usually means the sheet isn't publicly shared.</p>
        <ol>
          <li>Open the <a href="https://docs.google.com/spreadsheets/d/1Mt_laFNgojNhNMHPYrlQo85dDywjWTF7W2YohR5M520/edit" target="_blank" style="color:var(--blue-glow)">New Deal Worksheet</a></li>
          <li>Click <strong>Share</strong> in the top right</li>
          <li>Under "General access," select <strong>Anyone with the link</strong></li>
          <li>Set permission to <strong>Viewer</strong></li>
          <li>Refresh this dashboard</li>
        </ol>
        <p style="margin-top:1rem;font-size:0.78rem;">Error: <code>${err.message}</code></p>
      </div>
    `;
  }
}

boot();

// Auto-refresh every 60 minutes for TV/monitor display
setInterval(() => location.reload(), 60 * 60 * 1000);
</script>
