<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autopilot Dashboard — Landing</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A61D9'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='20' fill='white'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* ─── Landing 2.0 brand ─── */
  --landing-navy: #15192D;
  --landing-tonal: #2D3654;
  --landing-blue: #1A61D9;
  --landing-baby: #E7EFFB;
  --landing-off: #F0F0F0;
  --landing-teal: #156082;

  /* ─── Surfaces (warm off-white ground) ─── */
  --surface-0: #FAFAF9;     /* app canvas */
  --surface-1: #FFFFFF;     /* cards */
  --surface-2: #F4F5F7;     /* subtle fill */
  --surface-3: #EBEDEF;     /* raised fill */

  /* ─── Ink ─── */
  --ink-0: #15192D;
  --ink-1: #2D3654;
  --ink-2: #52566B;
  --ink-3: #8A8D99;
  --ink-4: #B5B9C3;

  /* ─── Lines + shadows ─── */
  --line-0: rgba(21,25,45,0.06);
  --line-1: rgba(21,25,45,0.10);
  --line-2: rgba(21,25,45,0.16);
  --elev-1: 0 1px 2px rgba(21,25,45,0.04), 0 1px 3px rgba(21,25,45,0.03);
  --elev-2: 0 1px 2px rgba(21,25,45,0.05), 0 4px 12px rgba(21,25,45,0.05);
  --elev-3: 0 2px 4px rgba(21,25,45,0.06), 0 12px 28px rgba(21,25,45,0.08);

  /* ─── Typography ─── */
  --font-display: 'Instrument Sans', 'DM Sans', -apple-system, sans-serif;
  --font-body:    'DM Sans', 'Instrument Sans', -apple-system, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;

  /* ─── Scale ─── */
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-xl: 12px;

  /* ─── Legacy aliases (remapped to light theme — keeps existing selectors working) ─── */
  --navy: var(--surface-0);              /* body bg */
  --navy-mid: var(--surface-1);           /* card bg */
  --navy-light: var(--surface-2);         /* subtle fill */
  --tonal: var(--landing-tonal);
  --blue: var(--landing-blue);
  --blue-glow: var(--landing-blue);       /* was glowing — now solid */
  --baby-blue: var(--landing-baby);
  --green: #08786C;
  --green-light: #10B981;                 /* brighter for positive signals on light bg */
  --orange: #EE533D;
  --orange-light: #F56E58;
  --yellow: #F59E0B;
  --white: var(--ink-0);                  /* PRIMARY TEXT (was the name; now it's ink) */
  --silver: var(--ink-2);
  --ghost: var(--line-0);
  --ghost-hover: var(--line-1);
  --card-bg: var(--surface-1);
  --card-border: var(--line-1);
  --radius: var(--r-xl);
  --radius-sm: var(--r-md);
  --shadow: var(--elev-2);
}

html { font-size: 15px; }

body {
  font-family: var(--font-body);
  background: var(--surface-0);
  color: var(--ink-0);
  min-height: 100vh;
  overflow-x: hidden;
  font-feature-settings: "ss01", "ss02", "cv01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Universal tabular numbers on data elements */
.kpi-value, .chart-delta, .bar-fill, .dt-count, .renewal-stat-value,
.sc-bar, .spark-bar, .renewal-month-count, .units-badge,
.sc-rank, .kpi-badge {
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
}

/* ─── AMBIENT BACKGROUND (subtle warmth on the cream ground) ─── */
body::before {
  content: '';
  position: fixed;
  top: -40%; left: -20%;
  width: 80vw; height: 80vw;
  background: radial-gradient(ellipse, rgba(26,97,217,0.04) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -30%; right: -10%;
  width: 60vw; height: 60vw;
  background: radial-gradient(ellipse, rgba(21,96,130,0.03) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

/* ─── TOP NAV (3-column grid, centered primary nav) ─── */
.topnav {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface-1);
  border-bottom: 1px solid var(--line-1);
  padding: 0 1.75rem;
  height: 60px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}
.topnav::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--landing-blue) 50%, transparent 100%);
  opacity: 0.3;
}
.topnav-left {
  display: flex;
  align-items: center;
  gap: 14px;
  justify-self: start;
}
.topnav-nav { justify-self: center; }
.logo-mark {
  width: 30px; height: 30px;
  background: var(--landing-navy);
  border-radius: 6px;
  display: grid; place-items: center;
  position: relative;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  color: #fff;
  letter-spacing: -0.02em;
}
.logo-mark::after {
  content: ''; position: absolute; bottom: -1px; right: -1px;
  width: 8px; height: 8px; background: var(--landing-blue); border-radius: 0 0 6px 0;
}
.topnav h1 {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink-0);
  display: flex; align-items: baseline; gap: 10px;
}
.topnav h1 span {
  font-weight: 400;
  color: var(--ink-3);
  font-size: 0.78rem;
  padding-left: 10px;
  border-left: 1px solid var(--line-1);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.topnav-right {
  display: flex;
  align-items: center;
  gap: 14px;
  justify-self: end;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-weight: 500;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding-left: 20px;           /* Breathing room from centered nav */
  white-space: nowrap;
}
.topnav-right .nav-live {
  display: inline-flex; align-items: center; white-space: nowrap;
  padding-right: 14px; border-right: 1px solid var(--line-1);
}
.topnav-right .nav-live:last-child { border-right: none; padding-right: 0; }
.topnav-right .nav-updated {
  color: var(--ink-3); white-space: nowrap;
}
/* Map button — single-purpose link sitting to the right of the main toggle.
   Visually outlined so it reads as a secondary destination, not part of the
   primary Leaderboard/Partner-Performance toggle. */
.topnav-right .nav-map-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-display);
  font-size: 0.78rem; font-weight: 500;
  padding: 7px 14px; border-radius: var(--r-md);
  color: var(--ink-2); text-decoration: none;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  transition: all 0.15s;
  letter-spacing: -0.005em;
  margin-right: 14px;
  padding-right: 14px; /* override padding above so it's not pushed too far */
  white-space: nowrap;
}
.topnav-right .nav-map-btn svg { width: 13px; height: 13px; }
.topnav-right .nav-map-btn:hover {
  color: var(--ink-0);
  background: var(--surface-1);
  border-color: var(--ink-3);
}
.topnav-right .nav-map-btn.active {
  color: #fff;
  background: var(--landing-navy);
  border-color: var(--landing-navy);
  box-shadow: 0 1px 2px rgba(21,25,45,0.12);
}
/* Hide timestamp on tighter widths so nav stays clean */
@media (max-width: 1200px) {
  .topnav-right .nav-updated { display: none; }
}
/* Hide the long subtitle if the nav gets really squeezed */
@media (max-width: 1024px) {
  .topnav h1 span { display: none; }
}
@media (max-width: 880px) {
  .topnav-right .nav-live { display: none; }
}

/* ─── PRIMARY NAV (segmented control, matches map.html exactly) ─── */
.nav-links {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-lg);
  padding: 3px;
}
.nav-links a {
  font-family: var(--font-display);
  color: var(--ink-2); text-decoration: none;
  font-size: 0.78rem; font-weight: 500;
  padding: 7px 16px; border-radius: var(--r-md);
  transition: all 0.15s;
  letter-spacing: -0.005em;
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.nav-links a:hover { color: var(--ink-0); background: var(--surface-1); }
.nav-links a.active {
  color: #fff !important;
  background: var(--landing-navy);
  font-weight: 500;
  box-shadow: 0 1px 2px rgba(21,25,45,0.12);
}
.nav-links a svg { width: 13px; height: 13px; stroke-width: 2; }
.status-dot {
  width: 7px; height: 7px;
  background: var(--landing-teal);
  border-radius: 50%;
  display: inline-block;
  margin-right: 7px;
  animation: pulse-dot 2s ease infinite;
  box-shadow: 0 0 0 2px rgba(21,96,130,0.2);
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.1); }
}

/* ─── MAIN LAYOUT ─── */
.main {
  position: relative; z-index: 1;
  max-width: 1720px;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 3rem;
}

/* ─── KPI STRIP ─── */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.25rem;
}
.kpi-card {
  background: var(--surface-1);
  border: 1px solid var(--line-1);
  border-radius: var(--r-xl);
  padding: 1.35rem 1.5rem;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(10px);
  animation: card-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  box-shadow: var(--elev-1);
  transition: box-shadow 0.2s;
}
.kpi-card:hover { box-shadow: var(--elev-2); }
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 3px; height: 28px;
  background: var(--landing-blue);
  border-radius: 0 2px 2px 0;
}

/* Hero KPI cards — the big four up top */
.kpi-hero-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  margin-bottom: 0.75rem;
}
.kpi-card.hero {
  padding: 1.75rem 1.75rem 1.5rem;
  background: var(--surface-1);
  border: 1px solid var(--line-1);
}
.kpi-card.hero .kpi-value {
  font-family: var(--font-display);
  font-size: 2.6rem;
  font-weight: 600;
  letter-spacing: -0.035em;
  margin-bottom: 0.75rem;
  color: var(--ink-0);
  line-height: 1;
}
.kpi-card.hero .kpi-label {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  color: var(--ink-3);
}
.kpi-card.hero::before {
  width: 3px; height: 36px;
}
.kpi-card.hero.green::before  { background: #10B981; }
.kpi-card.hero.blue::before   { background: var(--landing-blue); }
.kpi-card.hero.orange::before { background: var(--landing-teal); }

/* Secondary KPI row */
.kpi-secondary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.75rem;
}
.kpi-secondary .kpi-card {
  padding: 1.1rem 1.25rem;
}
.kpi-secondary .kpi-card .kpi-value {
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
}
.kpi-secondary .kpi-card .kpi-label {
  font-size: 0.6rem;
  margin-bottom: 0.5rem;
}
.kpi-secondary .kpi-card::before {
  height: 22px;
}
.kpi-card:nth-child(1) { animation-delay: 0.05s; }
.kpi-card:nth-child(2) { animation-delay: 0.1s; }
.kpi-card:nth-child(3) { animation-delay: 0.15s; }
.kpi-card:nth-child(4) { animation-delay: 0.2s; }
.kpi-card:nth-child(5) { animation-delay: 0.25s; }
.kpi-card:nth-child(6) { animation-delay: 0.3s; }

@keyframes card-in {
  to { opacity: 1; transform: translateY(0); }
}

.kpi-label {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  font-weight: 500;
  margin-bottom: 0.6rem;
}
.kpi-value {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1;
  margin-bottom: 0.6rem;
  color: var(--ink-0);
}
.kpi-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: var(--r-sm);
  margin-top: 2px;
  letter-spacing: -0.005em;
}
.kpi-badge.ahead {
  background: rgba(16,185,129,0.10);
  color: #0F8A5F;
}
.kpi-badge.behind {
  background: rgba(238,83,61,0.10);
  color: #C8472F;
}
.kpi-badge.neutral {
  background: var(--surface-3);
  color: var(--ink-2);
}
.kpi-badge svg { width: 11px; height: 11px; }

/* ─── SECTION PANELS ─── */
.section {
  background: var(--surface-1);
  border: 1px solid var(--line-1);
  border-radius: var(--r-xl);
  padding: 1.5rem 1.75rem;
  margin-bottom: 1.25rem;
  opacity: 0;
  transform: translateY(10px);
  animation: card-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  animation-delay: 0.3s;
  box-shadow: var(--elev-1);
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
  gap: 0.75rem;
  padding-bottom: 0.875rem;
  border-bottom: 1px solid var(--line-0);
}
.section-title {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--ink-0);
  display: flex; align-items: baseline; gap: 8px;
}
.section-title small {
  font-family: var(--font-mono);
  font-weight: 400;
  color: var(--ink-3);
  font-size: 0.66rem;
  margin-left: 4px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

/* ─── TABS ─── */
.tabs {
  display: flex;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  padding: 3px;
}
.tab-btn {
  font-family: var(--font-display);
  font-size: 0.76rem;
  font-weight: 500;
  padding: 6px 14px;
  border: none;
  background: transparent;
  color: var(--ink-2);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: -0.005em;
}
.tab-btn:hover { color: var(--ink-0); }
.tab-btn.active {
  background: var(--landing-navy);
  color: #fff;
  font-weight: 500;
}

/* ─── METRIC TOGGLE ─── */
.metric-toggle {
  display: flex;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  padding: 3px;
}
.metric-btn {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-weight: 500;
  padding: 4px 10px;
  border: none;
  background: transparent;
  color: var(--ink-3);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.metric-btn:hover { color: var(--ink-0); }
.metric-btn.active {
  background: var(--landing-navy);
  color: #fff;
}

/* ─── BAR CHART ─── */
.chart-container {
  margin-top: 0.75rem;
}
.chart-row {
  display: grid;
  grid-template-columns: minmax(100px, auto) 1fr 64px;
  align-items: center;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-0);
}
.chart-row:last-child { border-bottom: none; }
.chart-label {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-2);
  font-weight: 500;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.chart-bars {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.bar-track {
  height: 14px;
  background: var(--surface-3);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 500;
  color: rgba(255,255,255,0.95);
  min-width: 0;
}
.bar-fill.current { background: var(--landing-blue); }
.bar-fill.previous { background: var(--ink-4); opacity: 0.7; }

.chart-delta {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  font-weight: 500;
  text-align: right;
  letter-spacing: -0.005em;
}
.chart-delta.ahead   { color: #0F8A5F; }
.chart-delta.behind  { color: #C8472F; }
.chart-delta.neutral { color: var(--ink-3); }

.chart-legend {
  display: flex;
  gap: 1.25rem;
  margin-top: 1rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line-0);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
}
.legend-dot.current { background: var(--landing-blue); }
.legend-dot.previous { background: var(--ink-4); opacity: 0.7; }

/* ─── RENEWAL CARDS ─── */
.renewal-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.25rem;
}
.renewal-stat {
  background: var(--surface-2);
  border: 1px solid var(--line-0);
  border-radius: var(--r-md);
  padding: 1rem 1.125rem;
  text-align: left;
  position: relative;
  overflow: hidden;
}
.renewal-stat::before {
  content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 20px;
  background: var(--ink-4); border-radius: 0 2px 2px 0;
}
.renewal-stat.urgent::before { background: var(--orange-light); }
.renewal-stat.soon::before { background: var(--yellow); }
.renewal-stat.upcoming::before { background: var(--landing-blue); }
.renewal-stat-value {
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink-0);
}
.renewal-stat-label {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 500;
  margin-top: 2px;
}
.renewal-stat.urgent .renewal-stat-value { color: #C8472F; }
.renewal-stat.soon .renewal-stat-value { color: #B95B00; }
.renewal-stat.upcoming .renewal-stat-value { color: var(--landing-blue); }

/* ─── RENEWAL MONTHLY BAR ─── */
.renewal-months {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  height: 120px;
  padding: 0 4px;
  margin-bottom: 1.5rem;
}
.renewal-month-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  height: 100%;
  justify-content: flex-end;
}
.renewal-month-bar {
  width: 100%;
  background: var(--landing-blue);
  border-radius: 3px 3px 1px 1px;
  min-height: 2px;
  transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
  opacity: 0.75;
}
.renewal-month-bar.has-urgent { background: var(--landing-teal); opacity: 1; }
.renewal-month-bar.has-soon { background: var(--landing-blue); opacity: 1; }
.renewal-month-count {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--ink-0);
  font-variant-numeric: tabular-nums;
}
.renewal-month-label {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  writing-mode: horizontal-tb;
  font-weight: 500;
}

/* ─── TABLE ─── */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--r-md);
  border: 1px solid var(--line-1);
  background: var(--surface-1);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}
thead th {
  background: var(--surface-2);
  padding: 10px 14px;
  text-align: left;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  font-weight: 500;
  white-space: nowrap;
  border-bottom: 1px solid var(--line-1);
}
tbody tr {
  border-bottom: 1px solid var(--line-0);
  transition: background 0.15s;
}
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child { border-bottom: none; }
tbody td {
  padding: 10px 14px;
  white-space: nowrap;
  color: var(--ink-1);
}
.urgency-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 8px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.9);
}
.urgency-dot.urgent { background: #EE533D; }
.urgency-dot.soon { background: #F59E0B; }
.urgency-dot.normal { background: var(--ink-4); }

.units-badge {
  background: var(--surface-3);
  color: var(--ink-1);
  padding: 2px 10px;
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 0.72rem;
  letter-spacing: -0.005em;
}

/* ─── TWO COL LAYOUT ─── */
.two-col {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 1.25rem;
}

/* ─── REP LEADERBOARD ─── */
.rep-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-0);
}
.rep-row:last-child { border-bottom: none; }
.rep-rank {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink-3);
  width: 24px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.rep-rank.gold, .rep-rank.silver, .rep-rank.bronze { color: var(--ink-0); font-weight: 600; }
.rep-avatar {
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  background: var(--landing-navy);
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 0.74rem;
  color: #fff;
  letter-spacing: 0.02em;
}
.rep-info { flex: 1; }
.rep-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.84rem;
  color: var(--ink-0);
  letter-spacing: -0.005em;
}
.rep-deals {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 2px;
}
.rep-units {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
  color: var(--ink-0);
  letter-spacing: -0.015em;
  font-variant-numeric: tabular-nums;
}
.rep-units small {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--ink-3);
  font-weight: 500;
  margin-left: 3px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ─── LOADING ─── */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 1.5rem;
}
.loader {
  width: 36px; height: 36px;
  border: 2px solid var(--line-0);
  border-top-color: var(--landing-blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-weight: 500;
}

/* ─── ERROR STATE ─── */
.error-card {
  background: var(--surface-1);
  border: 1px solid rgba(238,83,61,0.25);
  border-radius: var(--r-xl);
  padding: 2.5rem;
  text-align: center;
  max-width: 560px;
  margin: 4rem auto;
  box-shadow: var(--elev-1);
}
/* ─── SPARKLINE ─── */
.sparkline {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 20px;
  margin-top: 8px;
  opacity: 0.32;
}
.spark-bar {
  flex: 1;
  background: var(--ink-0);
  border-radius: 1px;
  min-height: 2px;
}
.kpi-card.hero.green .spark-bar  { background: #10B981; }
.kpi-card.hero.orange .spark-bar { background: var(--landing-teal); }
.kpi-card.hero.blue .spark-bar   { background: var(--landing-blue); }

/* ─── DEAL TYPE PILLS ─── */
.deal-type-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.deal-type-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface-2);
  border: 1px solid var(--line-0);
  border-radius: var(--r-sm);
  padding: 5px 11px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-1);
  font-weight: 500;
}
.deal-type-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
}
.deal-type-pill .dt-count {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--ink-0);
  letter-spacing: -0.01em;
}

/* ─── SECTION LABEL DIVIDER ─── */
.section-divider {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  font-weight: 500;
  margin: 0.5rem 0 0.75rem;
}

/* ─── REP SCORECARD ─── Quiet modern dashboard. Linear/Vercel feel.
   ONE font family (DM Sans) end-to-end.
   ONE size scale: 11px labels, 14px data, 22px Σ + tfoot.
   NO zebra, NO column rules, NO inset shadows. Pure white rows separated by a
   single hairline rule. Hierarchy comes from size + weight + color only.
   The Σ column is the heaviest element on each row — that's how it reads. */
.scorecard {
  position: relative;
  background: var(--surface-1);
  border: 1px solid var(--line-1);
  border-radius: var(--r-xl);
  padding: 1.75rem 2rem 1.5rem;
  margin-bottom: 1.25rem;
  opacity: 0;
  transform: translateY(10px);
  animation: card-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  animation-delay: 0.3s;
  box-shadow: var(--elev-1);
  overflow: hidden;
}
/* Subtle tonal wash at the top edge of the card — like the slight color wash
   at the masthead of a printed page. 2% landing-blue fading to transparent over
   80px. Adds atmosphere without being a "gradient design." */
.scorecard::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 80px;
  background: linear-gradient(180deg, rgba(26,97,217,0.025) 0%, rgba(26,97,217,0) 100%);
  pointer-events: none;
  border-radius: var(--r-xl) var(--r-xl) 0 0;
}
.scorecard > * { position: relative; }

/* Section header refinement — title gets a short 2px landing-blue underline
   anchor mark. Period chip sits opposite at the right. */
.scorecard-header { align-items: flex-end; }
.scorecard-title { position: relative; padding-bottom: 6px; }
.scorecard-title::after {
  content: '';
  position: absolute;
  left: 0; bottom: 0;
  width: 28px; height: 2px;
  background: var(--landing-blue);
  border-radius: 1px;
}
.scorecard-period {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 5px 12px 6px;
  background: var(--surface-2);
  border: 1px solid var(--line-0);
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 0.7rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.scorecard-period__main {
  color: var(--landing-navy);
  font-weight: 700;
  letter-spacing: 0.005em;
}
.scorecard-period__sep {
  color: var(--ink-4);
  font-weight: 400;
}
.scorecard-period__sub {
  color: var(--ink-3);
  font-weight: 500;
}
.scorecard-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-body);     /* DM Sans — applies to EVERYTHING in the table */
  font-variant-numeric: tabular-nums;
}

/* ─── HEADER ─── one size (11px), tight letter-spacing, uppercase.
   Bottom-aligned so labels sit just above the body, like column headers
   should. Differentiate tiers through weight + color, not size. */
.scorecard-table thead th {
  background: transparent;
  padding: 6px 12px;
  text-align: center;
  font-family: var(--font-body);
  font-size: 0.69rem;          /* 11px @ default 16px root */
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  font-weight: 500;
  white-space: nowrap;
  vertical-align: bottom;
}
/* Group labels (row 1) — bumped to read as section titles, not just labels.
   12px / 700 weight / tighter tracking gives them authority over sub-rows. */
.scorecard-table thead tr.col-groups th {
  font-size: 0.75rem;          /* 12px */
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--ink-2);
  padding-top: 14px;
  padding-bottom: 8px;
  border-bottom: none;
}
.scorecard-table thead tr.col-groups th.cg-ytd   { color: var(--landing-blue); }
.scorecard-table thead tr.col-groups th.cg-month { color: var(--landing-teal); }
.scorecard-table thead tr.col-groups th.cg-pitch { color: var(--landing-tonal); }
.scorecard-table thead tr.subgroup th {
  font-weight: 600;
  color: var(--ink-1);
  padding: 6px 12px;
}
.scorecard-table thead tr.subgroup th.cg-expansion {
  font-weight: 500;
  color: var(--ink-2);
}
.scorecard-table thead tr.subgroup th.sigma-head {
  font-weight: 700;
  color: var(--landing-navy);
}
.scorecard-table thead tr.col-leaf th {
  padding-top: 4px;
  padding-bottom: 14px;
  font-weight: 500;
  color: var(--ink-3);
  border-bottom: 1px solid var(--line-1);
}
.scorecard-table thead tr.col-groups th.rep-head,
.scorecard-table thead tr.col-groups th[rowspan="3"] {
  text-align: left;
  width: 160px;
  padding-left: 16px;
  vertical-align: bottom;
  padding-bottom: 14px;
  font-family: var(--font-body);
  font-size: 0.69rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  border-bottom: 1px solid var(--line-1);
}

/* ─── BODY ─── no zebra. Single hairline rule between rows. Generous padding.
   Each row reads as one calm horizontal band. */
.scorecard-table tbody tr {
  transition: background-color 0.12s;
}
.scorecard-table tbody tr td {
  background: var(--surface-1);
  border-bottom: 1px solid var(--line-0);
}
.scorecard-table tbody tr:hover td {
  background: var(--surface-2);
}
.scorecard-table tbody td {
  padding: 16px 12px;
  text-align: center;
  font-family: var(--font-body);
  font-size: 0.875rem;            /* 14px */
  font-weight: 500;
  color: var(--ink-1);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.005em;
}

/* Top-3 rows: bolder name + ink-0. No background, no inset shadow.
   The rank pill itself (already navy/blue-filled) is the only visual cue. */
.scorecard-table tbody tr.sc-top td:first-child {
  color: var(--ink-0);
  font-weight: 700;
}

/* Rep name cell — same family as everything else, just heavier weight.
   No display font, no border-right. Quiet. */
.scorecard-table tbody td:first-child {
  text-align: left;
  font-size: 0.94rem;
  font-weight: 600;
  color: var(--ink-0);
  letter-spacing: -0.01em;
  padding-left: 16px;
}

/* Detail data (New Logo, Exp-New, Exp-Existing) — slightly lighter to recede,
   letting the Σ column dominate the row */
.scorecard-table tbody td.pitch-newlogo,
.scorecard-table tbody td.pitch-exp {
  color: var(--ink-2);
}
.scorecard-table tbody tr.sc-top td.pitch-newlogo,
.scorecard-table tbody tr.sc-top td.pitch-exp {
  color: var(--ink-1);
}

/* ─── Σ COLUMN ─── the headline number per row. Bumped to 24px in
   --landing-navy (max ink). Top-3 rows shift to landing-blue weight 800 —
   the single visual cue for "leader". */
.scorecard-table tbody td.pitch-sigma {
  font-size: 1.5rem;             /* 24px */
  font-weight: 700;
  color: var(--landing-navy);
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
}
.scorecard-table tbody tr.sc-top td.pitch-sigma {
  color: var(--landing-blue);
  font-weight: 800;
}

/* Σ delta caption — small + quiet, just signals direction */
.scorecard-table .pitch-delta {
  font-family: var(--font-body);
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0;
  margin-top: 4px;
  line-height: 1;
  opacity: 0.85;
  font-variant-numeric: tabular-nums;
  min-height: 0.68rem;
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
}
/* Directional glyph (▲/▼) before delta number. Smaller than the digits so it
   reads as a marker, not a competing element. Inherits the same green/orange
   color via currentColor. */
.scorecard-table .pitch-delta__glyph {
  font-size: 0.56rem;
  line-height: 1;
  opacity: 0.85;
  letter-spacing: 0;
  transform: translateY(-0.5px);
}

/* ─── FOOTER (Team Total) ─── anchored by a 2px landing-blue top rule.
   The Σ totals here are the biggest, heaviest numbers on the entire table —
   the "destination" the eye lands on. */
.scorecard-table tfoot td {
  padding: 22px 12px 18px;
  text-align: center;
  font-family: var(--font-body);
  font-size: 1.075rem;            /* 17.2px */
  font-weight: 700;
  color: var(--ink-0);
  border-top: 2px solid var(--landing-blue);
  background: transparent;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.scorecard-table tfoot td:first-child {
  text-align: left;
  font-family: var(--font-body);
  text-transform: uppercase;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: var(--ink-2);
  font-weight: 700;
  padding-left: 16px;
}
.scorecard-table tfoot td.pitch-sigma {
  font-size: 1.75rem;            /* 28px — biggest number on the page */
  font-weight: 800;
  color: var(--landing-blue);
  letter-spacing: -0.025em;
}
/* ─── RANK PILL ─── compact circle. Top-3 = landing-blue fill (the single
   visual signal that distinguishes leaders from the rest). */
.sc-rank {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 600;
  margin-right: 12px;
  background: var(--surface-3);
  color: var(--ink-3);
  vertical-align: middle;
  letter-spacing: 0;
}
.sc-rank.top {
  background: var(--landing-blue);
  color: #fff;
  font-weight: 700;
}
/* Tonal staircase across top-3 — solid blue for #1, slightly desaturated for
   #2 and #3. Reads like gold/silver/bronze without going literal. */
.sc-rank.top.rank-2 { background: rgba(26, 97, 217, 0.78); }
.sc-rank.top.rank-3 { background: rgba(26, 97, 217, 0.58); }
.sc-highlight { color: var(--landing-blue) !important; }

/* Column dividers — subtle hairline between metric groups */
.scorecard-table .col-div {
  border-left: 1px solid var(--line-0) !important;
}
.scorecard-table .exp-band-first {
  border-left: 1px dotted var(--line-1);
}

/* Zero placeholder — em-dash, very faded so the eye skips past it */
.sc-zero {
  opacity: 0.25;
  font-weight: 400;
  color: var(--ink-3);
}

/* ─── LEGEND ─── editorial footnote style. Italic serif lead-in, mono key. */
.scorecard-legend {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 16px 14px 4px;
  margin-top: 4px;
  border-top: 1px solid var(--line-0);
}
.scorecard-legend .legend-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  align-items: baseline;
}
.scorecard-legend .legend-item {
  font-family: var(--font-body);
  font-size: 0.72rem;
  color: var(--ink-2);
  display: inline-flex;
  align-items: baseline;
  line-height: 1.4;
}
.scorecard-legend .legend-key {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--landing-navy);
  margin-right: 8px;
  padding-bottom: 1px;
  border-bottom: 1px solid var(--landing-navy);
  line-height: 1;
}
.scorecard-legend .legend-note {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 0.7rem;
  color: var(--ink-3);
  line-height: 1.55;
  margin: 0;
  letter-spacing: 0;
}

/* ─── PROGRESS BAR on YTD Units cell ─── slimmer, lower, less visual noise */
.sc-bar-cell { position: relative; }
.sc-bar {
  position: absolute;
  left: 9px; right: 9px; bottom: 4px;
  height: 1px;
  background: var(--line-0);
  overflow: hidden;
}
.sc-bar-fill {
  height: 100%;
  background: var(--landing-blue);
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Avatar removed — in this quieter aesthetic the rank pill alone signals
   identity + leadership status. Keep .sc-avatar as display:none so existing
   markup doesn't break but no visual noise. */
.sc-avatar { display: none; }

/* #1 / #2 / #3 ranks all use the same landing-blue pill — distinguish by
   numeral position alone. No need for a separate "first" treatment. */
.sc-rank.top.first { background: var(--landing-blue); }

/* TV-optimized: larger text at wide viewports. Each tier scales Σ
   proportionally so it stays ~1.6× the size of peer body cells and keeps
   its color (landing-navy body, landing-blue top-3 + footer). */
@media (min-width: 1600px) {
  .command-center { grid-template-columns: 320px 1fr !important; }
  .scorecard-table tbody td { font-size: 1.2rem; padding: 14px 18px; }
  .scorecard-table tbody td:first-child { font-size: 1.05rem; }
  .scorecard-table thead th { font-size: 0.78rem; padding: 14px 18px; }
  .scorecard-table thead tr.col-groups th { font-size: 0.9rem; }
  .scorecard-table tfoot td { font-size: 1.2rem; padding: 14px 18px; }
  .scorecard-table tbody td.pitch-sigma { font-size: 1.85rem; }
  .scorecard-table tfoot td.pitch-sigma { font-size: 2.05rem; }
}
@media (min-width: 2400px) {
  .command-center { grid-template-columns: 380px 1fr !important; gap: 2rem !important; }
  .scorecard-table tbody td { font-size: 1.5rem; padding: 18px 24px; }
  .scorecard-table tbody td:first-child { font-size: 1.25rem; }
  .scorecard-table thead th { font-size: 0.88rem; padding: 16px 24px; }
  .scorecard-table thead tr.col-groups th { font-size: 1.05rem; padding: 14px 24px 4px; }
  .scorecard-table tfoot td { font-size: 1.5rem; }
  .main { padding: 2rem 3rem 4rem; }
  .scorecard-table tbody td.pitch-sigma { font-size: 2.3rem; }
  .scorecard-table tfoot td.pitch-sigma { font-size: 2.55rem; }
}
@media (min-width: 3200px) {
  .command-center { grid-template-columns: 440px 1fr !important; }
  .scorecard-table tbody td { font-size: 1.8rem; padding: 22px 28px; }
  .scorecard-table tbody td:first-child { font-size: 1.4rem; }
  .scorecard-table thead th { font-size: 1rem; padding: 20px 28px; }
  .scorecard-table thead tr.col-groups th { font-size: 1.2rem; padding: 16px 28px 6px; }
  .scorecard-table tfoot td { font-size: 1.8rem; }
  .topnav { height: 80px; }
  .topnav h1 { font-size: 1.5rem; }
  .scorecard-table tbody td.pitch-sigma { font-size: 2.75rem; }
  .scorecard-table tfoot td.pitch-sigma { font-size: 3.05rem; }
}

.error-card h2 {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin-bottom: 0.75rem;
  color: var(--error);
}
.error-card p {
  color: var(--ink-2);
  font-size: 0.88rem;
  line-height: 1.6;
  margin-bottom: 1rem;
}
.error-card code {
  background: var(--surface-2);
  color: var(--ink-0);
  padding: 2px 8px;
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
.error-card ol {
  text-align: left;

    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i+1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === ',' && !inQuotes) {
      lines.push(current); current = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      lines.push(current); lines.push('%%ROW%%'); current = '';
    } else {
      current += ch;
    }
  }
  lines.push(current);

  const rows = [];
  let row = [];
  for (const cell of lines) {
    if (cell === '%%ROW%%') {
      if (row.length) rows.push(row);
      row = [];
    } else {
      row.push(cell.trim());
    }
  }
  if (row.length) rows.push(row);

  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r[i] || '');
    return obj;
  });
}

// ─── NUMBER FORMAT ───
const fmt = (n) => Number(n).toLocaleString();

// ─── DATE HELPERS ───
function parseDate(s) {
  if (!s) return null;
  // Handle M/D/YYYY format
  const mdy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (mdy) {
    const d = new Date(parseInt(mdy[3]), parseInt(mdy[1]) - 1, parseInt(mdy[2]));
    return isNaN(d) ? null : d;
  }
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? null : d;
}

function getWeekNum(d) {
  const start = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - start) / 86400000 + start.getDay() + 1) / 7);
}

function getQuarter(d) { return Math.floor(d.getMonth() / 3); }

function addMonths(d, n) {
  const r = new Date(d);
  r.setMonth(r.getMonth() + n);
  return r;
}

function daysBetween(a, b) {
  return Math.floor((b - a) / 86400000);
}

function formatDate(d) {
  return `${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function extractFirstName(email) {
  if (!email || !email.includes('@')) {
    // Handle plain names like "Jack Thomasson"
    if (email && email.includes(' ')) return email.split(' ')[0];
    return email || '—';
  }
  const local = email.split('@')[0];
  const parts = local.split('.');
  return parts[0].charAt(0).toUpperCase() + parts[0].slice(1);
}

// ─── RENDER ENGINE ───
function render(deals, deinstalls, dealMap, pitchData) {
  const app = document.getElementById('app');

  // Helper: get HubSpot deal link for a property name
  // HS deal names use formats like "ric - sphere - 22" or "fd - tpa - the wayland - 39"
  const _hsCache = {};
  function hsDealLink(propertyName) {
    const key = (propertyName || '').trim().toLowerCase();
    if (_hsCache[key] !== undefined) return _hsCache[key];

    // Clean property name: remove (expansion), (phase X), etc
    const cleanName = key.replace(/\s*\(expansion\)|\s*\(phase \d+\)/gi, '').trim();

    // Direct match first
    if (dealMap[cleanName]) {
      _hsCache[key] = `https://app.hubspot.com/contacts/${HS_PORTAL}/deal/${dealMap[cleanName]}`;
      return _hsCache[key];
    }

    // Fuzzy: find HS deal names that contain the property name
    const stripped = cleanName.replace(/^the /, '');
    const candidates = [];
    for (const [hsName, dealId] of Object.entries(dealMap)) {
      // Exact substring match on full name or without "the"
      if (hsName.includes(cleanName) || hsName.includes(stripped)) {
        candidates.push({ hsName, dealId, score: 2 });
      }
    }

    // If no direct match, try matching significant words (3+ chars)
    if (!candidates.length) {
      const words = stripped.split(/\s+/).filter(w => w.length >= 3);
      if (words.length >= 1) {
        for (const [hsName, dealId] of Object.entries(dealMap)) {
          const matchCount = words.filter(w => hsName.includes(w)).length;
          // Require all significant words to match
          if (matchCount === words.length) {
            candidates.push({ hsName, dealId, score: 1 });
          }
        }
      }
    }

    if (candidates.length >= 1) {
      // Pick highest score, then shortest name (most specific)
      candidates.sort((a, b) => b.score - a.score || a.hsName.length - b.hsName.length);
      _hsCache[key] = `https://app.hubspot.com/contacts/${HS_PORTAL}/deal/${candidates[0].dealId}`;
    } else {
      _hsCache[key] = null;
    }
    return _hsCache[key];
  }

  // Parse deinstalls — each row is one unit
  const validDeinstalls = deinstalls.filter(d => {
    const dt = parseDate(d['Deinstall_Date'] || d['Requested Date']);
    return dt && !isNaN(dt);
  }).map(d => ({
    ...d,
    deinstallDate: parseDate(d['Deinstall_Date'] || d['Requested Date']),
    requestDate: parseDate(d['Requested Date']),
    property: d['Property Name'] || '—',
    market: d['Market'] || '—',
    partner: d['Partner'] || '—',
    rep: d['AP_Sales_Person'] || '',
    reason: d['Reason'] || d['Reason '] || '—'
  }));

  const curDeinstalls = validDeinstalls.filter(d => d.deinstallDate.getFullYear() === CUR_YEAR);
  const prevDeinstalls = validDeinstalls.filter(d => d.deinstallDate.getFullYear() === PREV_YEAR);

  // Filter deals with valid sign dates
  const validDeals = deals.filter(d => {
    const dt = parseDate(d['Contract Signed Date']);
    return dt && !isNaN(dt);
  }).map(d => ({
    ...d,
    signDate: parseDate(d['Contract Signed Date']),
    units: parseInt(d['Total Unit Count']) || 0,
    renewalDate: addMonths(parseDate(d['Contract Signed Date']), 12),
    rep: d['AP Sales Person'] || '',
    partner: d['Partner'] || '—',
    property: d['Property Name'] || '—',
    market: d['Market'] || '—'
  }));

  const curDeals = validDeals.filter(d => d.signDate.getFullYear() === CUR_YEAR);
  const prevDeals = validDeals.filter(d => d.signDate.getFullYear() === PREV_YEAR);

  // Current period boundaries
  const curMonth = NOW.getMonth();
  const curQuarter = getQuarter(NOW);
  const curWeek = getWeekNum(NOW);

  // YTD: up to current date equivalent
  const ytdCur = curDeals.filter(d => d.signDate <= NOW);
  const prevYtdEnd = new Date(PREV_YEAR, curMonth, NOW.getDate());
  const ytdPrev = prevDeals.filter(d => d.signDate <= prevYtdEnd);

  // Quarter
  const qCur = curDeals.filter(d => getQuarter(d.signDate) === curQuarter);
  const qPrev = prevDeals.filter(d => getQuarter(d.signDate) === curQuarter && d.signDate <= new Date(PREV_YEAR, NOW.getMonth(), NOW.getDate()));

  // Month
  const mCur = curDeals.filter(d => d.signDate.getMonth() === curMonth);
  const mPrev = prevDeals.filter(d => d.signDate.getMonth() === curMonth && d.signDate.getDate() <= NOW.getDate());

  // Week
  const wCur = curDeals.filter(d => getWeekNum(d.signDate) === curWeek);
  const wPrev = prevDeals.filter(d => getWeekNum(d.signDate) === curWeek);

  const sum = (arr) => arr.reduce((s, d) => s + d.units, 0);

  // Deinstall metrics (each row = 1 unit)
  const diYtdCur = curDeinstalls.filter(d => d.deinstallDate <= NOW);
  const diYtdPrev = prevDeinstalls.filter(d => d.deinstallDate <= prevYtdEnd);
  const diMonthCur = curDeinstalls.filter(d => d.deinstallDate.getMonth() === curMonth);
  const diMonthPrev = prevDeinstalls.filter(d => d.deinstallDate.getMonth() === curMonth && d.deinstallDate.getDate() <= NOW.getDate());
  const diQtrCur = curDeinstalls.filter(d => getQuarter(d.deinstallDate) === curQuarter);
  const diQtrPrev = prevDeinstalls.filter(d => getQuarter(d.deinstallDate) === curQuarter && d.deinstallDate <= new Date(PREV_YEAR, NOW.getMonth(), NOW.getDate()));

  // Net units = new installs - deinstalls
  const netUnitsYtd = sum(ytdCur) - diYtdCur.length;
  const netUnitsYtdPrev = sum(ytdPrev) - diYtdPrev.length;
  const netUnitsMonth = sum(mCur) - diMonthCur.length;
  const netUnitsMonthPrev = sum(mPrev) - diMonthPrev.length;

  function badge(cur, prev) {
    const diff = cur - prev;
    if (diff > 0) return `<span class="kpi-badge ahead"><svg viewBox="0 0 12 12"><path d="M6 2L10 8H2L6 2Z" fill="currentColor"/></svg>+${fmt(diff)} vs ${PREV_YEAR}</span>`;
    if (diff < 0) return `<span class="kpi-badge behind"><svg viewBox="0 0 12 12"><path d="M6 10L2 4H10L6 10Z" fill="currentColor"/></svg>${fmt(diff)} vs ${PREV_YEAR}</span>`;
    return `<span class="kpi-badge neutral">= ${PREV_YEAR}</span>`;
  }

  // Sparkline helper: returns HTML for 6-month mini bar chart
  function sparkline(monthlyValues) {
    const max = Math.max(...monthlyValues, 1);
    return `<div class="sparkline">${monthlyValues.map(v => `<div class="spark-bar" style="height:${Math.max((v/max)*100, 5)}%"></div>`).join('')}</div>`;
  }

  // Monthly data for sparklines (last 6 months with data)
  const sparkMonths = [];
  for (let m = Math.max(0, curMonth - 5); m <= curMonth; m++) {
    sparkMonths.push({
      newUnits: curDeals.filter(d => d.signDate.getMonth() === m).reduce((s,d) => s + d.units, 0),

      diUnits: curDeinstalls.filter(d => d.deinstallDate.getMonth() === m).length
    });
  }
  const sparkNet = sparkMonths.map(m => Math.max(m.newUnits - m.diUnits, 0));
  const sparkDeals = sparkMonths.map(m => m.deals);
  const sparkDi = sparkMonths.map(m => m.diUnits);

  // Pitch metrics
  const pitchThisWeek = pitchData.byWeek?.thisWeek || 0;
  const pitchLastWeek = pitchData.byWeek?.lastWeek || 0;
  const pitchesByRep = pitchData.byRep || {};
  const monthlyPitchesByRep = pitchData.monthlyByRep || {};
  const lastWeekByRep = pitchData.lastWeekByRep || {};
  const lastMonthByRep = pitchData.lastMonthByRep || {};
  const pitchRepsSorted = Object.entries(pitchesByRep).sort((a, b) => b[1] - a[1]);
  // Week label: "Mon – [Today]"
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pitchWeekLabel = 'Mon – ' + dayNames[NOW.getDay()];
  const pitchMonthKey = CUR_YEAR + '-' + String(curMonth + 1).padStart(2, '0');
  const prevPitchMonthKey = PREV_YEAR + '-' + String(curMonth + 1).padStart(2, '0');

  const lastMonthKey = curMonth === 0 ? (CUR_YEAR - 1) + '-12' : CUR_YEAR + '-' + String(curMonth).padStart(2, '0');
  const pitchLastMonth = pitchData.byMonth[lastMonthKey] || 0;
  const pitchThisMonth = pitchData.byMonth[pitchMonthKey] || 0;
  const pitchPrevMonth = pitchData.byMonth[prevPitchMonthKey] || 0;
  // YTD pitches
  let pitchYtdCur = 0, pitchYtdPrev = 0;
  Object.entries(pitchData.byMonth).forEach(([k, v]) => {
    if (k.startsWith(CUR_YEAR + '-') && parseInt(k.split('-')[1]) <= curMonth + 1) pitchYtdCur += v;
    if (k.startsWith(PREV_YEAR + '-') && parseInt(k.split('-')[1]) <= curMonth + 1) pitchYtdPrev += v;

  // Spark for pitches (monthly)
  const sparkPitches = [];

  }

  // Pitch category breakdowns (unique-company counts per window per category).
  // Backend keys: 'New Logo' | 'Expansion Existing' | 'Expansion New' | 'Other'
  const pitchCat = pitchData.byCategory || { thisWeek:{}, lastWeek:{}, thisMonth:{}, lastMonth:{} };
  const pitchRepCat = pitchData.byRepCategory || { thisWeek:{}, lastWeek:{}, thisMonth:{}, lastMonth:{} };
  const CAT_ORDER = ['New Logo', 'Expansion Existing', 'Expansion New', 'Other'];
  const CAT_SHORT = { 'New Logo': 'NL', 'Expansion Existing': 'EE', 'Expansion New': 'EN', 'Other': 'UT' };
  const CAT_LONG = { 'New Logo': 'New Logo', 'Expansion Existing': 'Expansion Existing', 'Expansion New': 'Expansion New', 'Other': 'Untagged' };
  function catBreakdownLine(catCounts) {
    const parts = CAT_ORDER.map(c => CAT_SHORT[c] + ' ' + (catCounts[c] || 0));
    return parts.join(' · ');
  }

  // Deal type breakdown
  const dealTypeMap = {};
  curDeals.forEach(d => {
    const dt = (d['Deal Type'] || '').trim() || 'Other';
    if (!dealTypeMap[dt]) dealTypeMap[dt] = { deals: 0, units: 0 };
    dealTypeMap[dt].deals++;
    dealTypeMap[dt].units += d.units;
  });
  const dealTypeColors = { 'New Partner': 'var(--green-light)', 'Partner Expansion': 'var(--blue-glow)', 'Property Expansion': 'var(--yellow)', 'Other': 'var(--silver)' };

  // Top partners by new units (installs)
  const partnerInstallMap = {};
  ytdCur.forEach(d => {
    const p = d.partner && d.partner !== '—' ? d.partner.trim() : null;
    if (!p) return;
    if (!partnerInstallMap[p]) partnerInstallMap[p] = 0;
    partnerInstallMap[p] += d.units;
  });
  const topPartners = Object.entries(partnerInstallMap).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const maxPartnerInstall = topPartners.length ? topPartners[0][1] : 1;

  // Renewals
  const renewals = validDeals.map(d => ({
    ...d,
    daysUntilRenewal: daysBetween(NOW, d.renewalDate)
  })).filter(d => d.daysUntilRenewal >= -30 && d.daysUntilRenewal <= 365)
    .sort((a, b) => a.renewalDate - b.renewalDate);

  const urgentRenewals = renewals.filter(d => d.daysUntilRenewal <= 30);
  const soonRenewals = renewals.filter(d => d.daysUntilRenewal > 30 && d.daysUntilRenewal <= 90);
  const upcomingRenewals = renewals.filter(d => d.daysUntilRenewal > 0 && d.daysUntilRenewal <= 180);

  // Monthly renewal sums (next 12 months)
  const renewalMonths = [];
  for (let i = 0; i < 12; i++) {
    const mStart = new Date(CUR_YEAR, curMonth + i, 1);
    const mEnd = new Date(CUR_YEAR, curMonth + i + 1, 0);
    const mRenewals = renewals.filter(d => d.renewalDate >= mStart && d.renewalDate <= mEnd);
    renewalMonths.push({
      label: MONTH_NAMES[mStart.getMonth()] + ' ' + String(mStart.getFullYear()).slice(2),
      units: sum(mRenewals),
      deals: mRenewals.length,
      isUrgent: i === 0,
      isSoon: i === 1 || i === 2
    });
  }
  const maxRenewalUnits = Math.max(...renewalMonths.map(m => m.units), 1);

  // Rep leaderboard (current year) — include all AP reps even if 0 deals
  const AP_REPS = ['Wells', 'Scout', 'Jack', 'Sophia', 'Ghislain', 'Jason', 'Richard', 'Nolan', 'Raegan', 'Xander', 'Renato'];
  // Former reps — explicitly excluded from scorecard even if they appear in
  // historical deal data or HubSpot owner records. Their deals still count
  // toward team YTD totals; they just don't get their own row.
  const FORMER_REPS = new Set(['John', 'Ashtyn']);
  const repMap = {};
  AP_REPS.forEach(name => { repMap[name] = { deals: 0, units: 0 }; });
  curDeals.forEach(d => {
    let name = extractFirstName(d.rep);
    if (name === '—' || !d.rep.includes('@')) return;
    // Normalize "Jasoncreel" to "Jason"
    if (name.toLowerCase() === 'jasoncreel') name = 'Jason';
    if (FORMER_REPS.has(name)) return;
    if (!repMap[name]) repMap[name] = { deals: 0, units: 0 };
    repMap[name].deals++;
    repMap[name].units += d.units;
  });
  const reps = Object.entries(repMap).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.units - a.units);

  // ─── REP SCORECARD DATA ───
  const repScorecard = {};
  AP_REPS.forEach(name => {
    repScorecard[name] = { ytdDeals: 0, ytdUnits: 0, monthDeals: 0, monthUnits: 0, monthPitches: 0, weekPitches: 0, lastWeekPitches: 0, lastMonthPitches: 0 };
  });
  curDeals.forEach(d => {
    let name = extractFirstName(d.rep);
    if (name === '—' || !d.rep.includes('@')) return;
    if (name.toLowerCase() === 'jasoncreel') name = 'Jason';
    if (FORMER_REPS.has(name)) return;
    if (!repScorecard[name]) repScorecard[name] = { ytdDeals: 0, ytdUnits: 0, monthDeals: 0, monthUnits: 0, monthPitches: 0, weekPitches: 0, lastWeekPitches: 0, lastMonthPitches: 0 };
    repScorecard[name].ytdDeals++;
    repScorecard[name].ytdUnits += d.units;
    if (d.signDate.getMonth() === curMonth) {
      repScorecard[name].monthDeals++;
      repScorecard[name].monthUnits += d.units;
    }
  });
  Object.entries(monthlyPitchesByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].monthPitches = count;
    else repScorecard[name] = { ytdDeals: 0, ytdUnits: 0, monthDeals: 0, monthUnits: 0, monthPitches: count, weekPitches: 0 };
  });
  Object.entries(pitchesByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].weekPitches = count;
    else repScorecard[name] = { ytdDeals: 0, ytdUnits: 0, monthDeals: 0, monthUnits: 0, monthPitches: 0, weekPitches: count, lastWeekPitches: 0, lastMonthPitches: 0 };
  });
  Object.entries(lastWeekByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].lastWeekPitches = count;
  });
  Object.entries(lastMonthByRep).forEach(([name, count]) => {
    if (FORMER_REPS.has(name)) return;
    if (repScorecard[name]) repScorecard[name].lastMonthPitches = count;
  });
  // Filter former reps from the displayed scorecard rows (catches any reps added
  // through the per-column fallbacks above that didn't go through the explicit
  // FORMER_REPS check, e.g. legacy data shapes)
  const scRows = Object.entries(repScorecard)
    .filter(([name]) => !FORMER_REPS.has(name))
    .sort((a, b) => b[1].ytdUnits - a[1].ytdUnits);
  const scTotals = scRows.reduce((t, [, v]) => ({ ytdDeals: t.ytdDeals + v.ytdDeals, ytdUnits: t.ytdUnits + v.ytdUnits, monthDeals: t.monthDeals + v.monthDeals, monthUnits: t.monthUnits + v.monthUnits, monthPitches: t.monthPitches + v.monthPitches, weekPitches: t.weekPitches + v.weekPitches }), { ytdDeals: 0, ytdUnits: 0, monthDeals: 0, monthUnits: 0, monthPitches: 0, weekPitches: 0, lastWeekPitches: 0, lastMonthPitches: 0 });

  // Per-column rankings for badge display (top 2 in each non-YTD metric)
  const colRanks = {};
  ['monthDeals','monthUnits','weekPitches','monthPitches'].forEach(col => {
    const sorted = scRows.slice().filter(r => r[1][col] > 0).sort((a, b) => b[1][col] - a[1][col]);
    colRanks[col] = {};
    let rank = 0, prevVal = -1;
    sorted.forEach((r, i) => {
      const val = r[1][col];
      if (val !== prevVal) rank = i + 1;
      if (rank <= 3) colRanks[col][r[0]] = rank;
      prevVal = val;
    });
  });
  function scBadge(name, col, val) {
    if (val === 0) return '<span class="sc-zero">&mdash;</span>';
    const rank = colRanks[col] && colRanks[col][name];
    if (!rank) return fmt(val);
    const colors = { 1: 'var(--blue-glow)', 2: 'var(--silver)', 3: 'var(--silver)' };
    return '<span style="position:relative">' + fmt(val) +
      '<span style="position:absolute;top:-8px;right:-10px;font-size:0.5rem;font-weight:700;color:' + colors[rank] + ';letter-spacing:0">#' + rank + '</span></span>';
  }

  // ─── BUILD HTML ───
  let html = '';

  // ─── PRIMARY HERO: Rep Scorecard ───
  const dtEntries = Object.entries(dealTypeMap).sort((a,b) => b[1].units - a[1].units);

  html += `<div class="scorecard scorecard--editorial" style="margin-bottom:1.25rem">
      <div class="section-header scorecard-header">
        <div class="section-title scorecard-title">Rep Scorecard</div>
        <div class="scorecard-period">
          <span class="scorecard-period__main">${MONTH_NAMES[curMonth]} ${CUR_YEAR}</span>
          <span class="scorecard-period__sep">·</span>
          <span class="scorecard-period__sub">12 reps · YTD ${CUR_YEAR}</span>
        </div>
      </div>
      <div class="table-wrap">
        <table class="scorecard-table">
          <thead>

              <th rowspan="3" class="rep-head">Rep</th>
              <th colspan="2" rowspan="2" class="cg-ytd">Year to Date</th>
              <th colspan="2" rowspan="2" class="cg-month col-div">${MONTH_NAMES[curMonth]}</th>
              <th colspan="4" class="cg-pitch col-div">Pitches This Week</th>

            </tr>
          </thead>

            <td class="col-div">${fmt(scTotals.monthDeals)}</td>

            <td class="pitch-sigma col-sigma">${fmt(pitchThisWeek)}<div class="pitch-delta" style="color:${pitchThisWeek >= pitchLastWeek ? 'var(--green-light)' : 'var(--orange-light)'}"><span class="pitch-delta__glyph">${pitchThisWeek - pitchLastWeek > 0 ? '▲' : pitchThisWeek - pitchLastWeek < 0 ? '▼' : '·'}</span>${pitchThisWeek - pitchLastWeek >= 0 ? '+' : ''}${fmt(pitchThisWeek - pitchLastWeek)}</div></td>

        var glyphSpan = deltaGlyph ? '<span class="pitch-delta__glyph">' + deltaGlyph + '</span>' : '';
        return topPart + '<div class="pitch-delta" style="color:' + deltaColor + '">' + glyphSpan + deltaText + '</div>';
      };
      return '<tr class="' + (isTop ? 'sc-top' : '') + '">' +
        '<td><span class="sc-rank ' + (isTop ? 'top' : '') + (i === 0 ? ' rank-1' : i === 1 ? ' rank-2' : i === 2 ? ' rank-3' : '') + '">' + (i + 1) + '</span><span class="sc-avatar">' + initials + '</span>' + name + '</td>' +
        '<td>' + zd(v.ytdDeals) + '</td>' +
        '<td class="sc-bar-cell ' + (isTop ? 'sc-highlight' : '') + '">' + zd(v.ytdUnits) + '<div class="sc-bar"><div class="sc-bar-fill" style="width:' + barWidth + '%"></div></div></td>' +
        '<td class="col-div">' + scBadge(name, 'monthDeals', v.monthDeals) + '</td>' +
        '<td>' + scBadge(name, 'monthUnits', v.monthUnits) + '</td>' +
        '<td class="col-div pitch-newlogo">' + zd(wkCats['New Logo'] || 0) + '</td>' +
        '<td class="exp-band-first pitch-exp">' + zd(wkCats['Expansion New'] || 0) + '</td>' +
        '<td class="pitch-exp">' + zd(wkCats['Expansion Existing'] || 0) + '</td>' +
        '<td class="pitch-sigma col-sigma">' + totalCell(v.weekPitches, v.lastWeekPitches, 'weekPitches') + '</td>' +
        '<td class="col-div pitch-newlogo">' + zd(moCats['New Logo'] || 0) + '</td>' +
        '<td class="exp-band-first pitch-exp">' + zd(moCats['Expansion New'] || 0) + '</td>' +
        '<td class="pitch-exp">' + zd(moCats['Expansion Existing'] || 0) + '</td>' +
        '<td class="pitch-sigma col-sigma">' + totalCell(v.monthPitches, v.lastMonthPitches, 'monthPitches') + '</td>' +
      '</tr>';
    }).join('');
  }

  // Store data for chart rendering
  window._dashData = { curDeals, prevDeals, validDeals };
  setView('monthly');

  document.getElementById('last-updated').innerHTML = 'Updated ' + NOW.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '<span style="opacity:0.5;margin-left:6px">· Sources: New Deal Sheet + HubSpot AP Pipeline · Auto-refreshes every hour</span>';
}

// ─── CHART RENDERING ───
let currentView = 'monthly';
let currentMetric = 'deals';

function setView(view) {
  currentView = view;
  document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === view));
  renderChart();
}

function setMetric(metric) {
  currentMetric = metric;
  document.querySelectorAll('.metric-toggle .metric-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === metric));
  renderChart();
}

function renderChart() {
  const { curDeals, prevDeals } = window._dashData;
  const area = document.getElementById('chart-area');
  if (!area) return;

  const sum = (arr) => arr.reduce((s, d) => s + d.units, 0);
  const metric = currentMetric === 'units' ? (arr) => sum(arr) : (arr) => arr.length;

  let buckets = [];

  if (currentView === 'monthly') {
    for (let m = 0; m < 12; m++) {
      const cur = curDeals.filter(d => d.signDate.getMonth() === m);
      const prev = prevDeals.filter(d => d.signDate.getMonth() === m);
      // Only show months up to current month for current year
      const isFuture = m > NOW.getMonth();
      buckets.push({ label: MONTH_NAMES[m], cur: isFuture ? 0 : metric(cur), prev: metric(prev), isFuture });
    }
  } else if (currentView === 'quarterly') {
    for (let q = 0; q < 4; q++) {
      const cur = curDeals.filter(d => getQuarter(d.signDate) === q);
      const prev = prevDeals.filter(d => getQuarter(d.signDate) === q);
      const isFuture = q > getQuarter(NOW);
      buckets.push({ label: QUARTER_NAMES[q], cur: isFuture ? 0 : metric(cur), prev: metric(prev), isFuture });
    }
  } else if (currentView === 'weekly') {
    // Show last 12 weeks
    const curWeek = getWeekNum(NOW);
    for (let w = Math.max(1, curWeek - 11); w <= curWeek; w++) {
      const cur = curDeals.filter(d => getWeekNum(d.signDate) === w);
      const prev = prevDeals.filter(d => getWeekNum(d.signDate) === w);
      buckets.push({ label: `Wk ${w}`, cur: metric(cur), prev: metric(prev), isFuture: false });
    }
  }

  const maxVal = Math.max(...buckets.flatMap(b => [b.cur, b.prev]), 1);

  area.innerHTML = `<div class="chart-container">
    ${buckets.map(b => {
      const diff = b.cur - b.prev;
      const cls = b.isFuture ? 'neutral' : diff > 0 ? 'ahead' : diff < 0 ? 'behind' : 'neutral';
      const sign = diff > 0 ? '+' : '';
      return `<div class="chart-row">
        <div class="chart-label">${b.label}</div>
        <div class="chart-bars">
          <div class="bar-track"><div class="bar-fill current" style="width:${(b.cur / maxVal) * 100}%">${b.cur || ''}</div></div>
          <div class="bar-track"><div class="bar-fill previous" style="width:${(b.prev / maxVal) * 100}%">${b.prev || ''}</div></div>
        </div>
        <div class="chart-delta ${cls}">${b.isFuture ? '—' : (diff === 0 ? '=' : sign + diff)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

// ─── FETCH & BOOT ───
async function boot() {
  try {
    // Fetch sheets + HubSpot deal mapping in parallel
    const [resp, diResp, hsResp] = await Promise.all([
      fetch(SHEET_CSV),
      fetch(DEINSTALL_CSV),
      fetch(HS_DEALS_API).catch(() => null) // don't block on HS failure
    ]);
    if (!resp.ok) throw new Error(`Deals HTTP ${resp.status}`);
    if (!diResp.ok) throw new Error(`Deinstalls HTTP ${diResp.status}`);
    const [text, diText] = await Promise.all([resp.text(), diResp.text()]);
    const deals = parseCSV(text);
    const deinstalls = parseCSV(diText).filter(d => d['Property Name']);

    // Parse HubSpot data (graceful fallback if unavailable)
    let dealMap = {}, pitchData = { byWeek: {}, byMonth: {}, total: 0 };
    if (hsResp && hsResp.ok) {
      const hsData = await hsResp.json();
      dealMap = hsData.deals || {};
      pitchData = hsData.pitches || pitchData;
      console.log('HubSpot deals loaded:', hsData.count, 'Pitches:', pitchData.total);
    } else {
      console.log('HubSpot data unavailable');
    }

    console.log('Parsed deals:', deals.length, 'Deinstalls:', deinstalls.length);
    if (!deals.length) throw new Error('No data parsed');
    render(deals, deinstalls, dealMap, pitchData);
  } catch (err) {
    console.error(err);
    document.getElementById('app').innerHTML = `
      <div class="error-card">
        <h2>Unable to Load Data</h2>
        <p>The dashboard couldn't access the Google Sheet. This usually means the sheet isn't publicly shared.</p>
        <ol>
          <li>Open the <a href="https://docs.google.com/spreadsheets/d/1Mt_laFNgojNhNMHPYrlQo85dDywjWTF7W2YohR5M520/edit" target="_blank" style="color:var(--blue-glow)">New Deal Worksheet</a></li>
          <li>Click <strong>Share</strong> in the top right</li>
          <li>Under "General access," select <strong>Anyone with the link</strong></li>
          <li>Set permission to <strong>Viewer</strong></li>
          <li>Refresh this dashboard</li>
        </ol>
        <p style="margin-top:1rem;font-size:0.78rem;">Error: <code>${err.message}</code></p>
      </div>
    `;
  }
}

boot();

// Auto-refresh every 60 minutes for TV/monitor display
setInterval(() => location.reload(), 60 * 60 * 1000);
</script>
